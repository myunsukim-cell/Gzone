<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국존 학생 첫 화면 v5 — 내 목표 한 바퀴</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#1E3A2F;--deep2:#2D5444;--gold:#F2C14E;--ink:#1F2421;--paper:#F6F4EE;--line:#E3DFD3;--dim:#6B6F68;--teal:#1D5C57;--red:#9A3412;--done:#2E7D4F;--todo:#D9D4C6}
[hidden]{display:none!important}*{box-sizing:border-box}html,body{margin:0;background:#E4E0D5;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif}
.demo{position:relative;z-index:5;background:#1F2421;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}.demo b{color:var(--gold);margin:0 4px 0 8px}
.demo button{font:inherit;font-size:12px;min-height:34px;padding:0 10px;border-radius:17px;border:1px solid #555;background:transparent;color:#ddd;cursor:pointer}.demo button.on{background:var(--gold);color:var(--deep);border-color:var(--gold)}
.wrap{display:flex;justify-content:center;padding:14px 12px 40px}
.phone{width:400px;max-width:100%;background:var(--paper);border-radius:28px;border:8px solid #1F2421;min-height:860px;display:flex;flex-direction:column;overflow:hidden}
.tab{width:1060px;max-width:100%;background:var(--paper);border-radius:18px;border:10px solid #1F2421;min-height:720px;display:grid;grid-template-columns:460px 1fr;overflow:hidden}
header{padding:16px 20px 0;display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--dim)}header b{color:var(--ink);font-size:16px}
.goal{margin:12px 20px 0;background:var(--deep);color:#fff;border-radius:16px;padding:12px 16px}
.goal .k{font-size:11px;color:var(--gold);letter-spacing:.04em}.goal .t{font-family:'Gowun Batang',serif;font-size:19px;margin-top:2px}.goal .m{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:#D6E2DA}
.goal .m i{display:inline-block;width:11px;height:11px;border-radius:50%;background:#2D5444;border:1px solid #6b8f7a}.goal .m i.on{background:var(--gold);border-color:var(--gold)}
.wheel{position:relative;margin:6px auto 0;width:340px;height:340px}
.wheel svg{width:100%;height:100%;display:block}
.st{position:absolute;width:62px;margin-left:-31px;text-align:center;font-size:11px;line-height:1.25;color:var(--dim);cursor:pointer;user-select:none}
.st b{display:block;width:30px;height:30px;line-height:30px;margin:0 auto 3px;border-radius:50%;background:#fff;border:2px solid var(--todo);color:var(--dim);font-size:12px;font-weight:700}
.st.done b{background:var(--done);border-color:var(--done);color:#fff}.st.now b{background:var(--gold);border-color:var(--gold);color:var(--deep);box-shadow:0 0 0 6px rgba(242,193,78,.28)}.st.now{color:var(--ink);font-weight:700}
.st.pick b{outline:3px solid var(--deep);outline-offset:2px}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;text-align:center}
.center .n{font-family:'Gowun Batang',serif;font-size:15px;color:var(--deep);line-height:1.35}.center .s{font-size:11px;color:var(--dim);margin-top:4px}
.help{position:absolute;right:0;top:0;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font:inherit;font-size:16px;cursor:pointer}
.card{margin:12px 20px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card .k{font-size:12px;color:var(--red);font-weight:700}.card h2{font-family:'Gowun Batang',serif;font-size:21px;margin:6px 0 4px;line-height:1.35}.card .sub{font-size:13px;color:var(--dim);line-height:1.6}
.go{display:block;width:100%;font:inherit;font-size:16px;min-height:50px;border:0;border-radius:12px;background:var(--deep);color:#fff;cursor:pointer;margin-top:12px}.go.soft{background:#fff;color:var(--deep);border:1px solid var(--deep)}
.three{margin:12px 20px 0;background:#FFF8E1;border:1px solid var(--gold);border-radius:16px;padding:14px 16px;font-size:13.5px;line-height:1.7}
.three b{font-family:'Gowun Batang',serif;font-size:16px;display:block;margin-bottom:4px}.three .r{display:flex;gap:8px}.three .r span:first-child{min-width:52px;color:var(--dim)}
.tabs{margin:16px 20px 30px;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.tabs div{text-align:center;padding:12px 0;font-size:13px;color:var(--dim);border-right:1px solid var(--line)}.tabs div:last-child{border:0}.tabs div.on{color:var(--deep);font-weight:700;background:#E4EFE8}
/* 태블릿 */
.side{background:var(--deep);color:#fff;padding:22px;display:flex;flex-direction:column;gap:12px}
.side .wheel{width:400px;height:400px}.side .st{color:#D6E2DA}.side .st b{background:#2D5444;border-color:#4a7560;color:#D6E2DA}.side .st.done b{background:#8CC9A6;border-color:#8CC9A6;color:var(--deep)}.side .st.now{color:#fff}
.side .center .n{color:#fff}.side .center .s{color:#D6E2DA}.side svg circle.ring{stroke:#4a7560}
.side .goal{margin:0;background:#2D5444}
.pane{padding:30px 36px;display:flex;flex-direction:column;gap:16px}.pane .card{margin:0}.pane .card h2{font-size:28px}.pane .three{margin:0}.pane .go{max-width:360px}
.tour{position:absolute;inset:0;background:rgba(31,36,33,.55);display:flex;align-items:flex-end;justify-content:center;padding:24px;z-index:3;border-radius:20px}
.tour .box{background:#fff;border-radius:16px;padding:16px 18px;max-width:360px;width:100%}
.tour .box .k{font-size:12px;color:var(--dim)}.tour .box .q{font-family:'Gowun Batang',serif;font-size:17px;line-height:1.5;margin:6px 0 10px}.tour .box .b{display:flex;gap:8px}.tour .box button{font:inherit;font-size:14px;min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}.tour .box button.p{background:var(--deep);color:#fff;border-color:var(--deep)}
.frame{position:relative}
</style></head><body>
<div class="demo"><b>기기</b><button data-d="p" class="on">휴대폰</button><button data-d="t">태블릿·수업 중</button><b>지금 여기</b><span id="sits"></span><b>처음 로그인</b><button id="tourBtn">안내 다시 보기</button></div>
<div class="wrap" id="wrap"></div>
<script>
const ST=[
 {id:0,k:'W0',n:'목표',why:'「국어는 감이 아니라 데이터」 — 목표는 점수·기한·이유 세 가지로 적어요. 기한은 우리 가족이 골라요.',app:'목표·마일스톤·D-day를 늘 맨 위에 둬요.',me:'선생님과 목표 한 줄, 이유 한 줄.',line:'85점 · 11/23 · 「시험이 두렵지 않게」',head:'내 목표 다시 보기',btn:'목표 고치기'},
 {id:1,k:'W1',n:'과제',why:'「강의 다음이 공부」 — 강의를 들은 뒤 예습으로 내 것을 만들어요.',app:'오늘 과제 하나와 교안·영상을 열어 줘요.',me:'열고, 풀고, 제출. 제출이 곧 완료.',line:'이번 주 3개 중 2개',head:'오늘 과제 — 서술형 3문항',sub:'마감 내일 18:00 · 20분',btn:'열기',soft:'오늘은 못 해요'},
 {id:2,k:'W2',n:'오늘의<br>문제',why:'「우리 아이 약점의 이름」 — 틀린 문제는 버려지지 않고 유형 이름이 붙어요.',app:'내가 자주 틀리는 유형 1건을 매일 꺼내고, 같은 습관 새 5문항을 뽑아 줘요.',me:'하루 1건. 틀리면 왜·처방 읽기.',line:'극복 3 · 오답 7',head:'오늘의 문제 1건 — 핵심어 바꿈',sub:'5번 맞히면 극복 1개',btn:'풀기'},
 {id:3,k:'W3',n:'못 한 날',why:'「약속 대신 기록」 — 못 한 날도 기록이 되면 숨길 일이 없어요.',app:'과제관리 시간에 자동으로 편성해요.',me:'「오늘은 못 해요」 한 번 누르기.',line:'이번 달 1번 → 과제관리 시간에 끝냄',head:'못 한 과제 — 과제관리 시간에 같이',sub:'수요일 17:00 · 정아 선생님',btn:'알겠어요'},
 {id:4,k:'W4',n:'수업 전',why:'「시작은 시간표 하나」 — 앉자마자 시작해요.',app:'지난주 목표 셋을 보여 줘요.',me:'오늘 꼭 해결할 하나를 골라 보내기.',line:'월 「틀린 이유 쓰기」',head:'오늘 수업에서 꼭 해결할 목표는?',sub:'지난주 목표 중 하나',btn:'보내기'},
 {id:5,k:'W5',n:'수업<br>1·2·3교시',why:'「혼자 못 채우는 자리를 수업이 개별로 채워요」 — 혼자 읽어내는 힘을 매주 확인해요.',app:'1교시 나아진 것, 2교시 시험지, 3교시 채점·다음 주.',me:'확인 → 실전 → 다음 주 목표 3개.',line:'월 18:00 · 지난주 9/12',head:'1교시 — 지난주보다 나아진 것',sub:'서술형 근거 찾기 3분 20초 → 1분 50초',btn:'틀린 2문항 선생님과 보기'},
 {id:6,k:'W6',n:'내신 준비',why:'「학교가 다르면 공부법이 달라요」 — 내신은 범위 본문을 완전히 내 것으로. 안 읽고도 풀 만큼.',app:'우리 학교 범위·기출 유형·자료집 회차를 대 줘요.',me:'남은 작품 하나, 자료집 한 회차.',line:'D-48 · 범위 6작품 중 4 · 자료집 2/5',head:'남은 범위 — 토지',sub:'오늘 자료집 3회 · 40분',btn:'시작'},
 {id:7,k:'W7',n:'직전',why:'「같은 3등급, 다른 원인」 — 마지막엔 내 약한 유형만.',app:'약한 유형 5문항을 뽑아 줘요.',me:'풀고 끝. 새 범위 추가 없음.',line:'약한 유형 2개',head:'D-3 — 내가 약한 유형 5문항',sub:'핵심어 바꿈 · 범주 섞음',btn:'풀기'},
 {id:8,k:'W8',n:'복기',why:'「해설로 끝나지 않습니다 — 스스로 고치는 여섯 단」 — 점수보다 먼저 넘어선 것을 봐요.',app:'점수를 뒤로 두고 넘어선 것 1·틀린 3문항을 먼저 보여 줘요.',me:'틀린 3문항 다시 풀고 「다음엔」 한 줄.',line:'시험 뒤 열려요',head:'지난 시험보다 넘어선 것',sub:'서술형 근거 쓰기 0개 → 2개',btn:'틀린 3문항 다시 풀기',soft:'점수 보기'},
 {id:9,k:'W10',n:'목표<br>닫기',why:'「두 달의 실제 궤적」 — 목표는 기록으로 판정하고 다음 목표를 세워요.',app:'이룸·못 이룸·기한 조정을 보여 주고 부모님께 한 장 보내요.',me:'다음 목표 한 줄 → 다시 W0.',line:'복기 뒤 열려요',head:'이번 목표 — 85점',sub:'결과 82점 · 서술형 재발 0 달성',btn:'다음 목표 세우기'}];
const SITS=[{n:'수업 없는 날',now:1,done:[0]},{n:'수업 전',now:4,done:[0,1,2]},{n:'수업 중',now:5,done:[0,1,2,3,4]},{n:'내신 준비',now:6,done:[0,1,2,3,4,5]},{n:'시험 복기',now:8,done:[0,1,2,3,4,5,6,7]},{n:'목표 닫기',now:9,done:[0,1,2,3,4,5,6,7,8]}];
let st={d:'p',sit:0,pick:null,tour:-1};
const $=id=>document.getElementById(id);
function wheel(size){const r=size/2-44,cx=size/2,cy=size/2;const s=SITS[st.sit];
 let h='<svg viewBox="0 0 '+size+' '+size+'"><circle class="ring" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#D9D4C6" stroke-width="3"/>';
 const doneTo=Math.max(...s.done, -1);
 if(doneTo>=0){const a0=-Math.PI/2,a1=-Math.PI/2+2*Math.PI*(s.now/10);const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);h+='<path d="M'+x0+' '+y0+' A'+r+' '+r+' 0 '+(s.now/10>0.5?1:0)+' 1 '+x1+' '+y1+'" fill="none" stroke="#2E7D4F" stroke-width="4"/>';}
 h+='</svg>';
 ST.forEach((x,i)=>{const a=-Math.PI/2+2*Math.PI*i/10;const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a);const cls=(s.done.includes(i)?'done':'')+(s.now===i?' now':'')+(st.pick===i?' pick':'');
  h+='<div class="st '+cls+'" data-i="'+i+'" style="left:'+x1+'px;top:'+(y1-16)+'px"><b>'+(s.done.includes(i)?'✓':i===9?'10':i)+'</b>'+x.n+'</div>';});
 const now=ST[s.now];h+='<div class="center"><div class="n">지금 여기<br>'+now.n.replace('<br>',' ')+'</div><div class="s">'+now.line+'</div></div>';
 return h;}
function goal(){return '<div class="goal"><div class="k">내 목표 · 내가 정함</div><div class="t">2학기 기말 국어 85점 · 11/23</div><div class="m">마일스톤 <i class="on"></i><i class="on"></i><i></i><i></i> 다음: 서술형 이유 쓰기 2문항 연속 · D-48</div></div>'}
function card(){const i=st.pick!=null?st.pick:SITS[st.sit].now;const x=ST[i];
 let h='<div class="card"><div class="k">'+(st.pick!=null&&st.pick!==SITS[st.sit].now?x.k+' · 이 정거장에서 하는 것':'지금 할 일')+'</div><h2>'+x.head+'</h2>'+(x.sub?'<div class="sub">'+x.sub+'</div>':'')+'<button class="go">'+x.btn+'</button>'+(x.soft?'<button class="go soft">'+x.soft+'</button>':'')+'</div>';
 h+='<div class="three"><b>'+x.k+' '+x.n.replace('<br>',' ')+' — 국존 공부법</b><div class="r"><span>왜</span><span>'+x.why+'</span></div><div class="r"><span>앱이</span><span>'+x.app+'</span></div><div class="r"><span>내가</span><span>'+x.me+'</span></div></div>';
 return h;}
function tabs(){return '<div class="tabs"><div>내 위치</div><div class="on">내 공부</div><div>수업</div><div>내 기록</div></div>'}
function tour(){if(st.tour<0)return '';if(st.tour>=10)return '<div class="tour"><div class="box"><div class="k">첫 안내 끝</div><div class="q">이 바퀴가 국존의 공부법이에요. 목표에서 시작해서 목표로 돌아와요.<br>지금 여기는 ● 입니다.</div><div class="b"><button class="p" data-t="end">오늘 할 일 보기</button></div></div></div>';
 const x=ST[st.tour];return '<div class="tour"><div class="box"><div class="k">처음 로그인 안내 '+(st.tour+1)+'/10 · '+x.k+' '+x.n.replace('<br>',' ')+'</div><div class="q">'+x.why+'</div><div class="b"><button class="p" data-t="next">다음</button><button data-t="end">건너뛰기</button></div></div></div>';}
function phone(){return '<div class="phone frame"><header><b>이가온</b><span>'+SITS[st.sit].n+' · 🔥 12일</span></header>'+goal()+'<div class="wheel">'+wheel(340)+'<button class="help" id="help" aria-label="안내">?</button></div>'+card()+tabs()+tour()+'</div>';}
function tablet(){const s=SITS[st.sit];return '<div class="tab frame"><aside class="side"><div><div style="font-size:20px;font-weight:700">이가온</div><div style="font-size:12px;color:#D6E2DA">송도고 고1 · 월 18:00 · 정아 선생님 · '+s.n+'</div></div>'+goal()+'<div class="wheel">'+wheel(400)+'</div></aside><section class="pane">'+card()+tabs()+'</section>'+tour()+'</div>';}
function draw(){$('sits').innerHTML=SITS.map((s,i)=>'<button data-s="'+i+'" class="'+(i===st.sit?'on':'')+'">'+s.n+'</button>').join('');
 $('wrap').innerHTML=st.d==='p'?phone():tablet();document.querySelectorAll('.demo [data-d]').forEach(b=>b.classList.toggle('on',b.dataset.d===st.d));
 if(st.tour>=0&&st.tour<10){const el=document.querySelector('.st[data-i="'+st.tour+'"]');if(el)el.classList.add('pick');}}
document.querySelector('.demo').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.d){st.d=b.dataset.d;}if(b.dataset.s!=null){st.sit=+b.dataset.s;st.pick=null;}if(b.id==='tourBtn'){st.tour=0;st.pick=null;}draw();};
$('wrap').addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){if(t.dataset.t==='next')st.tour++;else st.tour=-1;draw();return;}if(e.target.id==='help'){st.tour=0;draw();return;}const s=e.target.closest('.st');if(s){const i=+s.dataset.i;st.pick=(st.pick===i)?null:i;draw();}});
draw();
</script></body></html>
