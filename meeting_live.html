<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회의 2.0</title>
<style>:root{--deep:#1E4D3B;--gold:#B8892E;--red:#A4472F;--line:#d8d4c8;--dim:#8a8577;--band:#f4f8f5}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f7f6f2;color:#1f2a24;font-size:13px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:2px solid #1f2a24}.top b{font-size:14px;color:var(--deep)}.m{font-size:11.5px;color:var(--dim)}
.wrap{display:flex;flex:1;min-height:0}.left{width:30%;overflow:auto;padding:10px 12px;background:#fff;border-right:1px solid var(--line)}.main{flex:1;overflow:auto;padding:10px 14px}
.row{border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin:5px 0;cursor:pointer;background:#fff}.row:hover{background:var(--band)}.row.sel{border-color:var(--gold);background:#fff8ea}.st{border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700;background:var(--band);color:var(--deep)}.st.x{background:#eee;color:#888}.st.g{background:#fff3dd;color:#7a4b12}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}.card h3{font-size:13px;color:var(--deep);margin-bottom:6px}.f label{display:block;font-size:11.5px;font-weight:700;margin:6px 0 2px}.f input,.f textarea,.f select{width:100%;padding:6px;border:1px solid var(--line);border-radius:5px;font-family:inherit;font-size:12.5px}
.btn{background:var(--deep);color:#fff;border:0;border-radius:6px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit}.btn.o{background:#fff;color:var(--deep);border:1.5px solid var(--deep)}.btn.g{background:var(--gold)}.rep{border-left:3px solid var(--deep);padding:6px 10px;margin:6px 0;background:#fbfaf6;font-size:12.5px}.rep b{color:var(--deep)}.rep .it{margin:2px 0}.cnt{font-size:10.5px;color:var(--dim)}
</style></head><body>
<div class="top"><b>5″ 회의 — 회의록 인트라넷 2.0</b><span class="m">§I 규격(KB-STR-소통운영): 하급자부터 5항목 보고(실적·고객 목소리 2줄·라이벌 2줄·거래처·자기 생각) → 대표는 듣고 결정 → 확정(잠금) → 덧붙임만 · 확정 시 참석자 알림함 적재</span><span class="m" id="stamp" style="margin-left:auto"></span></div>
<div class="wrap"><div class="left"><div style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><b>회의 목록</b><button class="btn o" style="margin-left:auto;padding:3px 8px;font-size:11px" onclick="newM()">+ 회의 개설</button></div><div id="list" class="m">적재 중…</div></div>
<div class="main" id="main"><div class="m">왼쪽에서 회의를 고르거나 개설하세요</div></div></div>
<script>
const U='https://qcnsadcpsonuxnjyrlez.supabase.co/rest/v1/rpc/',K='sb_publishable_stx8spRryf_4OWMFsW29Rw_XiDNfyb0',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};const $=id=>document.getElementById(id);let L=[],SEL=null,D=null;const ME=localStorage.getItem('g2me')||'';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function rpc(f,p){const r=await fetch(U+f,{method:'POST',headers:H,body:JSON.stringify(p||{})});return r.json();}
async function load(){L=await rpc('gz2_meeting_list',{p_days:180});$('stamp').textContent=new Date().toLocaleTimeString('ko-KR');$('list').innerHTML=L.map(m=>'<div class="row'+(SEL===m.id?' sel':'')+'" onclick="pick('+m.id+')"><b>'+esc(m.title)+'</b> <span class="st'+(m.status==='확정'?'':(m.status==='진행'?' g':' x'))+'">'+esc(m.status||'초안')+'</span><div class="m">'+String(m.date).slice(0,10)+' · 보고 '+m.n_reports+' · 참석 '+m.n_att+(m.secretary?' · 서기 '+esc(m.secretary):'')+'</div></div>').join('')||'<div class="m">회의 없음</div>';}
function newM(){SEL=null;$('main').innerHTML='<div class="card f"><h3>회의 개설 (원장 = 서기)</h3><label>종류</label><select id="mk" onchange="preset()"><option>회의</option><option>교육</option><option>공지</option></select><div class="m" id="mkh">회의 = 미션 발표 · 성과 보고 · 우수 사례 공유 · 주요 의사결정은 제시 후 의견 수렴만</div><label>제목</label><input id="mt" placeholder="예: 9월 1주 교사 회의"><label>미션(회의) / 교육 목표(교육)</label><input id="mm"><label>날짜</label><input id="md" type="date" value="'+new Date(Date.now()+9*36e5).toISOString().slice(0,10)+'"><label>주요 의사결정 제시(회의) / 교육 내용(교육) / 공지 본문</label><textarea id="ma" rows="2"></textarea><label>제출 항목(원장 설정 · 줄바꿈 구분)</label><textarea id="mi" rows="3">성과 보고\n우수 사례 공유\n제시된 의사결정에 대한 의견</textarea><label>서기</label><input id="ms" placeholder="원장"><div style="margin-top:8px"><button class="btn" onclick="createM()">개설 → 교사 전원 보고 카드 생성</button> <span class="m" id="mr"></span></div></div>';load();}
const PRESET={'회의':{h:'회의 = 미션 발표 · 성과 보고 · 우수 사례 공유 · 주요 의사결정은 제시 후 의견 수렴만',i:'성과 보고\n우수 사례 공유\n제시된 의사결정에 대한 의견'},'교육':{h:'교육 = 내용 제시 → 배운 것·적용·막히는 점 → 총평·적용 과제 → 이수 인정',i:'배운 것 한 줄\n내 수업에 적용할 것\n막히는 점'},'공지':{h:'공지 = 본문 → 읽음 확인',i:'확인(읽음)'}};function preset(){const k=$('mk').value;$('mkh').textContent=PRESET[k].h;$('mi').value=PRESET[k].i;}
async function createM(){const items=$('mi').value.split('\n').map(s=>s.trim()).filter(Boolean);const r=await rpc('gz2_meeting_create',{p:{title:$('mt').value,date:$('md').value,agenda:$('ma').value,mission:$('mm').value,kind:$('mk').value,items:items,secretary:$('ms').value||'원장',by:'원장'}});$('mr').textContent=r.ok?'개설 ✓':'거부: '+r.reason;if(r.ok){await load();pick(r.id);}}
async function pick(id){SEL=id;D=await rpc('gz2_meeting_detail',{p_id:id});const m=D.meeting;const locked=m.status==='확정';load();
 const ITEMS=m.report_items||[];const reps=(D.reports||[]).map(r=>'<div class="rep"><b>'+esc(r.teacher_name)+'</b> <span class="st'+(r.status==='초안'?' x':'')+'">'+esc(r.status)+'</span>'+(r.status==='초안'?'<div class="m">미제출</div>':ITEMS.map((it,i)=>'<div class="it">'+(i+1)+'. '+esc(it)+' — '+esc(((r.items||{})[it])||'—')+'</div>').join(''))+'</div>').join('');
 const mine=(D.reports||[]).map(r=>r.teacher_name);const who=ME||'';const opts=(D.reports||[]).map(r=>'<option'+(r.teacher_name===who?' selected':'')+'>'+esc(r.teacher_name)+'</option>').join('');
 const form=locked?'':'<div class="card f"><h3>내 보고 <span class="m">(항목은 원장 설정)</span></h3><label>보고자</label><select id="rt">'+opts+'</select>'+ITEMS.map((it,k)=>'<label>'+(k+1)+'. '+esc(it)+'</label><textarea id="ri'+k+'" rows="2"></textarea>').join('')+'<div style="margin-top:8px"><button class="btn o" onclick="saveR(\'초안\')">초안 저장</button> <button class="btn" onclick="saveR(\'제출\')">제출</button> <span class="m" id="rr"></span></div></div>';
 const conf=locked?'<div class="card"><h3>'+((m.kind||'회의')==='회의'?'의견 수렴 결과':'총평')+' (확정 '+String(m.confirmed_at||'').slice(0,16).replace('T',' ')+' · '+esc(m.confirmed_by||'')+')</h3><div>'+esc(m.decisions||'—')+'</div><div class="m">참석: '+esc(m.attendees||'—')+'</div></div>':'<div class="card f"><h3>'+((m.kind||'회의')==='회의'?'의견 수렴 결과':'총평')+' → 확정 (원장·대표)</h3><label>'+((m.kind||'회의')==='회의'?'수렴된 의견·보완점':'총평')+'</label><textarea id="dec" rows="2" placeholder="확정하면 잠기고, 참석자에게 알림함 적재"></textarea><div style="margin-top:8px"><button class="btn g" onclick="confirmM()">확정(잠금)</button> <span class="m" id="cr"></span></div></div>';
 const add='<div class="card f"><h3>덧붙임 '+(locked?'(확정 후 유일한 입력)':'')+'</h3>'+((D.addenda||[]).map(a=>'<div class="rep"><b>'+esc(a.teacher_name)+'</b> <span class="m">'+String(a.created_at).slice(5,16).replace('T',' ')+'</span><div>'+esc(a.body)+'</div></div>').join('')||'<div class="m">없음</div>')+'<label>이름</label><input id="an" value="'+esc(who)+'"><label>내용</label><textarea id="ab" rows="2"></textarea><div style="margin-top:6px"><button class="btn o" onclick="addA()">덧붙이기</button> <span class="m" id="ar"></span></div></div>';
 $('main').innerHTML='<div class="card"><h3><span class="st">'+esc(m.kind||'회의')+'</span> '+esc(m.title)+' <span class="st">'+esc(m.status)+'</span></h3><div class="m">'+String(m.meet_date).slice(0,10)+' · 서기 '+esc(m.secretary||m.author||'')+'</div>'+(m.mission?'<div><b>'+((m.kind||'회의')==='교육'?'교육 목표':'미션')+':</b> '+esc(m.mission)+'</div>':'')+(m.agenda?'<div class="m">'+((m.kind||'회의')==='회의'?'의사결정 제시(의견 수렴): ':'내용: ')+esc(m.agenda)+'</div>':'')+'<div class="m">제출 항목: '+ITEMS.map(esc).join(' · ')+'</div></div><div class="card"><h3>보고 카드 (하급자 → 상급자 순)</h3>'+(reps||'<div class="m">보고 없음</div>')+'</div>'+form+conf+add+'<div class="card" id="memoFbM"><h3>📝 메모함</h3><div class="m">적재 중…</div></div>';loadMeetingMemos(id);}
async function saveR(st){const ITEMS=D.meeting.report_items||[];const it={};ITEMS.forEach((k,i)=>{it[k]=$('ri'+i).value;});const r=await rpc('gz2_meeting_report_save',{p:{meeting_id:SEL,teacher:$('rt').value,items:it,status:st}});$('rr').textContent=r.ok?(st+' ✓'):'거부: '+r.reason;if(r.ok)pick(SEL);}
function HJ(){const j=(typeof window.__GZ_JWT!=='undefined'&&window.__GZ_JWT)?window.__GZ_JWT:null;return j?Object.assign({},H,{Authorization:'Bearer '+j}):null;}
async function loadMeetingMemos(id){const box=document.getElementById('memoFbM');if(!box)return;const h=HJ();if(!h){box.innerHTML='<h3>📝 메모함</h3><div class="m">관문 로그인(직원) 상태에서 표시</div>';return;}try{const r=await fetch(U+'gz_memo_list',{method:'POST',headers:h,body:JSON.stringify({p:{source:'회의',source_ref:id,limit:50}})});const j=await r.json();if(!j||!j.ok){box.innerHTML='<h3>📝 메모함</h3><div class="m">'+((j&&j.reason)||r.status)+'</div>';return;}if(!j.n){box.innerHTML='<h3>📝 메모함</h3><div class="m">확정 전이거나 접수된 항목 없음 — 확정 시 [결정]·[보고]·[액션]이 자동 접수됩니다</div>';return;}box.innerHTML='<h3>📝 메모함 '+j.n+'건 — 결정·보고·액션과 원장 피드백</h3>'+j.rows.map(x=>'<div style="padding:4px 6px;margin-top:4px;border-left:3px solid '+(x.feedback?'#1E4D3B':'#b8b2a3')+';background:#f7f5ee;font-size:12px"><b>'+esc(x.status)+'</b> <span class="m">'+esc(x.author||'')+'</span> '+esc(x.body||'')+(x.refined?'<div style="color:#8a6d1f">↳ 정교화: '+esc(x.refined)+'</div>':'')+(x.feedback?'<div style="color:#1E4D3B">↳ 피드백: '+esc(x.feedback)+' — '+esc(x.feedback_by||'')+'</div>':'')+'</div>').join('');}catch(e){box.innerHTML='<h3>📝 메모함</h3><div class="m">오류 '+e.message+'</div>';}}
async function confirmM(){if(!confirm('확정하면 보고·결정이 잠기고 참석자 알림이 적재됩니다.'))return;const r=await rpc('gz2_meeting_confirm',{p_id:SEL,p_decisions:$('dec').value,p_by:'원장'});$('cr').textContent=r.ok?'확정 ✓':'거부';if(r.ok)pick(SEL);}
async function addA(){const r=await rpc('gz2_meeting_addendum',{p_id:SEL,p_teacher:$('an').value||'익명',p_body:$('ab').value});$('ar').textContent=r.ok?'덧붙임 ✓':'거부: '+r.reason;if(r.ok)pick(SEL);}
load();
</script></body></html>
