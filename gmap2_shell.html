<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G-MAP 2.0 · 테스트</title>
<style>
:root{--ink:#1a1a2e;--line:#d8d8e4;--acc:#2b6cb0;--new:#2f855a;--warn:#A4472F;--bg:#f7f8fb;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
header{background:#fff;border-bottom:2px solid var(--ink);padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
header h1{font-size:15px;} .v{font-size:10px;color:#889;}
.tabs{display:flex;gap:4px;flex-wrap:wrap;}
.tabs button{border:1px solid #99a;background:#fff;border-radius:8px;padding:3px 10px;font-size:11.5px;cursor:pointer;color:#445;}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.role{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:11px;white-space:nowrap;}
main{padding:12px;max-width:1280px;margin:0 auto;}
@media(min-width:900px){ /* #5060 정본: G-MAP 2.0 탭의 세로 레일 문법 */
  .tabs{position:fixed;left:0;top:52px;width:172px;flex-direction:column;padding:10px 8px;gap:6px;background:#fff;border-right:1px solid var(--line);height:calc(100vh - 52px);z-index:10;}
  .tabs button{text-align:left;padding:7px 12px;border-radius:9px;font-size:12.5px;}
  .tabs button.on{background:#B8892E;border-color:#B8892E;} /* 금색 하이라이트 */
  main{margin-left:172px;max-width:calc(100% - 172px);}
  #slide{max-width:min(560px, calc(100vw - 190px));}
}
.ttwrap{overflow-x:auto;}
.tt{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:6px;min-width:1080px;}
.dh{background:#eef1f7;border-radius:6px;padding:5px;text-align:center;font-weight:bold;font-size:12px;}
.dh small{display:block;font-weight:normal;color:#667;font-size:10px;}
.dh.today{background:var(--acc);color:#fff;} .dh.today small{color:#dce8f8;}
.col{display:flex;flex-direction:column;gap:4px;}
.card{border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px 6px;font-size:11px;line-height:1.35;}
.card.grp{border-color:var(--acc);background:#f4f8fe;}
.card .t{color:#889;font-size:10px;}
.card b{cursor:pointer;} .card b:hover{color:var(--acc);}
.roster{color:#556;font-size:10px;}
.err{color:var(--warn);padding:12px;font-weight:bold;}
.load{color:#889;padding:16px;}
.placeholder{color:#889;padding:30px;text-align:center;font-size:13px;}
/* 코칭 카드 */
.ccard{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:14px;max-width:860px;margin:0 auto;}
.zone{border-top:1px solid var(--line);padding:10px 0;}
.zone:first-child{border-top:none;padding-top:0;}
.zone h3{font-size:13px;margin-bottom:6px;}
.zone h3 .zn{display:inline-flex;width:19px;height:19px;border-radius:50%;background:var(--acc);color:#fff;font-size:10.5px;align-items:center;justify-content:center;margin-right:5px;}
.p1{display:flex;gap:6px;}
.p1 button{border:1.5px solid #99a;background:#fff;border-radius:8px;padding:5px 14px;font-size:12px;cursor:pointer;}
.p1 button.sel{border-color:var(--new);background:#effaf3;color:var(--new);font-weight:bold;}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:12px;font-family:inherit;}
textarea{min-height:52px;resize:vertical;}
.row{display:flex;gap:8px;} .row>*{flex:1;}
.mini{font-size:10.5px;color:#667;margin-top:3px;}
.savebar{display:flex;gap:8px;align-items:center;margin-top:12px;}
.btn{border:none;background:var(--acc);color:#fff;border-radius:7px;padding:8px 18px;font-size:13px;cursor:pointer;font-weight:bold;}
.btn.grn{background:var(--new);}
.receipt{font-size:11.5px;padding:6px 9px;border-radius:6px;}
.receipt.ok{background:#effaf3;color:var(--new);border:1px solid var(--new);}
.receipt.bad{background:#fdf3f0;color:var(--warn);border:1px solid var(--warn);}
.pick{max-width:860px;margin:0 auto 10px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;}
.pick select{max-width:340px;}
.wres{border:1px solid var(--line);border-radius:6px;margin-top:4px;max-height:130px;overflow:auto;}
.wres div{padding:4px 8px;font-size:11.5px;cursor:pointer;border-bottom:1px solid #f0f0f5;}
.wres div:hover{background:#f4f8fe;}
.wtag{font-size:11px;color:var(--new);font-weight:bold;margin-top:3px;}
/* 슬라이드 패널 — 시간표<->코칭 왕복(현행 UX 계승) */
#slide{position:fixed;top:0;right:-560px;width:540px;max-width:92vw;height:100vh;background:#fff;border-left:2px solid var(--ink);box-shadow:-6px 0 18px rgba(0,0,0,.12);transition:right .25s;z-index:50;overflow-y:auto;padding:12px;}
#slide.open{right:0;}
#slide .close{position:sticky;top:0;background:#fff;padding:4px 0;text-align:right;z-index:2;}
#slide .close button{border:1px solid #99a;background:#fff;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:12px;}
</style>
</head>
<body>
<header>
  <h1>G-MAP 2.0 <span class="v">테스트 2파 · v0.19 · 실동</span></h1>
  <nav class="tabs" id="tabs"></nav>
  <div class="role">역할 <select id="role" onchange="localStorage.setItem('g2role',this.value)">
    <option value="teacher">교사</option><option value="director">분원 원장</option><option value="hq">총관리</option>
  </select></div>
</header>
<main id="main"><div class="load">불러오는 중…</div></main>
<div id="slide"><div class="close"><button onclick="closeSlide()">✕ 시간표로</button></div><div id="slidebody"></div></div>
<script>
/* G-MAP 2.0 — 클린 규약: publishable 키만 · 전용 RPC+REST 읽기만 · 지층 금지 · 저장은 쓰고→되읽기 검증 */
const SB='https://qcnsadcpsonuxnjyrlez.supabase.co';
function localDate(base,addDays){ /* UTC 밀림 방지 — 현행 노트 처방 계승 */
  const x=base?new Date(base+'T12:00:00'):new Date();
  if(addDays)x.setDate(x.getDate()+addDays);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}
const PK='sb_publishable_stx8spRryf_4OWMFsW29Rw_XiDNfyb0';
const H={apikey:PK, Authorization:'Bearer '+PK, 'Content-Type':'application/json'};
async function rpc(fn,payload){
  const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(payload||{})});
  const tx=await r.text();
  if(!r.ok) throw new Error(fn+' '+r.status+' '+tx.slice(0,120));
  return tx?JSON.parse(tx):null;
}
async function rest(path){
  const r=await fetch(SB+'/rest/v1/'+path,{headers:H});
  if(!r.ok) throw new Error('REST '+r.status);
  return r.json();
}
const JOURNEY=[['1','경영'],['2','학부모'],['2p','상담'],['3','수업준비'],['3p','시험범위'],['4','수업'],['4p','코칭'],['5','공유']];
let TAB='4', TT=null, COACH_SID=null, COACH_NAME='', WORK=null, ATT={}, WEEK_OFF=0, EXC=[], TT_VIEW='week', RAIL_D=null;
function setView(v){TT_VIEW=v;render();}
function weekDates(off){ /* 월 시작 주의 날짜 7개 */
  const now=new Date(); const dow=(now.getDay()+6)%7; /* 0=월 */
  const mon=new Date(now); mon.setDate(now.getDate()-dow+off*7);
  return [0,1,2,3,4,5,6].map(i=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');});
}
function moveWeek(dir){WEEK_OFF+=dir;render();}
async function attCycle(sid){
  const cur=ATT[sid]||'';
  const next=(cur==='')?'출':(cur==='출'?'결':'');
  const dot=document.getElementById('att_'+sid);
  dot.style.opacity='.4'; /* 저장 중 표시 — 리렌더 없음 */
  try{
    let r;
    if(next==='') r=await rpc('gz_att_revoke_absence',{}).catch(()=>null); /* 해제 회선 시그니처 결선 전 — 실패 시 안내 */
    if(next!=='') r=await rpc('gz_att_set',{p:{student_id:sid,status:next,date:localDate()}});
    if(next!==''&&!(r&&r.ok!==false)){alert('출결 저장 실패');dot.style.opacity='1';return;}
    if(next===''&&!r){alert('해제 회선은 다음 배포 — 출/결만 우선');ATT[sid]='출';dot.style.background='var(--new)';dot.style.opacity='1';return;}
    ATT[sid]=next;
    dot.style.background=next==='출'?'var(--new)':(next==='결'?'var(--warn)':'#fff');
    dot.style.opacity='1'; /* 이 점 하나만 갱신 — 전체 리렌더·폴링 0 (현행 setInterval 27개 반면교사) */
  }catch(e){alert('출결 오류: '+e.message.slice(0,60));dot.style.opacity='1';}
}
function drawTabs(){document.getElementById('tabs').innerHTML=JOURNEY.map(([k,n])=>`<button class="${k===TAB?'on':''}" onclick="go('${k}')">${n}</button>`).join('');}
function go(k){TAB=k;closeSlide();drawTabs();render();}
function openCoach(sid,name){COACH_SID=sid;COACH_NAME=name;
  if(TAB==='4'){ /* 시간표에서는 슬라이드 — 인원<->코칭 왕복(현행 UX 계승) */
    document.getElementById('slide').classList.add('open');
    const sb=document.getElementById('slidebody');
    sb.innerHTML='<div id="cbody"></div>';
    renderCoachBody();
  } else go('4p');
}
function closeSlide(){document.getElementById('slide').classList.remove('open');}
let ENR=null;
async function openEnroll(){
  document.getElementById('slide').classList.add('open');
  const sb=document.getElementById('slidebody');
  sb.innerHTML='<div class="load">배정 현황 불러오는 중…</div>';
  try{
    ENR=await rpc('gz2_enroll_list');
    const byK={};
    ENR.forEach(e=>{(byK[e.k]=byK[e.k]||[]).push(e);});
    const uniq={}; (TT&&TT.solo||[]).forEach(s=>{uniq[s.sid]=s;});
    ENR.forEach(e=>{if(!uniq[e.sid])uniq[e.sid]={sid:e.sid,n:e.name};});
    const opts=Object.values(uniq).sort((a,b)=>a.n.localeCompare(b.n)).map(s=>`<option value="${s.sid}">${s.n}</option>`).join('');
    sb.innerHTML='<h3 style="font-size:14px;">반 배정 관리 <span class="mini">('+ENR.length+'건 배정)</span></h3>'
      +Object.keys(byK).sort().map(k=>
        '<div class="pick"><b>'+k+'</b> <span class="mini">'+byK[k].length+'명</span><div style="margin-top:4px;">'
        +byK[k].map(e=>'<span style="border:1px solid var(--line);border-radius:8px;padding:1px 7px;font-size:11px;margin:1px;display:inline-block;">'+e.name+(e.pri?' ★':'')+' <b style="cursor:pointer;color:var(--warn)" onclick="enrSet(\'remove\','+e.sid+',\''+k+'\')">✕</b></span>').join('')
        +'</div><div style="margin-top:5px;display:flex;gap:5px;"><select id="add_'+btoa(unescape(encodeURIComponent(k))).replace(/[^a-zA-Z0-9]/g,'')+'" style="max-width:170px;font-size:11px;">'+opts+'</select><button class="btn" style="padding:2px 9px;font-size:11px;" onclick="enrAdd(this,\''+k+'\')">추가</button></div></div>').join('');
  }catch(e){sb.innerHTML='<div class="err">배정 회선 오류: '+e.message+'</div>';}
}
async function enrAdd(btn,k){
  const sel=btn.previousElementSibling;
  await enrSet('add',+sel.value,k);
}
async function enrSet(act,sid,k){
  try{
    const r=await rpc('gz2_enroll_set',{p:{action:act,student_id:sid,k_code:k}});
    if(r&&r.ok){TT=null;openEnroll();} /* 시간표 roster 갱신 위해 TT 리로드 */
    else alert('처리 실패');
  }catch(e){alert('오류: '+e.message.slice(0,80));}
}
async function render(){
  const m=document.getElementById('main');
  if(TAB==='4') return renderTT(m);
  if(TAB==='4p') return renderCoach(m);
  if(TAB==='3') return renderPrep(m);
  if(TAB==='3p') return renderExam(m);
  if(TAB==='2') return renderParent(m);
  m.innerHTML='<div class="placeholder">「'+JOURNEY.find(x=>x[0]===TAB)[1]+'」 — 다음 파에서 배포됩니다</div>';
}
async function renderTT(m){
  if(TT_VIEW==='rail') return renderRail(m);
  m.innerHTML='<div class="load">시간표 불러오는 중…</div>';
  try{
    if(!TT) TT=await rpc('gz_tt_data');
    try{ const a=await rpc('gz_att_day',{}); ATT={}; Object.entries(a||{}).forEach(([k,v])=>{ATT[k]=v;}); }catch(e){ATT={};} /* 계약 실측: {sid: '출'|'결'} */
    const wd=weekDates(WEEK_OFF);
    try{ EXC=await rpc('gz2_week_exceptions',{p_from:wd[0],p_to:wd[6]}); }catch(e){EXC=[];}
    const days=['일','월','화','수','목','금','토'];
    const todayD=new Date().getDay()+1;
    let cols='';
    for(const dd of [2,3,4,5,6,7,1]){ /* 월 시작 — full_page 정본 */
      const solos=(TT.solo||[]).filter(x=>x.d===dd).sort((a,b)=>(a.st||'').localeCompare(b.st||''));
      const grps=(TT.groups||[]).filter(x=>x.d===dd).sort((a,b)=>(a.st||'').localeCompare(b.st||''));
      const dateStr=wd[(dd+5)%7]; /* dd:2(월)->wd[0] ... dd:1(일)->wd[6] */
      const isToday=(WEEK_OFF===0&&dd===todayD);
      const excDay=(EXC||[]).filter(x=>x.d===dateStr);
      const excOrig=(EXC||[]).filter(x=>x.od===dateStr);
      cols+=`<div class="col"><div class="dh ${isToday?'today':''}">${days[dd-1]} <small style="display:inline">${dateStr.slice(5).replace('-','/')}</small><small>반 ${grps.length} · 개별 ${solos.length}${excDay.length?' · 보충/휴강 '+excDay.length:''}</small></div>`;
      excDay.forEach(x=>{cols+=`<div class="card" style="border-color:${x.type==='보충'?'var(--new)':'#bbb'};background:${x.type==='보충'?'#effaf3':'#f4f4f6'};"><span class="t">${(x.st||'').slice(0,5)}</span> <b>${x.type==='보충'?'+':''}${x.name}</b> <small style="color:${x.type==='보충'?'var(--new)':'#889'};font-weight:bold">${x.type}</small><div class="roster">${(x.note||'').slice(0,26)}</div></div>`;});
      grps.forEach(g=>{cols+=`<div class="card grp"><span class="t">${(g.st||'').slice(0,5)}</span> <b>${g.k||''}</b> ${g.gl||''}<div class="roster">${(g.roster||[]).length}명 · ${g.t||''}</div></div>`;});
      solos.forEach(s=>{
        const moved=excOrig.find(x=>x.sid===s.sid);
        const mv=moved?`<small style="color:#889;font-weight:bold"> →${moved.type} ${(moved.d||'').slice(5).replace('-','/')}</small>`:'';
        const att=(WEEK_OFF===0&&dd===todayD)?`<span class="attdot" id="att_${s.sid}" data-st="${(ATT[s.sid]||'')}" onclick="event.stopPropagation();attCycle(${s.sid})" title="출결: 클릭=출→결→해제" style="cursor:pointer;display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle;margin-right:3px;border:1.5px solid #99a;background:${ATT[s.sid]==='출'?'var(--new)':(ATT[s.sid]==='결'?'var(--warn)':'#fff')}"></span>`:'';
        cols+=`<div class="card" style="${moved?'opacity:.55;':''}"><span class="t">${(s.st||'').slice(0,5)}</span> ${att}<b onclick="openCoach(${s.sid},'${s.n}')">${s.n} ▶</b>${mv}<div class="roster">${s.sch||''} ${s.gr||''} · ${s.t||''}</div></div>`;});
      cols+='</div>';
    }
    m.innerHTML='<div style="max-width:1080px;margin:0 auto 6px;display:flex;gap:8px;align-items:center;"><button class="btn2" style="border:1px solid #99a;border-radius:6px;padding:2px 9px;font-size:11px;cursor:pointer;background:#fff;" onclick="moveWeek(-1)">◀ 지난주</button><b style="font-size:12px;">'+wd[0].slice(5).replace('-','/')+' ~ '+wd[6].slice(5).replace('-','/')+(WEEK_OFF===0?' (이번 주)':'')+'</b><button class="btn2" style="border:1px solid #99a;border-radius:6px;padding:2px 9px;font-size:11px;cursor:pointer;background:#fff;" onclick="moveWeek(1)">다음주 ▶</button><span class="mini">학생 이름 ▶ 클릭 = 코칭 카드</span><span style="margin-left:auto;display:flex;gap:4px;"><button class="btn2" style="border:1px solid #99a;border-radius:6px;padding:2px 9px;font-size:11px;cursor:pointer;background:#fff;" onclick="setView(\'week\')">주간</button><button class="btn2" style="border:1px solid #99a;border-radius:6px;padding:2px 9px;font-size:11px;cursor:pointer;background:#fff;" onclick="setView(\'rail\')">교사 레일</button><button class="btn" style="padding:3px 10px;font-size:11px;" onclick="openEnroll()">반 배정 관리</button></span></div><div class="ttwrap"><div class="tt">'+cols+'</div></div>';
  }catch(e){m.innerHTML='<div class="err">회선 오류: '+e.message+'</div>';}
}
async function renderCoach(m){
  let pick='';
  try{
    if(!TT) TT=await rpc('gz_tt_data');
    const uniq={}; (TT.solo||[]).forEach(s=>{uniq[s.sid]=s;});
    pick='<select id="stuSel" onchange="COACH_SID=+this.value;COACH_NAME=this.selectedOptions[0].dataset.n;renderCoachBody()"><option value="">학생 선택…</option>'+
      Object.values(uniq).sort((a,b)=>a.n.localeCompare(b.n)).map(s=>`<option value="${s.sid}" data-n="${s.n}" ${s.sid===COACH_SID?'selected':''}>${s.n} · ${s.sch||''} ${s.gr||''}</option>`).join('')+'</select>';
  }catch(e){pick='<span class="err">'+e.message+'</span>';}
  m.innerHTML='<div class="pick">코칭 대상: '+pick+'</div><div id="cbody"></div>';
  renderCoachBody();
}
function renderCoachBody(){
  const c=document.getElementById('cbody');
  if(!COACH_SID){c.innerHTML='<div class="placeholder">학생을 선택하면 카드가 열립니다</div>';return;}
  c.innerHTML=`
  <div class="ccard">
    <div class="zone"><h3><span class="zn">1</span>${COACH_NAME} — ${localDate()}</h3>
      <div id="cycband" class="mini">시기 띠 불러오는 중…</div></div>
    <div class="zone"><h3><span class="zn">2</span>오늘의 첫 질문 — 지난 과제 해왔나요?</h3>
      <div id="prevband" class="mini" style="margin-bottom:5px;">지난 과제 불러오는 중…</div>
      <div class="p1" id="p1">
        <button onclick="selP1(this,'해옴')">해옴</button><button onclick="selP1(this,'부분')">부분만</button><button onclick="selP1(this,'안해옴')">안 해옴</button>
      </div>
      <input type="text" id="hwreason" placeholder="사유 (부분·안 해옴일 때)" style="display:none;margin-top:5px;"></div>
    <div class="zone"><h3><span class="zn">3</span>교시 기록 <span class="mini" id="plabels"></span></h3>
      <div class="mini" style="margin-bottom:4px;">교시 활동 체크: <span id="acts"></span></div>
      <textarea id="lesson" placeholder="1교시 — 과제 확인 평가 (필수)"></textarea>
      <div style="height:6px"></div>
      <div class="row"><textarea id="p2c" placeholder="2교시 — 내용" style="min-height:40px;"></textarea><input type="text" id="p2paper" placeholder="2교시 자료(지문·교안)" style="max-width:220px;"></div>
      <div style="height:6px"></div>
      <div class="row"><textarea id="p3c" placeholder="3교시 — 내용" style="min-height:40px;"></textarea><input type="text" id="p3paper" placeholder="3교시 자료" style="max-width:220px;"></div>
      <div style="height:6px"></div>
      <textarea id="memo" placeholder="교사 메모 (선택)" style="min-height:40px;"></textarea></div>

    }).join('');
    document.getElementById('queue').innerHTML='<b>작업 대기열</b> — 안 된 것에만 ✕ · 영향 학생수 내림차순 (상위 25 / 전체 '+rows.length+')<table class="tb" style="margin-top:5px">'+head+body+'</table><div class="mini">정보│영상 2칸 정밀 판정은 회선 확장 후(결선 명기)</div>';
  }catch(e){document.getElementById('queue').innerHTML='<span class="err">대기열 회선 오류: '+e.message+'</span>';}
}
async function renderRail(m){
  m.innerHTML='<div class="load">교사 레일 불러오는 중…</div>';
  try{
    if(!TT) TT=await rpc('gz_tt_data');
    try{ const a=await rpc('gz_att_day',{}); ATT={}; Object.entries(a||{}).forEach(([k,v])=>{ATT[k]=v;}); }catch(e){ATT={};}
    const today=localDate();
    const dsel=RAIL_D||today;
    const dow=new Date(dsel+'T12:00:00').getDay()+1;
    const solos=(TT.solo||[]).filter(x=>x.d===dow), grps=(TT.groups||[]).filter(x=>x.d===dow);
    const ts=[...new Set([...solos.map(s=>s.t),...grps.map(g=>g.t)])].filter(Boolean).sort();
    let exc=[]; try{exc=await rpc('gz2_week_exceptions',{p_from:dsel,p_to:dsel});}catch(e){}
    let html='<div style="max-width:1200px;margin:0 auto 8px;display:flex;gap:8px;align-items:center;"><button class="btn2" style="border:1px solid #99a;border-radius:6px;padding:2px 9px;font-size:11px;cursor:pointer;background:#fff;" onclick="railMove(-1)">◀</button><b style="font-size:12.5px;">'+dsel+' ('+['일','월','화','수','목','금','토'][dow-1]+')'+(dsel===today?' 오늘':'')+'</b><button class="btn2" style="border:1px solid #99a;border-radius:6px;padding:2px 9px;font-size:11px;cursor:pointer;background:#fff;" onclick="railMove(1)">▶</button><span style="margin-left:auto"><button class="btn2" style="border:1px solid #99a;border-radius:6px;padding:2px 9px;font-size:11px;cursor:pointer;background:#fff;" onclick="setView(\'week\')">주간 보기</button></span></div>';
    html+='<div style="display:grid;grid-template-columns:repeat('+Math.max(ts.length,1)+',minmax(170px,1fr));gap:8px;max-width:1200px;margin:0 auto;overflow-x:auto;">';
    ts.forEach(t=>{
      const my=[...grps.filter(g=>g.t===t).map(g=>({k:1,st:g.st,label:g.k,sub:(g.roster||[]).length+'명'})),
                ...solos.filter(s=>s.t===t).map(s=>({k:0,st:s.st,sid:s.sid,label:s.n,sub:(s.sch||'')+' '+(s.gr||'')}))].sort((a,b)=>(a.st||'').localeCompare(b.st||''));
      html+='<div><div class="dh">'+t+'<small>'+my.length+'건</small></div>';
      my.forEach(c=>{
        const att=(c.k===0&&dsel===today)?('<span class="attdot" id="att_'+c.sid+'" onclick="event.stopPropagation();attCycle('+c.sid+')" style="cursor:pointer;display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle;margin-right:3px;border:1.5px solid #99a;background:'+(ATT[c.sid]==='출'?'var(--new)':(ATT[c.sid]==='결'?'var(--warn)':'#fff'))+'"></span>'):'';
        html+='<div class="card'+(c.k?' grp':'')+'" style="margin-top:4px;"><span class="t">'+(c.st||'').slice(0,5)+'</span> '+att+(c.k?('<b>'+c.label+'</b>'):('<b onclick="openCoach('+c.sid+',\''+c.label+'\')">'+c.label+' ▶</b>'))+'<div class="roster">'+c.sub+'</div></div>';
      });
      html+='</div>';
    });
    html+='</div>';
    if(exc.length) html+='<div class="pick" style="max-width:1200px;margin:8px auto;">이 날 보충·휴강 '+exc.length+'건: '+exc.map(x=>x.name+'('+x.type+')').join(' · ')+'</div>';
    m.innerHTML=html;
  }catch(e){m.innerHTML='<div class="err">레일 회선 오류: '+e.message+'</div>';}
}
function railMove(dir){
  const cur=RAIL_D||localDate();
  RAIL_D=localDate(cur,dir); render();
}
function gsearch(q){
  const box=document.getElementById('gres');
  if((q||'').trim().length<2){box.style.display='none';return;}
  clearTimeout(window._gt);
  window._gt=setTimeout(async()=>{
    try{
      const rows=await rpc('gz_global_search',{p_q:q.trim()});
      box.innerHTML=(rows||[]).slice(0,10).map(r=>`<div onclick='pinIt(${JSON.stringify(JSON.stringify({id:r.id,kind:r.kind,title:r.title}))})'>[${r.sub||r.kind}] ${r.title}</div>`).join('')||'<div>결과 없음</div>';
      box.style.display='block';
    }catch(e){box.innerHTML='<div>검색 오류</div>';box.style.display='block';}
  },250);
}
function pinIt(s){PIN=JSON.parse(s);document.getElementById('gres').style.display='none';document.getElementById('gpin').textContent='꽂힌 자료: '+PIN.title.slice(0,50)+' — 코칭 카드 2교시 자료칸에 자동 입력';}
document.getElementById('role').value=localStorage.getItem('g2role')||'teacher';
drawTabs();render();
</script>
