<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G-MAP 2.0 · 테스트</title>
<style>
:root{--ink:#1a1a2e;--line:#d8d8e4;--acc:#2b6cb0;--new:#2f855a;--warn:#A4472F;--bg:#f7f8fb;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
header{background:#fff;border-bottom:2px solid var(--ink);padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
header h1{font-size:15px;} .v{font-size:10px;color:#889;}
.tabs{display:flex;gap:4px;flex-wrap:wrap;}
.tabs button{border:1px solid #99a;background:#fff;border-radius:8px;padding:3px 10px;font-size:11.5px;cursor:pointer;color:#445;}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.role{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:11px;white-space:nowrap;}
main{padding:12px;max-width:1280px;margin:0 auto;}
.ttwrap{overflow-x:auto;}
.tt{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:6px;min-width:1080px;}
.dh{background:#eef1f7;border-radius:6px;padding:5px;text-align:center;font-weight:bold;font-size:12px;}
.dh small{display:block;font-weight:normal;color:#667;font-size:10px;}
.dh.today{background:var(--acc);color:#fff;} .dh.today small{color:#dce8f8;}
.col{display:flex;flex-direction:column;gap:4px;}
.card{border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px 6px;font-size:11px;line-height:1.35;}
.card.grp{border-color:var(--acc);background:#f4f8fe;}
.card .t{color:#889;font-size:10px;}
.card b{cursor:pointer;} .card b:hover{color:var(--acc);}
.roster{color:#556;font-size:10px;}
.err{color:var(--warn);padding:12px;font-weight:bold;}
.load{color:#889;padding:16px;}
.placeholder{color:#889;padding:30px;text-align:center;font-size:13px;}
/* 코칭 카드 */
.ccard{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:14px;max-width:860px;margin:0 auto;}
.zone{border-top:1px solid var(--line);padding:10px 0;}
.zone:first-child{border-top:none;padding-top:0;}
.zone h3{font-size:13px;margin-bottom:6px;}
.zone h3 .zn{display:inline-flex;width:19px;height:19px;border-radius:50%;background:var(--acc);color:#fff;font-size:10.5px;align-items:center;justify-content:center;margin-right:5px;}
.p1{display:flex;gap:6px;}
.p1 button{border:1.5px solid #99a;background:#fff;border-radius:8px;padding:5px 14px;font-size:12px;cursor:pointer;}
.p1 button.sel{border-color:var(--new);background:#effaf3;color:var(--new);font-weight:bold;}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:12px;font-family:inherit;}
textarea{min-height:52px;resize:vertical;}
.row{display:flex;gap:8px;} .row>*{flex:1;}
.mini{font-size:10.5px;color:#667;margin-top:3px;}
.savebar{display:flex;gap:8px;align-items:center;margin-top:12px;}
.btn{border:none;background:var(--acc);color:#fff;border-radius:7px;padding:8px 18px;font-size:13px;cursor:pointer;font-weight:bold;}
.btn.grn{background:var(--new);}
.receipt{font-size:11.5px;padding:6px 9px;border-radius:6px;}
.receipt.ok{background:#effaf3;color:var(--new);border:1px solid var(--new);}
.receipt.bad{background:#fdf3f0;color:var(--warn);border:1px solid var(--warn);}
.pick{max-width:860px;margin:0 auto 10px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;}
.pick select{max-width:340px;}
.wres{border:1px solid var(--line);border-radius:6px;margin-top:4px;max-height:130px;overflow:auto;}
.wres div{padding:4px 8px;font-size:11.5px;cursor:pointer;border-bottom:1px solid #f0f0f5;}
.wres div:hover{background:#f4f8fe;}
.wtag{font-size:11px;color:var(--new);font-weight:bold;margin-top:3px;}
</style>
</head>
<body>
<header>
  <h1>G-MAP 2.0 <span class="v">테스트 2파 · v0.10 · 실동</span></h1>
  <nav class="tabs" id="tabs"></nav>
  <div class="role">역할 <select id="role" onchange="localStorage.setItem('g2role',this.value)">
    <option value="teacher">교사</option><option value="director">분원 원장</option><option value="hq">총관리</option>
  </select></div>
</header>
<main id="main"><div class="load">불러오는 중…</div></main>
<script>
/* G-MAP 2.0 — 클린 규약: publishable 키만 · 전용 RPC+REST 읽기만 · 지층 금지 · 저장은 쓰고→되읽기 검증 */
const SB='https://qcnsadcpsonuxnjyrlez.supabase.co';
const PK='sb_publishable_stx8spRryf_4OWMFsW29Rw_XiDNfyb0';
const H={apikey:PK, Authorization:'Bearer '+PK, 'Content-Type':'application/json'};
async function rpc(fn,payload){
  const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(payload||{})});
  const tx=await r.text();
  if(!r.ok) throw new Error(fn+' '+r.status+' '+tx.slice(0,120));
  return tx?JSON.parse(tx):null;
}
async function rest(path){
  const r=await fetch(SB+'/rest/v1/'+path,{headers:H});
  if(!r.ok) throw new Error('REST '+r.status);
  return r.json();
}
const JOURNEY=[['1','경영'],['2','학부모'],['2p','상담'],['3','수업준비'],['3p','시험범위'],['4','수업'],['4p','코칭'],['5','공유']];
let TAB='4', TT=null, COACH_SID=null, COACH_NAME='', WORK=null;
function drawTabs(){document.getElementById('tabs').innerHTML=JOURNEY.map(([k,n])=>`<button class="${k===TAB?'on':''}" onclick="go('${k}')">${n}</button>`).join('');}
function go(k){TAB=k;drawTabs();render();}
function openCoach(sid,name){COACH_SID=sid;COACH_NAME=name;go('4p');}
async function render(){
  const m=document.getElementById('main');
  if(TAB==='4') return renderTT(m);
  if(TAB==='4p') return renderCoach(m);
  if(TAB==='3') return renderPrep(m);
  m.innerHTML='<div class="placeholder">「'+JOURNEY.find(x=>x[0]===TAB)[1]+'」 — 다음 파에서 배포됩니다</div>';
}
async function renderTT(m){
  m.innerHTML='<div class="load">시간표 불러오는 중…</div>';
  try{
    if(!TT) TT=await rpc('gz_tt_data');
    const days=['일','월','화','수','목','금','토'];
    const todayD=new Date().getDay()+1;
    let cols='';
    for(const dd of [2,3,4,5,6,7,1]){ /* 월 시작 — full_page 정본 */
      const solos=(TT.solo||[]).filter(x=>x.d===dd).sort((a,b)=>(a.st||'').localeCompare(b.st||''));
      const grps=(TT.groups||[]).filter(x=>x.d===dd).sort((a,b)=>(a.st||'').localeCompare(b.st||''));
      cols+=`<div class="col"><div class="dh ${dd===todayD?'today':''}">${days[dd-1]}<small>반 ${grps.length} · 개별 ${solos.length}</small></div>`;
      grps.forEach(g=>{cols+=`<div class="card grp"><span class="t">${(g.st||'').slice(0,5)}</span> <b>${g.k||''}</b> ${g.gl||''}<div class="roster">${(g.roster||[]).length}명 · ${g.t||''}</div></div>`;});
      solos.forEach(s=>{cols+=`<div class="card"><span class="t">${(s.st||'').slice(0,5)}</span> <b onclick="openCoach(${s.sid},'${s.n}')">${s.n} ▶</b><div class="roster">${s.sch||''} ${s.gr||''} · ${s.t||''}</div></div>`;});
      cols+='</div>';
    }
    m.innerHTML='<div class="mini" style="max-width:1080px;margin:0 auto 6px;">학생 이름 ▶ 클릭 = 코칭 카드</div><div class="ttwrap"><div class="tt">'+cols+'</div></div>';
  }catch(e){m.innerHTML='<div class="err">회선 오류: '+e.message+'</div>';}
}
async function renderCoach(m){
  let pick='';
  try{
    if(!TT) TT=await rpc('gz_tt_data');
    const uniq={}; (TT.solo||[]).forEach(s=>{uniq[s.sid]=s;});
    pick='<select id="stuSel" onchange="COACH_SID=+this.value;COACH_NAME=this.selectedOptions[0].dataset.n;renderCoachBody()"><option value="">학생 선택…</option>'+
      Object.values(uniq).sort((a,b)=>a.n.localeCompare(b.n)).map(s=>`<option value="${s.sid}" data-n="${s.n}" ${s.sid===COACH_SID?'selected':''}>${s.n} · ${s.sch||''} ${s.gr||''}</option>`).join('')+'</select>';
  }catch(e){pick='<span class="err">'+e.message+'</span>';}
  m.innerHTML='<div class="pick">코칭 대상: '+pick+'</div><div id="cbody"></div>';
  renderCoachBody();
}
function renderCoachBody(){
  const c=document.getElementById('cbody');
  if(!COACH_SID){c.innerHTML='<div class="placeholder">학생을 선택하면 카드가 열립니다</div>';return;}
  c.innerHTML=`
  <div class="ccard">
    <div class="zone"><h3><span class="zn">1</span>${COACH_NAME} — ${new Date().toISOString().slice(0,10)}</h3>
      <div id="cycband" class="mini">시기 띠 불러오는 중…</div></div>
    <div class="zone"><h3><span class="zn">2</span>오늘의 첫 질문 — 지난 과제 해왔나요?</h3>
      <div id="prevband" class="mini" style="margin-bottom:5px;">지난 과제 불러오는 중…</div>
      <div class="p1" id="p1">
        <button onclick="selP1(this,'해옴')">해옴</button><button onclick="selP1(this,'부분')">부분만</button><button onclick="selP1(this,'안해옴')">안 해옴</button>
      </div>
      <input type="text" id="hwreason" placeholder="사유 (부분·안 해옴일 때)" style="display:none;margin-top:5px;"></div>
    <div class="zone"><h3><span class="zn">3</span>교시 기록 <span class="mini" id="plabels"></span></h3>
      <div class="mini" style="margin-bottom:4px;">교시 활동 체크: <span id="acts"></span></div>
      <textarea id="lesson" placeholder="1교시 — 과제 확인 평가 (필수)"></textarea>
      <div style="height:6px"></div>
      <div class="row"><textarea id="p2c" placeholder="2교시 — 내용" style="min-height:40px;"></textarea><input type="text" id="p2paper" placeholder="2교시 자료(지문·교안)" style="max-width:220px;"></div>
      <div style="height:6px"></div>
      <div class="row"><textarea id="p3c" placeholder="3교시 — 내용" style="min-height:40px;"></textarea><input type="text" id="p3paper" placeholder="3교시 자료" style="max-width:220px;"></div>
      <div style="height:6px"></div>
      <textarea id="memo" placeholder="교사 메모 (선택)" style="min-height:40px;"></textarea></div>
    <div class="zone"><h3><span class="zn">4</span>판정 회로 — 시험지·오답 (선택이지만, 이 칸이 1번 과제)</h3>
      <input type="text" id="wq" placeholder="작품·교재 검색 (제목 2자 이상)" oninput="searchWork(this.value)">
      <div class="wres" id="wres" style="display:none"></div>
      <div class="wtag" id="wtag"></div>
      <div style="height:6px"></div>
      <div class="row">
        <select id="pno" style="max-width:110px;"><option value="1">1교시</option><option value="2">2교시</option><option value="3">3교시</option></select>
        <input type="number" id="round" min="1" max="9" placeholder="회차 1~9">
        <input type="number" id="totq" min="1" placeholder="총 문항수">
        <input type="text" id="wrongs" placeholder="오답 번호 예: 3,7,12"></div>
      <div class="mini">저장 시 서버가 번호 정규화(규칙 26) 후 KLEA 문항 매칭·처방 큐 생성</div></div>
    <div class="zone"><h3><span class="zn">C</span>1:1 코칭 — 4 카테고리 (매뉴얼 정본: 한 가지에 집중)</h3>
      <div class="p1" id="chipcat">
        <button onclick="selCat(this,'학습전략')">학습전략</button><button onclick="selCat(this,'과제평가')">과제평가</button><button onclick="selCat(this,'동기부여')">동기부여</button><button onclick="selCat(this,'연습방법')">연습방법</button>
      </div>
      <input type="text" id="chiptext" placeholder="선택한 카테고리의 코칭 한 줄" style="margin-top:5px;">
      <div class="mini" style="margin-top:4px;">메모 태그: <span id="mtags"></span></div></div>
    <div class="zone"><h3><span class="zn">5</span>과제 · 다음 전략</h3>
      <div class="row"><input type="text" id="hw" placeholder="과제 내용"><input type="date" id="hwdue"></div>
      <div style="height:6px"></div>
      <input type="text" id="nexts" placeholder="다음 수업 전략 (F168 3줄 요지)"></div>
    <div class="savebar">
      <button class="btn" onclick="saveCard()">카드 저장</button>
      <button class="btn grn" onclick="saveWrong()">오답 저장(판정)</button>
      <span id="rcpt"></span></div>
  </div>`;
  ACTS={p1:[],p2:[],p3:[]};TAGS=[];CAT='';drawActs();drawTags();loadPrefill();loadCycle();if(PIN&&!document.getElementById('p2paper').value)document.getElementById('p2paper').value=PIN.title.slice(0,40);
}
async function loadCycle(){
  const band=document.getElementById('cycband');
  try{
    const r=await rpc('gz_student_plan_card',{p_sid:COACH_SID});
    const e=r&&r.exam;
    if(!e){band.textContent='시험 사이클 미설정';return;}
    let t=(e.jeolgi?'🌾'+e.jeolgi+' · ':'')+(e.exam_name||'')+' '+(e.exam_date?e.exam_date.slice(5).replace('-','/'):'')
      +' · D-'+e.d_day+' · '+(e.phase||'')+(e.exam_block?' · '+e.exam_block:'')+(e.track_ab?' · 내신:수능 '+e.track_ab:'');
    if(r.gaps&&r.gaps.length) t+=' · <span style="color:var(--warn);font-weight:bold;">보완 '+r.gaps.length+'건</span>';
    band.innerHTML=t;
    band.title=(r.gaps||[]).join(' / ');
  }catch(x){band.textContent='시기 띠 회선 오류';}
}
async function loadPrefill(){
  const band=document.getElementById('prevband');
  try{
    const pf=await rpc('gz_coach_prefill',{p_sid:COACH_SID});
    let t='';
    if(pf&&pf.prev&&pf.prev.hw) t+='지난 과제('+(pf.prev.log_date||'')+'): '+pf.prev.hw;
    if(pf&&pf.stat4w) t+=(t?' · ':'')+'4주 이행 — 해옴 '+pf.stat4w['해옴']+' · 부분 '+pf.stat4w['부분']+' · 안 해옴 '+pf.stat4w['안해옴'];
    if(pf&&pf.today&&pf.today.id){t+=(t?' · ':'')+'⚠ 오늘 기록 있음(#'+pf.today.id+') — 저장하면 갱신됩니다';
      if(pf.today.memo&&!document.getElementById('memo').value) document.getElementById('memo').value=pf.today.memo;}
    band.textContent=t||'지난 과제 기록 없음';
  }catch(e){band.textContent='프리필 회선 오류: '+e.message.slice(0,60);}
}
let P1='', CAT='', ACTS={p1:[],p2:[],p3:[]}, TAGS=[];
const ACT_DEF=['복습테스트','메타인지','강의','문풀','첨삭','테스트'];
const TAG_DEF=['태도','이해','과제','상담필요','칭찬'];
function drawActs(){
  document.getElementById('acts').innerHTML=[1,2,3].map(n=>
    '<b style="margin-left:6px;">'+n+'교시</b> '+ACT_DEF.map(a=>{
      const on=ACTS['p'+n].includes(a);
      return `<span onclick="tgAct(${n},'${a}')" style="cursor:pointer;border:1px solid ${on?'var(--new)':'#bbc'};color:${on?'var(--new)':'#889'};border-radius:8px;padding:0 6px;font-size:10px;margin:1px;${on?'background:#effaf3;font-weight:bold;':''}">${a}</span>`;
    }).join('')).join('');
}
function tgAct(n,a){const arr=ACTS['p'+n];const i=arr.indexOf(a);if(i>-1)arr.splice(i,1);else arr.push(a);drawActs();}
function drawTags(){
  document.getElementById('mtags').innerHTML=TAG_DEF.map(t=>{
    const on=TAGS.includes(t);
    return `<span onclick="tgTag('${t}')" style="cursor:pointer;border:1px solid ${on?'var(--acc)':'#bbc'};color:${on?'var(--acc)':'#889'};border-radius:8px;padding:0 7px;font-size:10.5px;margin:1px;${on?'background:#f4f8fe;font-weight:bold;':''}">${t}</span>`;
  }).join('');
}
function tgTag(t){const i=TAGS.indexOf(t);if(i>-1)TAGS.splice(i,1);else TAGS.push(t);drawTags();}
const CAT_KEY={'학습전략':'strategy','과제평가':'task_eval','동기부여':'motivation','연습방법':'practice'}; /* DB CHECK chk_cl_coach_chips 4키 정본 */
function selCat(btn,v){CAT=v;document.querySelectorAll('#chipcat button').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');}
function selP1(btn,v){P1=v;document.querySelectorAll('#p1 button').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');
  document.getElementById('hwreason').style.display=(v==='해옴')?'none':'block';
  /* 함수 v_lesson 라벨 규칙 미러 */
  const l1=(v==='안해옴')?'1교시=미이행 기록':(v==='해옴'?'1교시=과제 확인 평가':'1교시=과제 확인 평가');
  const l2=(v==='안해옴')?'2교시=강의 진도':(v==='부분'?'2교시=남은 과제 소화':'2교시=심화 훈련');
  document.getElementById('plabels').textContent='('+l1+' · '+l2+' — 첫질문 답에 따라 서버가 라벨 조립)';}
function searchWork(q){
  const box=document.getElementById('wres');
  if((q||'').trim().length<2){box.style.display='none';return;}
  clearTimeout(window._wt);
  window._wt=setTimeout(async()=>{
    try{
      const rows=await rest('works?select=id,title,author&title=ilike.*'+encodeURIComponent(q.trim())+'*&limit=8');
      box.innerHTML=rows.length?rows.map(w=>`<div onclick='pickWork(${w.id},${JSON.stringify(w.title)})'>W${w.id} · ${w.title} ${w.author?'— '+w.author:''}</div>`).join(''):'<div>결과 없음</div>';
      box.style.display='block';
    }catch(e){box.innerHTML='<div>검색 오류</div>';box.style.display='block';}
  },250);
}
function pickWork(id,title){WORK={id,title};document.getElementById('wtag').textContent='선택: W'+id+' · '+title;document.getElementById('wres').style.display='none';}
function receipt(ok,msg){const r=document.getElementById('rcpt');r.className='receipt '+(ok?'ok':'bad');r.textContent=msg;}
async function saveCard(){
  const lesson=document.getElementById('lesson').value.trim();
  if(!COACH_SID||!lesson){receipt(false,'학생·수업 내용은 필수');return;}
  try{
    /* 함수 실계약(원문 실측): hw_status=3택(해옴/부분/안해옴), p1_eval=1교시 내용 텍스트 → lesson_note 자동 조립 */
    const res=await rpc('gz_save_coach_card',{p:{student_id:COACH_SID,log_date:new Date().toISOString().slice(0,10),
      p1_eval:lesson,hw_status:P1||null,
      p2:{content:document.getElementById('p2c').value.trim()||null,paper:document.getElementById('p2paper').value.trim()||null},
      p3:{content:document.getElementById('p3c').value.trim()||null,paper:document.getElementById('p3paper').value.trim()||null},
      memo:document.getElementById('memo').value.trim()||null,
      memo_tags:TAGS.length?TAGS.join(','):null,
      period_acts:(ACTS.p1.length||ACTS.p2.length||ACTS.p3.length)?ACTS:null,
      coach_chips:(CAT&&document.getElementById('chiptext').value.trim())?{[CAT_KEY[CAT]]:document.getElementById('chiptext').value.trim()}:null,
      homework_text:document.getElementById('hw').value.trim()||null,hw_due:document.getElementById('hwdue').value||null,hw_reason:document.getElementById('hwreason').value.trim()||null,
      next_strategy:document.getElementById('nexts').value.trim()||null}});
    /* 기계적 검증: SECURITY DEFINER RPC의 자체 되읽기 반환(v_created·id) — anon REST는 RLS로 차단되므로 반환이 정본 */
    const ok=res&&(res.ok===true||res.created===true||res.v_created===true||res.id||res.log_id);
    receipt(!!ok,ok?('저장 검증 ✓ '+JSON.stringify(res).slice(0,90)):'서버 반환에 검증 필드 없음: '+JSON.stringify(res).slice(0,90));
  }catch(e){receipt(false,'저장 실패: '+e.message);}
}
async function saveWrong(){
  const round=+document.getElementById('round').value, totq=+document.getElementById('totq').value;
  const wrongs=document.getElementById('wrongs').value.trim();
  if(!COACH_SID||!WORK||!round||!wrongs){receipt(false,'판정 필수: 학생·작품·회차·오답 번호');return;}
  try{
    const res=await rpc('gz_save_period_wrong',{p:{student_id:COACH_SID,log_date:new Date().toISOString().slice(0,10),
      period_no:+document.getElementById('pno').value||1,round_no:round,work_id:WORK.id,wrong_nums:wrongs,total_questions:totq||null}});
    const ok=res&&(res.ok===true||res.id||res.item_id||res.saved);
    receipt(!!ok,ok?('오답 저장 검증 ✓ — KLEA 매칭 파이프 진입 '+JSON.stringify(res).slice(0,80)):'서버 반환 확인 필요: '+JSON.stringify(res).slice(0,80));
  }catch(e){receipt(false,'판정 저장 실패: '+e.message);}
}
let PIN=null; /* 검색 결과를 코칭에 꽂기 */
async function renderPrep(m){
  m.innerHTML='<div class="pick"><input type="text" id="gq" placeholder="통합 검색 — 작품·강좌·교안 (2자 이상)" oninput="gsearch(this.value)"><div class="wres" id="gres" style="display:none"></div><div class="wtag" id="gpin">'+(PIN?('꽂힌 자료: '+PIN.title.slice(0,50)+' — 코칭 카드 2교시 자료칸에 자동 입력'):'')+'</div></div><div id="queue" class="pick">대기열 불러오는 중…</div>';
  try{
    const rows=await rpc('gz_prep_texts');
    rows.sort((a,b)=>(b.n||0)-(a.n||0)); /* 힘순 = 영향 학생수 */
    const head='<tr><th style="text-align:left">교재(힘순)</th><th>학생</th><th>다음</th>'+[1,2,3,4,5,6,7].map(i=>'<th>S'+i+'</th>').join('')+'<th>CLEAR</th></tr>';
    const body=rows.slice(0,25).map(r=>{
      const s=(r.steps||[]);
      return '<tr><td style="text-align:left">'+(r.title||'').slice(0,38)+'</td><td>'+(r.n||0)+'</td><td>'+(r.nx||'')+'</td>'
        +[0,1,2,3,4,5,6].map(i=>'<td style="text-align:center">'+((s[i]||0)>0?'':'<span style="color:var(--warn);font-weight:bold">✕</span>')+'</td>').join('')
        +'<td style="text-align:center">'+((r.clear_n||0)>0?'':'<span style="color:var(--warn);font-weight:bold">✕</span>')+'</td></tr>';
    }).join('');
    document.getElementById('queue').innerHTML='<b>작업 대기열</b> — 안 된 것에만 ✕ · 영향 학생수 내림차순 (상위 25 / 전체 '+rows.length+')<table class="tb" style="margin-top:5px">'+head+body+'</table><div class="mini">정보│영상 2칸 정밀 판정은 회선 확장 후(결선 명기)</div>';
  }catch(e){document.getElementById('queue').innerHTML='<span class="err">대기열 회선 오류: '+e.message+'</span>';}
}
function gsearch(q){
  const box=document.getElementById('gres');
  if((q||'').trim().length<2){box.style.display='none';return;}
  clearTimeout(window._gt);
  window._gt=setTimeout(async()=>{
    try{
      const rows=await rpc('gz_global_search',{p_q:q.trim()});
      box.innerHTML=(rows||[]).slice(0,10).map(r=>`<div onclick='pinIt(${JSON.stringify(JSON.stringify({id:r.id,kind:r.kind,title:r.title}))})'>[${r.sub||r.kind}] ${r.title}</div>`).join('')||'<div>결과 없음</div>';
      box.style.display='block';
    }catch(e){box.innerHTML='<div>검색 오류</div>';box.style.display='block';}
  },250);
}
function pinIt(s){PIN=JSON.parse(s);document.getElementById('gres').style.display='none';document.getElementById('gpin').textContent='꽂힌 자료: '+PIN.title.slice(0,50)+' — 코칭 카드 2교시 자료칸에 자동 입력';}
document.getElementById('role').value=localStorage.getItem('g2role')||'teacher';
drawTabs();render();
</script>
