<style>

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
header{background:#fff;border-bottom:2px solid var(--ink);padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

.role{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:11px;white-space:nowrap;}
main{padding:12px;max-width:1280px;margin:0 auto;}

}
.ttwrap{overflow-x:auto;}

#cmPanel button.warn{border-color:var(--warn);color:var(--warn);font-weight:700}#cmPanel button:disabled{opacity:.45;cursor:default}

#cmPanel .ok{color:#1E6B45;font-weight:700}#cmPanel .no{color:#B5452E;font-weight:700}#cmPanel .mid{color:#8a6d1f;font-weight:700}
#cmPanel .cmBox{border:1px solid #dde;border-radius:6px;padding:12px;line-height:1.9}
.card.grp .ged{margin-top:5px;padding-top:5px;border-top:1px dashed #b8c6dc;cursor:default}
.ged .gm{display:flex;justify-content:space-between;align-items:center;padding:2px 0;font-size:12px}
.ged button{font-size:11px;padding:1px 7px;border:1px solid #aab;border-radius:4px;background:#fff;cursor:pointer}
.ged button.warn{border-color:var(--warn);color:var(--warn);font-weight:700}

.card .t{color:#889;font-size:10px;}

.p1{display:flex;gap:6px;}

textarea,input[type=text],input[type=number],input[type=date],select{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:12px;font-family:inherit;}
textarea{min-height:52px;resize:vertical;}
.row{display:flex;gap:8px;} .row>*{flex:1;}

.wres{border:1px solid var(--line);border-radius:6px;margin-top:4px;max-height:130px;overflow:auto;}

.wres div:hover{background:#f4f8fe;}

/* 슬라이드 패널 — 시간표<->코칭 왕복(현행 UX 계승) */
#slide{position:fixed;top:0;right:-560px;width:540px;max-width:92vw;height:100vh;background:#fff;border-left:2px solid var(--ink);box-shadow:-6px 0 18px rgba(0,0,0,.12);transition:right .25s;z-index:50;overflow-y:auto;padding:12px;}
#slide.open{right:0;} body.full main#main{display:none} body.full #slide{max-width:100vw!important;width:100vw;left:0} body.full #cbody .ccard{column-count:2;column-gap:14px} body.full .zone{break-inside:avoid} .wh{width:100%;border-collapse:collapse;font-size:12px} .wh td{padding:3px 0;border-top:1px solid #eee} .wh td:first-child{width:36%;color:#5f5b52} .sg{display:inline-flex;border:1px solid #99a;border-radius:8px;overflow:hidden;vertical-align:middle} .sg button{border:0;background:#fff;padding:5px 9px;min-height:30px;font-size:12px;color:#445;cursor:pointer} .sg button+button{border-left:1px solid #99a} .sg button.on{background:#1e2733;color:#fff} .ch button{border:1px solid #99a;background:#fff;border-radius:14px;padding:4px 9px;min-height:30px;font-size:12px;color:#445;margin:2px;cursor:pointer} .ch button.on{background:#fdecec;border-color:#b42318;color:#b42318} .v6lab{display:block;font-size:11px;font-weight:700;margin:6px 0 3px}

#slidebody{font-size:13px;line-height:1.45;color:#1e2733}
#slidebody .mini{font-size:11px;color:#5f5b52}

#slidebody .ch button,#slidebody .p1 button,#slidebody .wc,#slidebody #hwchips button,#slidebody #chipcat button,#slidebody #mtags button,#slidebody #tsWhy button{border-radius:14px;padding:5px 11px;min-height:30px}
#slidebody .sg{border-radius:8px;overflow:hidden;border:1px solid #c9ced6}#slidebody .sg button{border:0;border-radius:0;box-shadow:none;min-height:30px}#slidebody .sg button+button{border-left:1px solid #c9ced6}#slidebody .sg button.on{background:#1e2733;color:#fff}
#slidebody .p1 button.on,#slidebody .p1 button.sel,#slidebody .ch button.on,#slidebody .wc.sel,#slidebody #chipcat button.on,#slidebody #mtags button.on{background:#fdecec;border-color:#b42318;color:#b42318}
#slidebody .tag,#slidebody .tybadge{font-size:11px;border-radius:10px;padding:2px 8px}

#slidebody .zh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:-12px -14px 10px;padding:9px 14px;border-bottom:2px solid #dfe4ea;background:#fafbfc;border-radius:10px 10px 0 0}
#slidebody .zh .zn,#slidebody .zn{width:20px;height:20px;border-radius:50%;background:#1e2733;color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:none}
#slidebody .zh.cur{background:#fbf3e3;border-bottom-color:#B8892E}
#slidebody .zh small{font-weight:400;color:#5f5b52;font-size:11px;margin-left:auto}
#slidebody .v6lab,#slidebody .lab{font-size:11px;font-weight:700;color:#334;margin:8px 0 4px}
#slidebody .wh td{padding:4px 0;border-top:1px solid #eef0f3}
#slidebody .savebar{background:#fff;border-top:1px solid #dfe4ea;padding:10px 0;margin-top:6px;display:flex;gap:8px;align-items:center}
#slidebody [style*="font-size"]:not(b):not(h3){font-size:12px!important}#slidebody b[style*="font-size"]{font-size:13px!important}#slidebody .mini,#slidebody .mini *{font-size:11px!important}#slidebody div[style*="border"]{border-color:#dfe4ea!important;border-radius:10px!important}#slidebody span[style*="border"]{border-color:#c9ced6!important}
#slidebody .receipt{font-size:12px}

.qtabs button{border:1px solid #d8d4c8;background:#fff;border-radius:8px 8px 0 0;padding:3px 9px;font-size:12px;cursor:pointer} .qtabs button.on{background:#fbf3e3;border-color:#B8892E;color:#B8892E;font-weight:700} .qtabs button.done{color:#15803d}
#slide .close{position:sticky;top:0;background:#fff;padding:4px 0;text-align:right;z-index:2;}

.tchips .tb{border:1px solid #1E4D3B;background:#fff;color:#1E4D3B;border-radius:14px;padding:2px 9px;cursor:pointer;font-family:inherit;font-size:12px}.tchips .tb.on{background:#1E4D3B;color:#fff}.tchips small{opacity:.7}
.card.sshit{outline:2px solid #e8b93c;background:#fff8e1}.tybadge{display:inline-block;margin-left:4px;padding:0 5px;border-radius:3px;background:#f7f0d8;color:#8a6d1f;font-size:10px;font-weight:700;vertical-align:middle}
.card.stu.hw{border-left:3px solid #8a6d1f}

.tybadge.reg{background:#1E4D3B;color:#fff}.tybadge.reg b{color:#cfe3d6}.card.stu.reg{border-left:3px solid #1E4D3B}

<style id="cccss">
#ccwrap{--ccbg:#f7f7f4;--ccfg:#1b1b1b;--ccmut:#6b6b6b;--ccline:#dedcd5;--cccard:#fff;--ccacc:#2b6cb0;--cchl:#fff3c4;--ccax1:#eef2f7;--ccax2:#f5f1ea;
  color:var(--ccfg);font-size:13.5px;line-height:1.45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #ccwrap{--ccbg:#141414;--ccfg:#e8e6e1;--ccmut:#9a9a9a;--ccline:#2c2c2c;--cccard:#1c1c1c;--ccacc:#7fb3f0;--cchl:#3a3410;--ccax1:#1e2530;--ccax2:#2a251c}}
:root[data-theme="dark"] #ccwrap{--ccbg:#141414;--ccfg:#e8e6e1;--ccmut:#9a9a9a;--ccline:#2c2c2c;--cccard:#1c1c1c;--ccacc:#7fb3f0;--cchl:#3a3410;--ccax1:#1e2530;--ccax2:#2a251c}
#ccwrap .cctop{position:sticky;top:0;z-index:3;background:var(--cccard);border:1px solid var(--ccline);border-radius:8px;padding:8px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
#ccwrap .cctop input,#ccwrap .cctop select{font:inherit;padding:6px 10px;border:1px solid var(--ccline);border-radius:6px;background:var(--ccbg);color:var(--ccfg);min-width:220px;max-width:100%}
#ccwrap .ccst{font-size:12px;color:var(--ccmut)}

#ccwrap .cctree{padding:10px 12px;background:var(--cccard);border:1px solid var(--ccline);border-radius:8px;overflow:auto;max-height:calc(100vh - 210px)}

#ccwrap .ccc{font-size:11px;color:var(--ccmut);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums;opacity:.85}
#ccwrap .ccax{font-size:10px;padding:0 5px;border-radius:3px;background:var(--ccax2);color:var(--ccmut)}

#main:has(#ccwrap){max-width:none}

/* ===== 「개념」 탭 v2 — RN #7254 프로토타입 정본 이식 (읽기 전용) ===== */
let CCD=null,CCN={},CCroots=[],CCbyW={},CCbyC={},CCWT={},CCst=null;
let ccW=null,ccQ='',ccSel=null;
const CCORDER=['문학','문법','독서','화작','매체','공통'];
function ccPath(c){const a=[];let n=CCN[c];while(n){a.unshift(n.name);n=CCN[n.p]}return a.join(' > ');}
function ccAxis(n){if(n.lv<=0)return'';const c=n.code;
  if(/^(LIT-G|READ-(HU|SS|NS|TE|AR)|HWA-SPK-TYPE|MED-TYPE|MED-CHG|GRM-(PHON|WORD|SENT|SEM|HANGUL|HIST|ORTH|DISC))/.test(c)&&!/^READ-M/.test(c))return'축1';
  if(/^(LIT-A|READ-M|HWA-(SPK|WRT)|MED-(RECV|PROD)|COM)/.test(c))return'축2';return'';}
function ccCount(n){return 1+n.ch.reduce((a,c)=>a+ccCount(c),0);}
function ccBuildIndex(D){
  CCD=D; CCN={};
  D.tree.forEach(r=>{CCN[r[0]]={code:r[0],name:r[1],dom:r[2],lv:r[3],p:r[4],gs:r[5]||[],e:r[6],s:r[7],w:r[8],sc:r[9],ch:[]};});
  Object.values(CCN).forEach(n=>{if(n.p&&CCN[n.p])CCN[n.p].ch.push(n);});
  CCroots=Object.values(CCN).filter(n=>!n.p);
  CCroots.sort((a,b)=>CCORDER.indexOf(a.dom)-CCORDER.indexOf(b.dom));
  CCbyW={};CCbyC={};
  D.summ.forEach(r=>{(CCbyW[r[0]]=CCbyW[r[0]]||[]).push(r);(CCbyC[r[1]]=CCbyC[r[1]]||[]).push(r);});
  CCWT={};D.works.forEach(w=>CCWT[w[0]]=w[1]);
}
function ccRender(){
  const t=document.getElementById('cctree'); if(!t) return; t.innerHTML='';
  const wset=ccW?new Set((CCbyW[ccW]||[]).map(r=>r[1])):null;
  const keep=new Set();
  if(wset||ccQ){Object.values(CCN).forEach(n=>{
    const hit=(wset?wset.has(n.code):true)&&(ccQ?(n.name+n.code).toLowerCase().includes(ccQ):true);
    if(hit){let m=n;while(m){keep.add(m.code);m=CCN[m.p];}}});}
  CCroots.forEach(r=>{
    const d=document.createElement('details');d.className='ccdom';d.open=true;
    const sm=document.createElement('summary');sm.textContent=r.name+'  ';
    const cnt=document.createElement('span');cnt.className='cctg';
    cnt.textContent=(wset?`이 작품 ${(CCbyW[ccW]||[]).filter(x=>CCN[x[1]]&&CCN[x[1]].dom===r.dom).length}개`:`${ccCount(r)}개념 항목`);
    sm.appendChild(cnt);d.appendChild(sm);
    const ul=ccBuild(r,keep,wset); if(ul){d.appendChild(ul);t.appendChild(d);}
  });
  const st=document.getElementById('ccst');
  if(st) st.textContent=ccW?`작품별 · ${CCWT[ccW]||''} — 개념 ${(CCbyW[ccW]||[]).length}개`
    :(ccQ?`검색 "${ccQ}"`:`전체 체계 보기 ${CCD?CCD.tree.length:0}개념 항목`);
}
function ccBuild(n,keep,wset){
  const ul=document.createElement('ul');let any=false;
  n.ch.sort((a,b)=>(b.e+b.s)-(a.e+a.s)||a.code.localeCompare(b.code)).forEach(c=>{
    if(keep.size&&!keep.has(c.code))return; any=true;
    const li=document.createElement('li');
    const row=document.createElement('div');row.className='ccn'+(ccSel===c.code?' sel':'');
    const isHit=wset?wset.has(c.code):(ccQ&&(c.name+c.code).toLowerCase().includes(ccQ));
    if(isHit)row.classList.add('hit');
    const tg=document.createElement('span');tg.className='cctog';tg.textContent=c.ch.length?'▾':'·';row.appendChild(tg);
    const nm=document.createElement('span');nm.textContent=c.name;row.appendChild(nm);
    const ax=ccAxis(c);if(ax){const a=document.createElement('span');a.className='ccax';a.textContent=ax;row.appendChild(a);}
    if(c.gs&&c.gs.length&&c.gs.length<5){const g=document.createElement('span');g.className='ccgs';g.textContent=c.gs.map(x=>x.slice(0,2)).join('·');row.appendChild(g);}
    const cc=document.createElement('span');cc.className='ccc';
    if(wset){const r=(CCbyW[ccW]||[]).find(x=>x[1]===c.code);
      cc.textContent=r?`출제 ${r[2]} · 교안 ${r[3]}${r[4].length?' · '+r[4].join(','):''}`:'';}
    else cc.textContent=`출제 ${c.e} · 교안 ${c.s} · 작품 ${c.w}`;
    row.appendChild(cc);
    row.onclick=e=>{e.stopPropagation();ccSel=c.code;ccShowC(c);ccRender();};
    li.appendChild(row);
    const sub=ccBuild(c,keep,wset); if(sub)li.appendChild(sub);
    ul.appendChild(li);
  });
  return any?ul:null;
}

<script>
(function(){
  var ST={data:null,sid:null,sel:null,qi:0,edit:{},busy:false,done:{},msg:''};
  var PERF=['○','△','✕'], CN='①②③④⑤';
  function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function hm(t){if(!t)return '';var d=new Date(t);if(isNaN(d))return '';var k=new Date(d.getTime()+9*36e5);return (k.getUTCMonth()+1)+'/'+k.getUTCDate()+' '+('0'+k.getUTCHours()).slice(-2)+':'+('0'+k.getUTCMinutes()).slice(-2);}
  function waitingOf(q){return (q.items||[]).filter(function(i){return i.kind==='서술'&&i.status==='확인대기'&&!ST.done[i.answer_id];}).length;}
  /* 조건 판정으로 점수 제안 — 서버 규칙 rsa-rule-v1과 같은 꼴(까닭 판정은 화면에 없어 모두 ○면 만점으로 제안) */
  function suggest(it,perf){var n=perf.length,o=perf.filter(function(p){return p==='○';}).length,h=perf.filter(function(p){return p==='△';}).length,m=+it.max||0;
    if(!n)return +it.machine_score||0; if(o===n)return m; if(o+h===n&&o>=1)return Math.max(m-1,0); if(o+h>=1)return Math.max(m-2,1); return 0;}
  function edOf(it){var k=it.answer_id;if(!ST.edit[k]){var pf=(it.conds||[]).map(function(c){return c.perf||'✕';});
      ST.edit[k]={perf:pf,score:(it.final_score!=null?+it.final_score:+it.machine_score),s1:it.strengths||'',s2:it.missing||'',s3:it.prescriptions||'',touched:false};}return ST.edit[k];}
  function cur(){var q=(ST.data.queue||[]).filter(function(x){return x.key===ST.sel;})[0];if(!q)return null;
    var es=(q.items||[]).filter(function(i){return i.kind==='서술';});return {q:q,es:es,it:es[Math.min(ST.qi,es.length-1)]};}
  function draw(){
    var box=document.getElementById('s4t'); if(!box)return; var D=ST.data, Q=D.queue||[];
    var wait=Q.reduce(function(a,q){return a+waitingOf(q);},0);
    var h='<div class="hd"><b>서술형 확인</b>'+(wait?'<span class="pl y">확인 기다림 '+wait+'건</span>':'<span class="pl g">기다리는 답 없음</span>')+'</div>';
    h+=Q.map(function(q){var w=waitingOf(q),ne=(q.items||[]).filter(function(i){return i.kind==='서술';}).length;
      return '<button type="button" class="sr'+(q.key===ST.sel?' on':'')+'" data-s4a="'+e(q.key)+'"><span class="x"><span class="s4nm">'+e(q.name||'학생')+'</span>'+(+q.sid===+ST.sid?' · 이 학생':'')
        +'<small>4단계 「'+e(q.work_title||q.title)+'」 · '+e(hm(q.submitted_at))+' 제출 · 서술 '+ne+'</small></span>'+(w?'<span class="pl y">확인 '+w+'</span>':'<span class="pl g">확인됨 ✓</span>')+'</button>';}).join('');
    var c=ST.sel&&cur();
    if(c){var q=c.q,it=c.it;
      h+='<div class="dt"><div class="bx">';
      var sh=(q.items||[]).filter(function(i){return i.kind==='단답';});
      if(sh.length)h+='<div class="lab" style="margin-top:0">단답 — 정답 대조로 자동 판정 (여러 개 쓰는 문항은 맞힌 만큼 부분 점수)</div>'+sh.map(function(i){var sc=i.final_score!=null?+i.final_score:+(i.machine_score||0), ok=sc>=+i.max, part=!ok&&sc>0;
        return '<div class="sh"><span class="mk '+(ok?'ok':'yet')+'">'+(ok?'맞음':part?'일부':'아직')+'</span><span class="x">'+i.q_no+' · 「'+e(i.text)+'」<small>'+sc+' / '+i.max+'점</small></span>'+(ok?'':'<button type="button" class="ob" data-s4ok="'+i.answer_id+'">맞게 처리</button>')+'</div>';}).join('');
      if(it){var ed=edOf(it), done=ST.done[it.answer_id]||it.status==='확인됨', sug=suggest(it,ed.perf);
        h+='<div class="qh" style="margin-top:'+(sh.length?'12px':'0')+'">문항 '+it.q_no+' · 서술 '+it.max+'점'+(it.passage?' · '+e(it.passage):'')+(c.es.length>1?' <span class="pl">'+(ST.qi+1)+' / '+c.es.length+'</span>':'')
          +(done?'<span class="pl g">선생님 확인됨</span>':'<span class="pl y">1차 채점 · 확인 전</span>')+'</div>'
          +'<div class="pr">'+e(it.prompt)+'</div>'
          +'<div class="cd">〈조건〉'+(it.cond_def||[]).map(function(d){return '<br>'+CN.charAt((+d.no||1)-1)+' '+e(d.ask);}).join('')+'</div>'
          +'<div class="an"><small>학생 답'+(it.attempt>1?' · '+it.attempt+'번째로 낸 답':'')+'</small>'+e(it.text)+'</div>'
          +'<div class="lab">조건별 판정 — 1차 제안이니 눌러서 고치세요</div>'
          +(it.conds||[]).map(function(cd,ix){var d=(it.cond_def||[])[ix]||{};return '<div class="cr"><span class="x">조건 '+CN.charAt((+cd.no||1)-1)+' '+e(cd.name)+'<small>1차 '+e(cd.perf)+(d.what?' · 볼 것: '+e(d.what):'')+'</small></span><span class="sg">'
            +PERF.map(function(p){return '<button type="button" data-s4c="'+ix+'" data-v="'+p+'" aria-pressed="'+(ed.perf[ix]===p)+'"'+(done?' disabled':'')+'>'+p+'</button>';}).join('')+'</span></div>';}).join('')
          +'<div class="lab">점수 <span class="sug">1차 '+it.machine_score+'점 · 조건대로면 '+sug+'점</span></div><span class="sg">'
          +Array.apply(null,{length:(+it.max||0)+1}).map(function(_,v){v=(+it.max)-v;return '<button type="button" data-s4s="'+v+'" aria-pressed="'+(ed.score===v)+'"'+(done?' disabled':'')+'>'+v+'</button>';}).join('')+'</span>'
          +(it.perf_levels&&it.perf_levels[ed.score]?'<div class="mn">'+ed.score+'점 수행 특성 — '+e(typeof it.perf_levels[ed.score]==='string'?it.perf_levels[ed.score]:(it.perf_levels[ed.score].desc||''))+'</div>':'')
          +'<div class="lab">학생에게 갈 말 3줄 — 초안, 고칠 수 있어요</div>'
          +'<div class="tl">① 잘한 점</div><textarea rows="2" data-s4t="s1"'+(done?' disabled':'')+'>'+e(ed.s1)+'</textarea>'
          +'<div class="tl">② 더 채울 점 (어디가 · 왜)</div><textarea rows="2" data-s4t="s2"'+(done?' disabled':'')+'>'+e(ed.s2)+'</textarea>'
          +'<div class="tl">③ 이렇게 다시 써 봐요</div><textarea rows="3" data-s4t="s3"'+(done?' disabled':'')+'>'+e(ed.s3)+'</textarea>'
          +(done?'<div class="toast">확인했어요 ✓ 학생 화면에 「선생님 확인됨」으로 보여요.'+(ST.last&&ST.last.autoshow?'<br>이 문항 확정 '+ST.last.autoshow.confirmed_n+'건 · 1차와 같음 '+ST.last.autoshow.agree_n+'건 (기준 '+ST.last.autoshow.min_n+'건)':'')+'</div>'
               +'<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">'+(ST.qi<c.es.length-1?'<button type="button" class="ob" data-s4n="1">다음 문항 →</button>':'')+'<button type="button" class="ob" data-s4next="1">다음 학생 →</button></div>'
             :(ed.score!==+it.machine_score&&ed.s2===(it.missing||'')&&/\d점/.test(ed.s2)?'<div class="msg">점수를 '+it.machine_score+'점 → '+ed.score+'점으로 바꿨어요. ② 문장의 깎인 점수도 맞춰 고쳐 주세요.</div>':'')
              +'<div class="mn">1차 채점과 다르게 고친 곳은 기록되어 채점 기준을 다듬는 데 씁니다.</div>'
              +(ST.msg?'<div class="msg">'+e(ST.msg)+'</div>':'')
              +'<button type="button" class="go" data-s4go="1"'+(ST.busy?' disabled':'')+'>'+(ST.busy?'보내는 중…':'확인하고 학생에게 보내기')+'</button>'
              +(c.es.length>1?'<div style="margin-top:6px;display:flex;gap:6px">'+(ST.qi>0?'<button type="button" class="ob" data-s4n="-1">← 이전 문항</button>':'')+(ST.qi<c.es.length-1?'<button type="button" class="ob" data-s4n="1">다음 문항 →</button>':'')+'</div>':''));
      }
      h+='</div>';
      if(it){var P=((D.peers||{})[it.rubric_id]||[]).filter(function(p){return p.answer_id!==it.answer_id;}), A=(D.autoshow||{})[it.rubric_id];
        h+='<div class="bx"><div class="qh">같은 문항, 다른 학생 답 <span class="pl">기준 맞추기</span></div><div class="mn" style="margin-top:2px">문항 '+it.q_no+' · 이름 없이 · 선생님마다 점수가 갈리지 않게 나란히 봐요</div>'
          +(P.length?P.map(function(p){var cf=p.final_score!=null, same=cf&&+p.final_score===+p.machine_score;
            return '<div class="sh"><span class="mk '+(cf?(same?'ok':'yet'):'yet')+'">'+(cf?(same?'같음':'다름'):'확인 전')+'</span><span class="x">'+e(p.text)+'<small>1차 '+p.machine_score+'점'+(cf?' · 확정 '+p.final_score+'점':'')+'</small></span></div>';}).join('')
            :'<div class="mn">아직 다른 학생 답이 없어요</div>')
          +(A?'<div class="mn" style="border-top:1px solid #EFECE3;padding-top:6px;margin-top:6px">이 문항 1차 채점 현황 — 확정 '+A.confirmed_n+'건 중 1차와 같음 '+A.agree_n+'건. 같음이 '+A.min_n+'건 쌓이면'+(A.min_rate?'(일치 '+Math.round(A.min_rate*100)+'% 이상)':'')+' 이 문항은 「채점 완료」로 바로 보여요. 그 전에는 「1차 채점 · 선생님 확인 전」으로 보여요.</div>':'')
          +'</div>';}
      h+='</div>';
    }
    box.innerHTML=h;
  }
  function bind(box){
    box.addEventListener('click',function(ev){
      var t=ev.target.closest('button'); if(!t||t.disabled)return; var c=ST.sel&&cur(), it=c&&c.it, ed=it&&edOf(it);
      if(t.dataset.s4a){ST.sel=t.dataset.s4a;ST.qi=0;ST.msg='';draw();return;}
      if(t.dataset.s4c!=null&&ed){ed.perf[+t.dataset.s4c]=t.dataset.v;ed.score=suggest(it,ed.perf);ed.touched=true;draw();return;}
      if(t.dataset.s4s!=null&&ed){ed.score=+t.dataset.s4s;draw();return;}
      if(t.dataset.s4n){ST.qi=Math.max(0,ST.qi+(+t.dataset.s4n));ST.msg='';draw();return;}
      if(t.dataset.s4next){var Q=ST.data.queue||[],i=Q.findIndex(function(q){return q.key===ST.sel;});var n=Q.slice(i+1).concat(Q.slice(0,i)).filter(function(q){return waitingOf(q);})[0];ST.sel=n?n.key:ST.sel;ST.qi=0;draw();return;}
      if(t.dataset.s4ok){var a=+t.dataset.s4ok, si=(c.q.items||[]).filter(function(i){return i.answer_id===a;})[0];
        rpc('gz2_step4_teacher_confirm',{p_answer:a,p:{score:si?+si.max:null}}).then(function(r){if(r&&r.ok&&si){si.final_score=r.final_score;si.status='확인됨';}else ST.msg=(r&&r.reason)||'저장하지 못했어요. 「맞게 처리」를 다시 눌러 주세요.';draw();}).catch(function(x){ST.msg='저장하지 못했어요. 「맞게 처리」를 다시 눌러 주세요. 자세한 내용: '+x.message;draw();});return;}
      if(t.dataset.s4go&&it){
        var p={conds:(it.conds||[]).map(function(cd,ix){return {no:cd.no,perf:ed.perf[ix]};}),score:ed.score,strengths:ed.s1,missing:ed.s2,prescriptions:ed.s3};
        ST.busy=true;ST.msg='';draw();
        rpc('gz2_step4_teacher_confirm',{p_answer:it.answer_id,p:p}).then(function(r){ST.busy=false;
          if(!r||!r.ok){ST.msg=(r&&r.reason)||'보내지 못했어요. 「확인하고 학생에게 보내기」를 다시 눌러 주세요.';draw();return;}
          ST.done[it.answer_id]=1; it.status='확인됨'; it.final_score=r.final_score; ST.last=r; if(r.autoshow&&ST.data.autoshow)ST.data.autoshow[it.rubric_id]=r.autoshow;
          var pr=(ST.data.peers||{})[it.rubric_id]||[]; pr.forEach(function(x){if(x.answer_id===it.answer_id){x.final_score=r.final_score;x.status='확인됨';}});
          draw();}).catch(function(x){ST.busy=false;ST.msg='보내지 못했어요. 「확인하고 학생에게 보내기」를 다시 눌러 주세요. 자세한 내용: '+x.message;draw();});}
    });
    box.addEventListener('input',function(ev){var k=ev.target.dataset.s4t;if(!k)return;var c=cur();if(c&&c.it){edOf(c.it)[k]=ev.target.value;}});
  }
  window.s4Sheet=function(c2,sid){
    if(!c2)return; var box=document.getElementById('s4t');
    if(!box){box=document.createElement('div');box.id='s4t';box.className='s4t';bind(box);}
    c2.appendChild(box); box.hidden=true; ST.sid=sid; ST.edit={}; ST.done={}; ST.sel=null; ST.qi=0; ST.last=null;
    rpc('gz2_step4_staff',{p_sid:sid}).then(function(r){
      if(sid!==COACH_SID||!r||!r.ok||!(r.queue||[]).length){box.hidden=true;return;}
      ST.data=r; var mine=(r.queue||[]).filter(function(q){return +q.sid===+sid;})[0]||(r.queue||[]).filter(function(q){return waitingOf(q);})[0]||r.queue[0];
      ST.sel=mine.key; box.hidden=false; draw();
    }).catch(function(){box.hidden=true;});
  };
})();
</script>

<script>
/* [2026-10-20 MAP] 수업준비 「진도·채점」에서 학생 이름을 누르면 관문이 sessionStorage gz_open_coach='sid|이름'을 남기고 이 탭을 연다 → 여기서 그 학생 코칭 카드를 연다(한 번 쓰고 지움). */
(function(){var n=0;function go(){var v=null;try{v=sessionStorage.getItem('gz_open_coach');}catch(_){return;}if(!v)return;
 if(typeof openCoach!=='function'||!document.querySelector('.card[data-sid]')){if(++n<80)setTimeout(go,250);return;}
 try{sessionStorage.removeItem('gz_open_coach');}catch(_){}var p=String(v).split('|'),sid=+p[0],nm=p.slice(1).join('|')||'';if(!sid)return;
 openCoach(sid,nm);var el=document.querySelector('.card[data-sid="'+sid+'"]');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('sshit');}}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(go,600);});else setTimeout(go,600);})();
</script>
<script>/* ═══ [2026-10-27 21:01 MAP 채팅37 · 국존 「재시공」] ① 할 양 합의 v2 — 교사 쪽 (코칭 카드 ⑤ 「과제 · 다음 전략」 자리) · ② 합의 뒤 이행표(날짜×과제 끝냄·못 함·안 함·결과, 이행률) · ③ 자율 단계(제안·확정)·알림 기록(gz2_agree_set_stage) · ④ 과제관리(gz2_hm_staff·book·cancel)
   - 기한 하나(다음 수업 · +7일 · 시험 전날 · 날짜) + 과제 여러 개(강좌·복습테스트·모의고사·문항·글쓰기·독서·오답 재풀이)
   - 과제마다 1회 시간·요일, 날짜가 정해진 과제만 「기한 따로」.
   - 원천: gz2_agree_staff · gz2_agree_pick · gz2_agree_offer · gz2_agree_accept.  agreeZone(el, sid, rpc) */
(function(){
  var DN=['','월','화','수','목','금','토','일'], SN={1:'배경 알기',2:'낱말·개념',3:'본문 분석',4:'정리하며 쓰기',5:'본문 외우기',6:'기본 문제',7:'심화 문제'};
  var KINDS=['강좌','복습테스트','모의고사','문항','글쓰기','독서','오답 재풀이'];
  var KC={'강좌':['#1E5A8A','#E3EEF7'],'복습테스트':['#7A3E9D','#F1E6F7'],'모의고사':['#7A5A12','#F7EFD9'],'문항':['#A4472F','#FBEAE4'],'글쓰기':['#1F6B3F','#E3F1E8'],'독서':['#55606b','#EEF0F2'],'오답 재풀이':['#A4472F','#FBEAE4'],'자료':['#4A5A2A','#EEF2E2']};
  var MINS=[10,20,30,40,60];
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function md(d){if(!d)return '';var x=new Date(d+'T00:00:00+09:00');return (x.getMonth()+1)+'/'+x.getDate()+'('+'일월화수목금토'[x.getDay()]+')';}
  function hm(t){if(!t)return '';var x=new Date(new Date(t).getTime()+9*36e5).toISOString();return Number(x.slice(5,7))+'/'+Number(x.slice(8,10))+' '+x.slice(11,16);}
  function addD(d,n){var x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10);}
  function dow(d){var g=new Date(d+'T12:00:00Z').getUTCDay();return g===0?7:g;}

<script>/* [2026-10-27 MAP 채팅37 · 노트 18177] ① 할 양 합의 — 코칭 카드 「다음 주 숙제」(R2) 자리에 붙인다.
   옛 과제 한 줄·기한 칸(#hw·#hwdue)은 숨기고, 보낼 때 합의 요약을 그 칸에 채워 카드 저장·학부모 리포트 흐름을 그대로 잇는다. */
(function(){
  var DN=['','월','화','수','목','금','토','일'];
  function summary(a){return (a.items||[]).map(function(it){return it.label+(it.steps?' '+it.steps.join('·')+'단계':'')+' '+it.minutes+'분('+it.days.map(function(d){return DN[d];}).join('')+')';}).join(' / ');}
  function fill(a){var hw=document.getElementById('hw'),du=document.getElementById('hwdue');
    if(hw){hw.value=('이번 주 할 양: '+summary(a)).slice(0,300);hw.dispatchEvent(new Event('input',{bubbles:true}));hw.dispatchEvent(new Event('change',{bubbles:true}));}
    if(du&&a.due){du.value=a.due;du.dispatchEvent(new Event('input',{bubbles:true}));du.dispatchEvent(new Event('change',{bubbles:true}));}}
  function safe(fn,b){return rpc(fn,b).catch(function(e){return {ok:false,reason:String((e&&e.message)||e)};});}
  function tick(){
    var hw=document.getElementById('hw'); if(!hw||typeof COACH_SID==='undefined'||!COACH_SID||typeof window.agreeZone!=='function')return;
    var row=hw.closest('.row')||hw, z=document.getElementById('agreeZone');
    if(z&&z.dataset.sid===String(COACH_SID)&&z.nextElementSibling===row)return;
    if(z)z.remove();
    z=document.createElement('div');z.id='agreeZone';z.className='zone';z.dataset.sid=String(COACH_SID);
    row.parentNode.insertBefore(z,row);row.style.display='none';
    window.agreeZone(z,COACH_SID,safe,fill);
  }
  setInterval(tick,800);
})();
</script>

 +'<h3>'+gedEsc(CM.gk)+' · 반 관리</h3><div class="mini">'+(g?(CM_D[g.dow]+'요일 '+cmTime(g.start)+' · '+g.members+'명 · 담당 '+gedEsc(g.teacher||'')):'')+'</div>'
 +'<div class="cmTabs">'+[['roster','명단 (추가·이동·퇴원)'],['time','시간'],['weeks','주차표 (책·과제 카드·계획)'],['print','학습계획서 인쇄']].map(t=>'<button data-cmtab="'+t[0]+'"'+(CM.tab===t[0]?' class="on"':'')+'>'+t[1]+'</button>').join('')+'</div>';}
function cmTime(t){if(!t)return '';const h=+t.slice(0,2),m=t.slice(3,5);return (h<12?'오전 ':'오후 ')+(h%12||12)+'시'+(m!=='00'?' '+m+'분':'');}
async function cmDraw(msg,err){const d=cmEl();if(!CM.gk)return;
 let r;try{r=await rpc('gz_class_weeks',{p_group_key:CM.gk});}catch(e){d.innerHTML=cmHead(null)+'<div class="gmsg err">불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</div>';return;}
 if(!r||!r.ok){d.innerHTML=cmHead(null)+'<div class="gmsg err">'+gedEsc(r&&r.error||'불러오지 못했어요')+'</div>';return;}
 CM.data=r;const g=r.group,ed=!!r.can_edit;let body='';
 if(CM.tab==='roster'){body='<div class="ged" id="cmRoster" style="display:block;border:none"></div>';}
 else if(CM.tab==='time'){body='<div class="cmBox"><p>지금 시간: <b>'+CM_D[g.dow]+'요일 '+cmTime(g.start)+'</b></p>'
   +(ed?'<p>바꿀 시간: <select id="cmDow">'+[1,2,3,4,5,6,7].map(i=>'<option value="'+i+'"'+(i===g.dow?' selected':'')+'>'+CM_D[i]+'요일</option>').join('')+'</select> <input type="time" id="cmSt" value="'+g.start+'" step="600"></p>'
   +'<label class="mini"><input type="checkbox" id="cmNoti" checked> 학부모 알림 문장을 대기열에 넣기 (보내기는 따로)</label>'
   +'<p class="mini">반 학생 '+g.members+'명의 시간표, 반 이름(요일·시각 부분), 이 반 도서 배정이 함께 바뀌어요.</p>'
   +(CM.tconf?'<button class="warn" data-cmtimeok="1">이대로 바꾸기</button> <button data-cmtimeno="1">그만두기</button>':'<button data-cmtime="1">반 시간 바꾸기</button>'):'<p class="mini">이 반 담당 선생님과 원장만 바꿀 수 있어요.</p>')+'</div>';}
 else if(CM.tab==='weeks'){const BK=r.books||[];
   body='<table class="cmT"><tr><th style="width:86px">수업 날짜</th><th>읽을 책</th><th style="width:150px">과제 카드</th><th>그날 계획 한 줄</th></tr>'
   +(r.weeks||[]).map(w=>{const dt=w.date,dd=new Date(dt+'T00:00:00'),lbl=(dd.getMonth()+1)+'/'+dd.getDate()+' '+CM_D[((dd.getDay()+6)%7)+1];
     const past=dt<localDate();const opts='<option value="">'+(w.book_id?'(책 비우기)':'책 고르기')+'</option>'+BK.map(b=>'<option value="'+b.id+'"'+(b.id===w.book_id?' selected':'')+(b.used&&b.id!==w.book_id?' disabled':'')+'>'+gedEsc(b.month+'월 '+b.week+'주 · '+b.title)+(b.used&&b.id!==w.book_id?' (이미 '+b.used.slice(5).replace('-','/')+')':'')+'</option>').join('');
     const c=w.card,st=!w.book_id?'':!c?'<span class="no">없음</span>':({draft:'<span class="mid">쓰는 중</span>',submitted:'<span class="mid">승인 기다림</span>',approved:'<span class="ok">승인됨</span>',rejected:'<span class="no">다시 쓰기</span>'}[c.status]||gedEsc(c.status));
     const cb=!w.book_id?'—':st+' <button data-cmcard="'+w.book_id+'">'+(!c?'쓰기':(c.status==='approved'||c.status==='submitted')?'보기':'고치기')+'</button>';
     let row='<tr'+(past?' class="past"':'')+'><td>'+lbl+(w.month?'<br><small>'+w.month+'월 '+w.week+'주</small>':'')+'</td><td>'+(ed?'<select data-cmbook="'+dt+'">'+opts+'</select>':gedEsc(w.title||'—'))+'</td><td>'+cb+'</td><td>'
       +(w.book_id?(ed?'<input data-cmnote="'+dt+'" value="'+gedEsc(w.note||'')+'" placeholder="한 줄 쓰기 (칸을 벗어나면 저장)">':gedEsc(w.note||'')):'<span class="mini">책을 먼저 골라 주세요</span>')+'</td></tr>';
     if(w.book_id&&CM.open[w.book_id]){const lock=c&&(c.status==='approved'||c.status==='submitted');
       row+='<tr class="cmCard"><td></td><td colspan="3">'+(c&&c.status==='rejected'&&c.memo?'<p class="no">원장 메모: '+gedEsc(c.memo)+'</p>':'')
       +'<label>과제 문항 <small>학생이 받는 문장 그대로 · 10자 이상</small></label><textarea id="cmTask'+w.book_id+'"'+(lock?' disabled':'')+'>'+gedEsc(c&&c.task||'')+'</textarea>'
       +'<label>수업 의도 <small>5자 이상</small></label><textarea id="cmInt'+w.book_id+'" style="min-height:44px"'+(lock?' disabled':'')+'>'+gedEsc(c&&c.intent||'')+'</textarea>'
       +(lock?'<p class="mini">'+(c.status==='approved'?'승인된 카드예요.':'원장 승인을 기다리는 중이에요.')+' 배경·조건 같은 칸은 「내 반 원천 › 과제 카드」에서 볼 수 있어요.</p>'
         :'<div style="margin-top:6px"><button data-cmcsave="'+w.book_id+'">저장</button> <button class="warn" data-cmcsub="'+w.book_id+'">원장께 승인 요청</button> <span class="mini">배경·조건·채점 메모는 「내 반 원천 › 과제 카드」에서 더 쓸 수 있어요.</span></div>')+'</td></tr>';}
     return row;}).join('')+'</table>'+(BK.length?'':'<p class="mini">이 학년('+gedEsc(r.book_grade)+') 책 목록이 아직 없어요.</p>');}
 else if(CM.tab==='print'){const W=(r.weeks||[]).filter(w=>w.book_id&&w.date>=localDate());
   body='<div class="cmBox"><p>주차표에 들어 있는 앞으로의 수업 '+W.length+'번을 학부모용 한 장으로 뽑아요. 따로 쓰지 않아요.</p><button data-cmprint="1"'+(W.length?'':' disabled')+'>학습계획서 인쇄</button></div>';}
 d.innerHTML=cmHead(g)+body+(msg?'<div class="gmsg'+(err?' err':'')+'" style="margin-top:8px">'+gedEsc(msg)+'</div>':'');
 if(CM.tab==='roster') cmRosterLoad();}
async function cmSaveWeek(p,okmsg){let r;try{r=await rpc('gz_class_week_set',{p:Object.assign({group_key:CM.gk},p)});}catch(e){return cmDraw('저장하지 못했어요. 다시 해 주세요.',1);}
 if(!r||!r.ok)return cmDraw((r&&r.error)||'저장하지 못했어요',1);cmDraw(okmsg);}
async function cmClick(e){const t=e.target;if(!t||!t.dataset)return;const D=t.dataset;
 if(D.cmx)return cmClose();
 if(D.cmclose)return cmCloseAsk();
 if(D.cmcloseok)return cmCloseDo();
 if(D.cmcloseno){CM.closeAsk=false;return cmDraw();}
 if(D.cmtab){CM.tab=D.cmtab;CM.tconf=false;return cmDraw();}
 if(D.cmcard){CM.open[D.cmcard]=!CM.open[D.cmcard];return cmDraw();}
 if(D.cmcsave||D.cmcsub){const id=+(D.cmcsave||D.cmcsub),sub=!!D.cmcsub;const task=(document.getElementById('cmTask'+id)||{}).value||'',intent=(document.getElementById('cmInt'+id)||{}).value||'';
   let r;try{r=await rpc('gz_es_card_save',{p:{week_book_id:id,task:task,intent:intent,submit:sub}});}catch(er){return cmDraw('저장하지 못했어요. 다시 해 주세요.',1);}
   if(!r||!r.ok)return cmDraw((r&&r.error)||'저장하지 못했어요',1);if(sub)CM.open[id]=false;return cmDraw(sub?'원장께 승인 요청을 보냈어요':'과제 카드를 저장했어요');}
 if(D.cmtime){CM.tconf=true;const dw=document.getElementById('cmDow').value,stv=document.getElementById('cmSt').value,nt=document.getElementById('cmNoti').checked;CM.tv={dow:+dw,time:stv,notify:nt};
   if(+dw===CM.data.group.dow&&stv===CM.data.group.start){CM.tconf=false;return cmDraw('지금과 같은 시간이에요. 다른 요일이나 시각을 골라 주세요.',1);}
   return cmDraw('바꿀 시간: '+CM_D[+dw]+'요일 '+cmTime(stv)+' — 맞으면 「이대로 바꾸기」를 눌러 주세요.');}
 if(D.cmtimeno){CM.tconf=false;return cmDraw();}
 if(D.cmtimeok){let r;try{r=await rpc('gz_class_time_set',{p:Object.assign({group_key:CM.gk},CM.tv)});}catch(er){CM.tconf=false;return cmDraw('바꾸지 못했어요. 다시 해 주세요.',1);}
   CM.tconf=false;if(!r||!r.ok)return cmDraw((r&&r.error)||'바꾸지 못했어요',1);CM.gk=r.new_key;try{TT=null;await render();}catch(_){}
   return cmDraw('반 시간을 바꿨어요. 새 반 이름: '+r.new_key+(r.notify_queued?' · 학부모 알림 '+r.notify_queued+'건 대기열':''));}
 if(D.cmprint)return cmPrint();}
async function cmChange(e){const t=e.target;if(!t||!t.dataset)return;
 if(t.dataset.cmbook){const v=t.value;t.disabled=true;const had=(CM.data.weeks||[]).some(w=>w.date===t.dataset.cmbook&&w.book_id);return cmSaveWeek({date:t.dataset.cmbook,week_book_id:v},!v?'책을 비웠어요':had?'책을 바꿨어요':'책을 넣었어요');}
 if(t.dataset.cmnote!==undefined&&t.dataset.cmnote){return cmSaveWeek({date:t.dataset.cmnote,note:t.value},'계획 한 줄을 저장했어요');}}
function cmPrint(){const r=CM.data,g=r.group,W=(r.weeks||[]).filter(w=>w.book_id&&w.date>=localDate());
 const rows=W.map(w=>{const dd=new Date(w.date+'T00:00:00');return '<tr><td>'+(dd.getMonth()+1)+'월 '+dd.getDate()+'일 ('+CM_D[((dd.getDay()+6)%7)+1]+')</td><td>'+gedEsc(w.title||'')+(w.author?'<br><small>'+gedEsc(w.author)+'</small>':'')+'</td><td>'+gedEsc(w.note||'')+'</td></tr>';}).join('');
 const h='<!doctype html><html><head><meta charset="utf-8"><title>학습계획서 '+gedEsc(g.key)+'</title><style>body{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;margin:28px;color:#1f2a24}h1{font-size:22px;margin:0 0 4px}p{margin:2px 0 14px;color:#556}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid #bbb;padding:9px;text-align:left;vertical-align:top}th{background:#eef2ee}small{color:#667}.f{margin-top:18px;font-size:12px;color:#667}@media print{button{display:none}}</style></head><body>'
  +'<button onclick="print()" style="float:right;padding:6px 14px">인쇄</button><h1>국존 국어전문학원 · 학습계획서</h1><p>'+gedEsc(g.grade)+' 반 · '+CM_D[g.dow]+'요일 '+cmTime(g.start)+' · 담당 '+gedEsc(g.teacher||'')+' 선생님</p>'
  +'<table><tr><th style="width:130px">수업 날짜</th><th>읽을 책</th><th>수업 계획</th></tr>'+rows+'</table><p class="f">책과 계획은 반 사정에 따라 바뀔 수 있어요.</p></body></html>';
 const w=window.open('','_blank');if(!w)return cmDraw('새 창이 막혔어요. 브라우저의 팝업 허용을 켜 주세요.',1);w.document.open();w.document.write(h);w.document.close();}

function gedEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function gedBox(gk){const p=document.getElementById('cmRoster');if(p&&CM.gk===gk)return p;return document.getElementById('ged_'+gk);}
async function gedToggle(gk){const b=gedBox(gk);if(!b)return;if(b.style.display!=='none'){b.style.display='none';GED_OPEN=null;return;}GED_OPEN=gk;b.style.display='block';await gedLoad(gk);}
async function gedLoad(gk,msg,err){const b=gedBox(gk);if(!b)return;b.innerHTML='<div class="gmsg">명단 불러오는 중…</div>';
  let r;try{r=await rpc('gz_class_roster',{p_group_key:gk});}catch(e){b.innerHTML='<div class="gmsg err">명단을 불러오지 못했어요. 「다시 불러오기」를 눌러 주세요.</div>';return;}
  if(!r||!r.ok){b.innerHTML='<div class="gmsg err">'+gedEsc(r&&r.error||'반 명단을 불러오지 못했어요. 「다시 불러오기」를 눌러 주세요.')+'</div>';return;}
  const ed=!!r.can_edit;
  const M=GED_DEL;const others=(TT&&TT.groups||[]).filter(g=>g.k!==gk).sort((a,b)=>((a.t===r.group.teacher?0:1)-(b.t===r.group.teacher?0:1))||String(a.k).localeCompare(String(b.k)));
  b.innerHTML=(ed?'<div style="font-size:11.5px;font-weight:700;margin-bottom:2px">추가</div><input type="search" placeholder="추가할 학생 이름 두 글자" data-gq="1"><div class="gres"></div><div style="font-size:11.5px;font-weight:700;margin:6px 0 2px">이 반 학생 — 이동 · 퇴원</div>':'')
   +(r.members||[]).map(m=>{const k=gk+'|'+m.sid,md=M[k];let row='<div class="gm"><span>'+gedEsc(m.name)+' <small style="color:#889">'+gedEsc((m.school||'')+' '+(m.grade||''))+'</small></span>'+(ed?'<span><button data-gmv="'+m.sid+'">이동</button> <button data-gwd="'+m.sid+'">퇴원</button></span>':'')+'</div>';
     if(ed&&md==='mv')row+='<div class="gm" style="gap:4px"><select data-gto="'+m.sid+'" style="flex:1;font-size:11.5px"><option value="">옮길 반 고르기</option>'+others.map(g=>'<option value="'+gedEsc(g.k)+'">'+gedEsc(g.k)+' ('+(g.roster||[]).length+'명)</option>').join('')+'</select><button class="warn" data-gmvok="'+m.sid+'">옮기기</button></div>';
     if(ed&&md==='wd')row+='<div class="gm" style="gap:4px"><input data-gwr="'+m.sid+'" placeholder="퇴원 사유(필수)" style="flex:1;margin:0"><button class="warn" data-gwdok="'+m.sid+'">퇴원 확정</button></div>';
     return row;}).join('')
   +(ed?'':'<div class="gmsg">이 반 담당 선생님과 원장만 고칠 수 있습니다(지금은 보기만 됩니다)</div>')
   +(msg?'<div class="gmsg'+(err?' err':'')+'">'+gedEsc(msg)+'</div>':'');
  b.dataset.ids=JSON.stringify((r.members||[]).map(m=>m.sid));
  const q=b.querySelector('input[data-gq]');if(q){let tm;q.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>gedSearch(gk,q.value.trim()),250);});}
  b.onclick=async ev=>{ev.stopPropagation();const t=ev.target;
    if(t.dataset.gmv){const k=gk+'|'+t.dataset.gmv;GED_DEL[k]=GED_DEL[k]==='mv'?null:'mv';gedLoad(gk);return;}
    if(t.dataset.gwd){const k=gk+'|'+t.dataset.gwd;GED_DEL[k]=GED_DEL[k]==='wd'?null:'wd';gedLoad(gk);return;}
    if(t.dataset.gmvok){const sel=b.querySelector('select[data-gto="'+t.dataset.gmvok+'"]');if(!sel||!sel.value)return gedNote(b,'옮길 반을 골라 주세요.');delete GED_DEL[gk+'|'+t.dataset.gmvok];await gedSet(gk,+t.dataset.gmvok,'move',{to_group_key:sel.value});return;}
    if(t.dataset.gwdok){const inp=b.querySelector('input[data-gwr="'+t.dataset.gwdok+'"]');const rs=(inp&&inp.value||'').trim();if(rs.length<2)return gedNote(b,'퇴원 사유를 두 글자 이상 써 주세요.');delete GED_DEL[gk+'|'+t.dataset.gwdok];await gedSet(gk,+t.dataset.gwdok,'withdraw',{reason:rs});return;}
    if(t.dataset.gadd){await gedSet(gk,+t.dataset.gadd,'add');return;}};}
async function gedSearch(gk,v){const b=gedBox(gk);if(!b)return;const box=b.querySelector('.gres');if(!box)return;if(v.length<2){box.innerHTML='';return;}
  let x;try{x=await rpc('gz_es_students',{p_q:v});}catch(e){box.innerHTML='<div class="gmsg err">학생을 찾지 못했어요. 이름을 다시 입력해 주세요.</div>';return;}
  const ids=new Set(JSON.parse(b.dataset.ids||'[]'));
  box.innerHTML=((x&&x.rows)||[]).slice(0,6).map(st=>'<div class="gm"><span>'+gedEsc(st.name)+' <small style="color:#889">'+gedEsc((st.school||'')+' '+(st.grade||''))+'</small></span>'+(ids.has(st.id)?'<small>이 반 학생</small>':'<button data-gadd="'+st.id+'">반에 넣기</button>')+'</div>').join('')||'<div class="gmsg">찾는 학생이 없어요</div>';}
function gedNote(b,t){let n=b.querySelector('.gmsg.tmp');if(!n){n=document.createElement('div');n.className='gmsg err tmp';b.appendChild(n);}n.textContent=t;}
async function gedSet(gk,sid,act,ex){let r;try{r=await rpc('gz_class_member_set',{p:Object.assign({group_key:gk,student_id:sid,action:act},ex||{})});}catch(e){return gedLoad(gk,'저장하지 못했어요. 다시 눌러 주세요.',1);}
  if(!r||!r.ok)return gedLoad(gk,(r&&r.error)||'저장하지 못했어요. 다시 눌러 주세요.',1);
  const msg=r.student+(act==='add'?' 학생을 추가했어요':act==='move'?' 학생을 '+r.to+' 반으로 옮겼어요':act==='withdraw'?' 학생을 퇴원 처리했어요':' 학생을 뺐어요');
  try{TT=null;await render();}catch(_){}
  const b=gedBox(gk);if(b){b.style.display='block';GED_OPEN=gk;await gedLoad(gk,msg);}}

<script id="gzQBjs">
(function(){

    var h='<div class="it '+(waiting?(later?'later':'wait'):'done')+'" id="gzQBi'+r.id+'">'
      +'<div class="top"><span class="nm">'+esc(r.name)+'</span><span class="tg'+(r.place==='집'?' home':'')+'">'+(r.place==='집'?'집에서':'수업 중'+(r.period?' · '+r.period+'교시':''))+'</span>'

      +(f.mode==='수업 때'?'<div class="where" style="margin-top:6px">다음 수업에서 먼저 물어볼 질문으로 남겨요. 그때 답하고 질문 성격을 고르면 끝나요.</div>'

         +'<div class="lab">다음에 할 것</div>'+chips(r.id,TODO,f.todos,'todos',true,'c2')

<script>
/* [2026-11-01 채팅 67] 반 화면.
   시간표에서 정규 시간(과제관리 제외) 학생을 누르면: 같은 요일·같은 시작 시각·같은 선생님 학생이 2명 이상이면 반으로 묶어 연다.
   왼쪽 = 그 시간 명단(출결·오늘 기록), 오른쪽 = 그 학생 코칭 카드(수업 중 흐름). 명단 이름을 누르면 오른쪽만 바뀐다.
   정규 시간이 아닌 학생(과제관리·보충·변동·직전대비)과 혼자인 시간은 지금처럼 옆 카드로 연다. 「시간표로」·「카드로(시간표 옆)」는 반 화면을 닫는다. */
(function(){
  var CLS=null, KEEP=false;
  var DN=['','월요일','화요일','수요일','목요일','금요일','토요일','일요일'];
  function E(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function hm(st){var h=+String(st).slice(0,2),m=String(st).slice(3,5);return (h<12?'오전 ':'오후 ')+((h%12)||12)+'시'+(m!=='00'?' '+(+m)+'분':'');}
  function reg(x){return x&&x.ty!=='학습관리';}
  function rosterOf(sid,d,st){var date=weekDates(WEEK_OFF)[d-1];var me=(TT.solo||[]).find(function(x){return x.sid===sid&&x.d===d&&String(x.st).slice(0,5)===st;});
    if(!me||!reg(me))return null;
    var L=(TT.solo||[]).filter(function(x){return x.d===d&&String(x.st).slice(0,5)===st&&reg(x)&&tnorm(x.t)===tnorm(me.t)&&ttOn(x,date);});
    var seen={};L=L.filter(function(x){if(seen[x.sid])return false;seen[x.sid]=1;return true;}).sort(function(a,b){return String(a.n).localeCompare(String(b.n),'ko');});
    return L.length>=2?{d:d,st:st,t:tnorm(me.t),date:date,L:L}:null;}
  function stOf(x){var a=attGet(x.sid,CLS.date,x.st);var rec=false;try{var r=TT.rec&&TT.rec[String(x.sid)];rec=!!(r&&Array.isArray(r.days)&&r.days.indexOf(CLS.date)>=0);}catch(_){}
    if(a==='결')return '<span class="st no">결석</span>';
    if(rec)return '<span class="st ok">기록 ✓</span>';
    if(a==='출')return '<span class="st ok">출석</span>';
    /* [채팅 121 · seq 396 2단계] 오늘 수업 시작 10분이 지나도 기록이 없으면 노란 줄 「미확인 n분」 — 교사는 이 학생만 누르면 된다 */
    if(CLS.date===localDate()){var nw=new Date(),mm=nw.getHours()*60+nw.getMinutes(),sm=(+String(x.st).slice(0,2))*60+(+String(x.st).slice(3,5)),lag=mm-sm;
      if(lag>=10)return '<span class="st wait" style="background:#FFF3C4;color:#7A5B00;border-color:#E9C46A;font-weight:700">미확인 '+lag+'분</span>';}
    return CLS.date<=localDate()?'<span class="st wait">출결 전</span>':'';}
  function drawList(){var el=document.getElementById('gzClsList');if(!el||!CLS)return;var cur=(typeof COACH_SID!=='undefined')?COACH_SID:null;
    el.innerHTML='<div class="hint">학생 이름을 누르면 오른쪽 카드가 바뀌어요</div>'+CLS.L.map(function(x){return '<button type="button" data-csid="'+x.sid+'" class="'+(x.sid===cur?'on':'')+'"><span><span class="nm">'+E(x.n)+'</span><br><span class="sub">'+E((x.sch||'')+' '+(x.gr||''))+'</span></span>'+stOf(x)+'</button>';}).join('');}
  setInterval(function(){try{if(CLS&&document.visibilityState==='visible')drawList();}catch(_){}},60000); /* [seq 396] 미확인 분 갱신 */

    var main=document.getElementById('gzClsMain');if(sb.parentNode!==main)main.appendChild(sb);
    head.innerHTML='<b>'+DN[CLS.d]+' '+hm(CLS.st)+' 반</b><span>'+E(CLS.t)+' 선생님 · 학생 '+CLS.L.length+'명 · '+CLS.date.slice(5).replace('-','/')+'</span><button type="button" class="x" data-clsx="1">반 화면 닫기 — 이 학생 카드만</button>';

  /* 시간표 이름 누름 — 원래 openCoach가 돌기 전에 반을 찾는다 */
  document.addEventListener('click',function(e){var t=e.target;if(!t||!t.closest)return;
    var b=t.closest('.card.stu b[onclick^="openCoach"]');if(b){try{var card=b.closest('.card.stu'),col=card.closest('.col');var cols=[].slice.call(col.parentNode.querySelectorAll(':scope>.col'));var d=cols.indexOf(col)+1;var st=(card.querySelector('.t')||{}).textContent||'';CLS=rosterOf(+card.dataset.sid,d,st.trim());KEEP=!!CLS;}catch(_){CLS=null;KEEP=false;}return;}
    var c=t.closest('#gzClsList [data-csid]');if(c&&CLS){var x=CLS.L.find(function(y){return y.sid===+c.dataset.csid;});if(!x)return;
      if(typeof DIRTY!=='undefined'&&DIRTY&&!confirm('저장하지 않은 입력이 있어요. 다른 학생으로 바꾸면 이 입력은 초안으로만 남아요. 바꿀까요?'))return;
      KEEP=true;openCoach(x.sid,x.n,x.ty||'정규',x.rid||0);return;}
    if(t.closest('[data-clsx]')){unmount();var fb=document.getElementById('fullbtn');document.body.classList.remove('full');if(fb)fb.textContent='⛶ 전체 화면';return;}
  },true);
  /* [11-03 채팅 72] 전체 시간표에서 이름을 누르면 같은 시간 학생 명단과 함께 연다 */
  window.gzClsOpen=function(sid,d,st,name,ty,rid){try{CLS=rosterOf(+sid,d,String(st).slice(0,5));}catch(_){CLS=null;}KEEP=!!CLS;openCoach(+sid,name,ty||'정규',rid||0);};
  var _open=window.openCoach;
  window.openCoach=function(sid,name,ty,rid){var keep=KEEP||!!(CLS&&CLS.L.some(function(y){return y.sid===+sid;}));KEEP=false;if(!keep&&CLS)unmount();var r=_open.apply(this,arguments);if(keep&&CLS)setTimeout(mount,0);return r;};
  var _close=window.closeSlide;window.closeSlide=function(){unmount();return _close.apply(this,arguments);};
  var _full=window.toggleFull;window.toggleFull=function(){if(document.body.classList.contains('gzcls')){unmount();document.body.classList.remove('full');var fb=document.getElementById('fullbtn');if(fb)fb.textContent='⛶ 전체 화면';return;}return _full.apply(this,arguments);};

})();

<script>

<script>

      if(nb.parentNode!==wv){nb.classList.remove('inside');wv.appendChild(nb);}
      var g=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gz-s-1'))||0;nb.style.left=(tbl.offsetLeft+best.l+g)+'px';nb.style.top=(tbl.offsetTop+best.t+g)+'px';nb.style.width=(best.w-2*g)+'px';nb.style.height=(best.h-2*g)+'px';
      /* [18:11 국존 「지금 6시 10분. 이 시간 학생이 나와야 함」] 시간표를 내려도 지금 수업 내용이 칸 안에서 따라 내려오게 — 내용은 시간표 머리 바로 아래에 붙는다 */
      var th=wv.querySelector('thead');var hh=th?th.offsetHeight:0;nb.style.setProperty('--gz-now-top',(hh+g)+'px');nb.style.setProperty('--gz-now-max',Math.max(200,wv.clientHeight-hh-4*g)+'px');}
    else if(side){if(nb.parentNode!==side||side.firstChild!==nb){nb.classList.add('inside');nb.removeAttribute('style');side.insertBefore(nb,side.firstChild);}}}
  function onClick(ev){var t=ev.target;if(t.closest('button,[data-gzo]'))ev.stopPropagation();
    var r=t.closest('[data-gzrf]');if(r){load(true);return;}var f=t.closest('[data-gzfi]');if(f){IN.f=f.dataset.gzfi;drawIn();return;}
    var a=t.closest('[data-gza]');if(a){if(a.classList.contains('ok'))return;var sid=+a.dataset.gza;a.disabled=true;a.textContent='저장 중…';Promise.resolve(cardAtt(sid,'출')).then(function(){setTimeout(function(){load(true);},1500);drawIn();drawNow();});return;}
    var s=t.closest('[data-gzs]');if(s){var sid2=+s.dataset.gzs,nm=s.dataset.gzn;
      /* 코칭 카드의 「일정 조정…」과 같은 창(카드를 열지 않고 처리) */
      if(window.gzQaMore){gzQaMore(sid2,(typeof ATT!=='undefined'&&ATT[sid2]==='결')?'abs':'shift');return;}
      var t0=Date.now();try{openCoach(sid2,nm);}catch(_){}
      (function w(){var bx=document.getElementById('cattbox');if(bx&&typeof COACH_SID!=='undefined'&&+COACH_SID===sid2){try{cardTimeShift(sid2);}catch(_){}return;}if(Date.now()-t0<8000)setTimeout(w,200);})();return;}
    var o=t.closest('[data-gzo]');if(o){try{openCoach(+o.dataset.gzo,o.dataset.gzn);}catch(_){}}}

  /* 시간표 학생 줄 꾸미기 — 오늘 칸: 카드(등원 시각·출석·일정 조정·오늘 목표·학부모 문자), 다른 날: 줄 오른쪽 「일정」 */
  /* [05:54 국존 「교사에게 좋을 정보 — 데스크 요청·특이사항, 현재 교재 진도, 과제율 등」] 선생님 1명 보기 카드 정보 */
  var INFO={m:null,t:0,busy:false,key:''};
  function loadInfo(){var k=tf();if(!k||INFO.busy)return;if(INFO.m&&INFO.key===k&&Date.now()-INFO.t<120000)return;INFO.busy=true;
    rpc('gz2_week_card_info',{p_teacher:k}).then(function(r){INFO.m=r||{};INFO.key=k;}).catch(function(){INFO.m=INFO.m||{};}).then(function(){INFO.busy=false;INFO.t=Date.now();});}
  function infoHtml(sid){var o=INFO.m&&INFO.m[sid];if(!o)return '';var h='';
    if(o.memo)h+='<div class="if alert"><em>전달·특이</em>'+E(o.memo.b)+(o.memo.n>1?' <small>외 '+(o.memo.n-1)+'건</small>':'')+' <small>'+E(o.memo.d||'')+'</small></div>';
    else if(o.tmemo)h+='<div class="if"><em>지난 메모</em>'+E(o.tmemo.b)+' <small>'+E(o.tmemo.d||'')+'</small></div>';
    if(o.now)h+='<div class="if"><em>현재 강좌</em>'+E(o.now)+'</div>';
    if(o.prog)h+='<div class="if"><em>진도 기록</em>'+E(o.prog.b)+' <small>'+E(o.prog.d||'')+'</small></div>';
    h+='<div class="if"><em>과제</em>'+(o.hw?('<b class="'+(o.hw.r<60?'lo':o.hw.r<85?'mid':'hi')+'">'+o.hw.r+'%</b> <small>4주 '+o.hw.n+'회'+(o.hw.last?' · 지난번 '+E(o.hw.last):'')+'</small>'):'<small>4주 과제 기록 없음</small>')+(o.task?'<br><small>낸 과제: '+E(o.task)+'</small>':'')+'</div>';
    var tag=[];if(o.exam&&o.exam.dd!=null)tag.push('<span class="tg ex">'+E(o.exam.n||'시험')+' D-'+o.exam.dd+'</span>');if(o.abs4>0)tag.push('<span class="tg ab">4주 결석 '+o.abs4+'</span>');
    if(tag.length)h+='<div class="if">'+tag.join(' ')+'</div>';
    return '<div class="ifs">'+h+'</div>';}
  function todayWd(){var th=[].slice.call(document.querySelectorAll('#ttgPanel table.wkg thead th')).some(function(t){return /오늘/.test(t.textContent);});return th?((new Date().getDay()+6)%7)+1:0;}
  function rowCard(b,S,twd){var sid=+b.dataset.wsid,wd=+b.dataset.wd,nm=b.dataset.wn||'',st=b.dataset.wst||'';
    var w=document.createElement('div');b.parentNode.insertBefore(w,b);w.appendChild(b);w.dataset.gzk=sid+'|'+wd;
    var x=document.createElement('div');x.className='gzwx';
    if(wd===twd){var c=S[sid],a=att(sid,st)||(c?'출':'');w.className='gzwc'+(c&&c.mk==='지각'?' late':'');
      x.innerHTML=(a==='출'?'<span class="tm">'+E((c&&c.arr)||'')+' 등원</span>':a==='결'?'<span class="tm wait">결석</span>':'<span class="tm wait">아직 안 옴</span>')
        +btns(sid,nm,a)+(a==='출'?goal(c)+msgBox(c):'');}
    else{/* 다른 날: 그날 출결 표시 + 일정 조정(출석은 오늘만) */var a2='';try{var wdt=wkDate(wd);if(wdt)a2=attGet(sid,wdt,st)||'';}catch(_){}
      w.className='gzwc other';x.innerHTML=(a2==='출'?'<span class="tm">출석</span>':a2==='결'?'<span class="tm wait">결석</span>':'')+'<div class="ab"><button type="button" data-gzs="'+sid+'" data-gzn="'+E(nm)+'">일정 조정</button></div>';}
    var sb=x.querySelector('.ab [data-gzs]');if(sb)sb.textContent='일정 조정';w.appendChild(x);var ih=infoHtml(sid);if(ih){var y=document.createElement('div');y.innerHTML=ih;w.appendChild(y.firstChild);}}
  function wkDate(wd){var ths=[].slice.call(document.querySelectorAll('#ttgPanel table.wkg thead tr:first-child th'));var t=ths[wd];if(!t)return '';var m=t.textContent.match(/(\d{1,2})\/(\d{1,2})/);if(!m)return '';
    var y=new Date().getFullYear();return y+'-'+String(m[1]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0');}
  function undecorate(tb){[].slice.call(tb.querySelectorAll('.gzwc,.gzwr')).forEach(function(w){var b=w.querySelector('button.wnm');if(b){b.classList.remove('gzdone');w.parentNode.insertBefore(b,w);}w.remove();});tb.dataset.gzd='';}
  function decorate(){var tb=document.querySelector('#ttgPanel table.wkg');if(!tb)return;var wv=tb.closest('.wkv');
    /* [05:50 국존] 모든 선생님 보기 = 원래 간략한 명단, 선생님 1명 보기 = 카드 */
    var one=!!tf();if(wv)wv.classList.toggle('gz1t',one);
    if(!one){if(tb.querySelector('.gzwc,.gzwr'))undecorate(tb);return;}
    var L=tb.querySelectorAll('button.wnm[data-wsid]');if(!L.length)return;
    loadInfo();var twd=todayWd(),S=byS(),sig=IN.t+'|'+INFO.t+'|'+twd+'|'+tf();
    if(tb.dataset.gzd===sig&&!tb.querySelector('button.wnm[data-wsid]:not(.gzdone)'))return;
    [].slice.call(L).forEach(function(b){var pr=b.parentNode;if(pr&&(pr.classList.contains('gzwc')||pr.classList.contains('gzwr'))){pr.parentNode.insertBefore(b,pr);pr.remove();}b.classList.add('gzdone');rowCard(b,S,twd);});
    tb.dataset.gzd=sig;}
  if(!window.__gzwBound){window.__gzwBound=1;document.addEventListener('click',function(ev){var t=ev.target;if(!t.closest||!t.closest('#ttgPanel .gzwc, #ttgPanel .gzwr'))return;if(!t.closest('[data-gza],[data-gzs]'))return;ev.stopPropagation();ev.preventDefault();onClick(ev);},true);}
  var lastNow='';
  function tidy(){if(!on())return;var host=document.getElementById('ttgHost');if(!host)return;
    var top=document.getElementById('gzTop');
    if(top){var r1=top.querySelector('.r1'),seg=top.querySelector('.seg'),nav=top.querySelector('.nav'),tools=top.querySelector('.tools');
      if(r1&&seg&&seg.parentNode!==r1){r1.insertBefore(seg,nav?nav.nextSibling:r1.firstChild);}
      if(r1&&tools&&seg&&seg.nextSibling!==tools&&tools.parentNode===r1){r1.insertBefore(tools,seg.nextSibling);}}
    /* [05:50 국존 「오른쪽 창 없앰 · 가운데(지금 수업) 중복 없앰 · 원래 시간표 명단 자리에 · 전체 시간표 칸을 넓혀」] 옆 칸·지금 수업 칸 걷어냄, 오늘 할 일은 원래대로 시간표 아래 */
    var sp=document.getElementById('gzSplit');if(sp){sp.parentNode.insertBefore(host,sp);var td0=document.getElementById('gzTodo');if(td0)sp.parentNode.insertBefore(td0,host.nextSibling);sp.remove();}
    var nw=document.getElementById('gzNow');if(nw)nw.remove();
    var wk=!!document.querySelector('#ttgPanel .wkv')&&!(window.TTG&&(TTG.att||TTG.tab==='pay'));
    if(!wk)return;
    try{decorate();}catch(_){}
    if(tf())load(false);}
  setInterval(function(){try{tidy();}catch(e){}},400);
})();
</script>

<script>
/* [2026-11-17 MAP 채팅 173 · 국존 01:24 「다음 진행」] MAP의 단추가 sessionStorage gz_open_view에 자리 이름을 남기고 이 화면을 연다 → 그 자리를 연다(한 번 쓰고 지움).
   tab:X = 위 탭 · rail = 교사별 일정 · roster = 학생 명단 · board = 과제 전체판 · new = 신규 학생 등록 · na = 아직 안 온 학생 · menu = 반·학생 관리 · week:N = N주 옮김 */
(function(){var n=0;function click(sel){var e=document.querySelector(sel);if(e){e.click();return true;}return false;}
function go1(){var v=null;try{v=sessionStorage.getItem('gz_open_view');}catch(_){return;}if(!v)return;
  var ok=false;try{
    if(v.indexOf('tab:')===0){if(typeof go==='function'&&typeof TT!=='undefined'&&TT){go(v.slice(4));ok=true;}}
    else if(v==='rail'){if(typeof setView==='function'&&typeof TT!=='undefined'&&TT){setView('rail');ok=true;}}
    else if(v.indexOf('week:')===0){if(typeof moveWeek==='function'&&typeof TT!=='undefined'&&TT){moveWeek(+v.slice(5)||0);ok=true;}}
    else if(v==='roster'){if(typeof window.gzOpenRoster==='function'&&document.getElementById('gzRosterBtn')){window.gzOpenRoster();ok=true;}}
    else if(v==='board'){ok=click('#gzBoardBtn');}
    else if(v==='new'){if(typeof openNewStudent==='function'&&typeof TT!=='undefined'&&TT){openNewStudent();ok=true;}}
    else if(v==='na'){ok=click('#naBtn');}
    else if(v==='menu'){ok=click('.menu .mb');}
    else ok=true;
  }catch(_){ok=false;}
  if(!ok){if(++n<80)setTimeout(go1,250);else{try{sessionStorage.removeItem('gz_open_view');}catch(_){}}return;}
  try{sessionStorage.removeItem('gz_open_view');}catch(_){}}
if(document.readyState==='complete')setTimeout(go1,600);else window.addEventListener('load',function(){setTimeout(go1,600);});})();
</script>
