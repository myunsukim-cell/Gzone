document.addEventListener('click',e=>{const s=document.getElementById('slide');if(!s||!s.classList.contains('open'))return;if(s.contains(e.target))return;if(e.target.closest('[onclick*="openCoach"],[onclick*="openEnroll"],[onclick*="openMakeup"],[onclick*="openTray"],#tabs'))return;closeSlide();},true);
/* G-MAP 2.0 — 클린 규약: publishable 키만 · 전용 RPC+REST 읽기만 · 지층 금지 · 저장은 쓰고→되읽기 검증 */
const SB='https://qcnsadcpsonuxnjyrlez.supabase.co';
function localDate(base,addDays){ /* UTC 밀림 방지 — 현행 노트 처방 계승 */
  const x=base?new Date(base+'T12:00:00'):new Date();
  if(addDays)x.setDate(x.getDate()+addDays);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}
const PK='sb_publishable_stx8spRryf_4OWMFsW29Rw_XiDNfyb0';
const H={apikey:PK, Authorization:'Bearer '+(window.__GZ_JWT||PK), 'Content-Type':'application/json'} /* 관문 JWT 우선(2026-09-05) */;
/* [v0.78] 로그인 만료 대응 — 머리는 호출마다 현재 토큰(관문이 갱신해 넣어 줌)으로, 401이면 관문 gzRefresh 후 한 번 다시 */
function HH(){ return {apikey:PK, Authorization:'Bearer '+(window.__GZ_JWT||PK), 'Content-Type':'application/json'}; }
async function gzAuthRetry(){ try{ if(window.parent&&window.parent!==window&&typeof window.parent.gzRefresh==='function'){ const ok=await window.parent.gzRefresh(); try{ const pj=JSON.parse(window.parent.sessionStorage.getItem('gz_session')||'null'); if(ok&&pj&&pj.jwt) window.__GZ_JWT=pj.jwt; }catch(_){} return ok; } }catch(_){} return false; }
async function rpc(fn,payload){
  let r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:HH(),body:JSON.stringify(payload||{})});
  if(r.status===401&&await gzAuthRetry()) r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:HH(),body:JSON.stringify(payload||{})});
  const tx=await r.text();
  if(!r.ok) throw new Error(fn+' '+r.status+' '+tx.slice(0,120));
  return tx?JSON.parse(tx):null;
}
async function rest(path){
  let r=await fetch(SB+'/rest/v1/'+path,{headers:HH()});
  if(r.status===401&&await gzAuthRetry()) r=await fetch(SB+'/rest/v1/'+path,{headers:HH()});
  if(!r.ok) throw new Error('REST '+r.status);
  return r.json();
}
const JOURNEY=[['1','경영'],['2','학부모'],['2p','상담'],['3','수업준비'],['3p','시험범위'],['4','수업'],['4p','코칭'],['5','오거나이저']];
let TAB='4', TT=null, COACH_SID=null, COACH_NAME='', WORK=null, ATT={}, ATTW={}, WEEK_OFF=0, EXC=[], TT_VIEW='week', RAIL_D=null;

function weekDates(off){ /* 월 시작 주의 날짜 7개 */
  const now=new Date(); const dow=(now.getDay()+6)%7; /* 0=월 */

}

/* [v0.72] 카드에서 학생 페이지 바로 열기 — sid+k 토큰을 붙여 연다.

var LINKK=null;
async function openStudentPage(sid){

/* [v0.75f] 출결 점 날짜별 분리 — 종전: 점 id가 학생 번호만이라 같은 주 두 칸이 같은 id, 색도 오늘 기록 하나로 칠함 */
function attGet(sid,d,st){ const m=(ATTW&&ATTW[d])||(d===localDate()?ATT:{}); const k=st?String(st).slice(0,5):''; return (k&&m[sid+'@'+k])||m[sid]||''; }
function attSlotTime(sid,dd){ try{
  const d=new Date((dd||localDate())+'T00:00:00'); const dow=((d.getDay()+6)%7)+1;
  let rows=((TT&&TT.solo)||[]).filter(x=>x.sid===sid);

  }catch(e){document.getElementById('exmat').innerHTML='<span class="err">매트릭스 회선 오류: '+e.message+'</span>';}
  try{
    const rc=await rest('v_exam_save_receipt?select=exam_id,exam_name,grade,작품수,누락,완전&order=exam_id.desc&limit=200');
    const bad=rc.filter(x=>!x['완전']);
    document.getElementById('exrcpt').innerHTML='<b>저장 영수증</b> — 최근 '+rc.length+'건 중 <span style="color:var(--new);font-weight:bold">완전 '+(rc.length-bad.length)+'</span> · <span style="color:var(--warn);font-weight:bold">불완전 '+bad.length+'</span>'
      +(bad.length?'<table class="tb" style="margin-top:5px"><tr><th>시험</th><th>학년</th><th>작품수</th><th>누락</th></tr>'+bad.slice(0,10).map(x=>'<tr><td>'+x.exam_name+'</td><td>'+x.grade+'</td><td>'+x['작품수']+'</td><td style="color:var(--warn)">'+(x['누락']||'')+'</td></tr>').join('')+'</table>':'');
  }catch(e){document.getElementById('exrcpt').innerHTML='<span class="err">영수증 회선 오류</span>';}
}
let PIN=null; /* 검색 결과를 코칭에 꽂기 */
async function renderPrep(m){
  m.innerHTML='<div class="pick"><input type="text" id="gq" placeholder="통합 검색 — 작품·강좌·교안 (2자 이상)" oninput="gsearch(this.value)"><div class="wres" id="gres" style="display:none"></div><div class="wtag" id="gpin">'+(PIN?('꽂힌 자료: '+PIN.title.slice(0,50)+' — 코칭 카드 2교시 자료칸에 자동 입력'):'')+'</div></div><div id="queue" class="pick">대기열 불러오는 중…</div>';
  try{
    const rows=await rpc('gz_prep_texts');
    rows.sort((a,b)=>(b.n||0)-(a.n||0)); /* 힘순 = 영향 학생수 */
    const head='<tr><th style="text-align:left">교재(힘순)</th><th>학생</th><th>다음</th>'+[1,2,3,4,5,6,7].map(i=>'<th>S'+i+'</th>').join('')+'<th>CLEAR</th></tr>';
    const body=rows.slice(0,25).map(r=>{
      const s=(r.steps||[]);
      return '<tr><td style="text-align:left">'+(r.title||'').slice(0,38)+'</td><td>'+(r.n||0)+'</td><td>'+(r.nx||'')+'</td>'
        +[0,1,2,3,4,5,6].map(i=>'<td style="text-align:center">'+((s[i]||0)>0?'':'<span style="color:var(--warn);font-weight:bold">✕</span>')+'</td>').join('')
        +'<td style="text-align:center">'+((r.clear_n||0)>0?'':'<span style="color:var(--warn);font-weight:bold">✕</span>')+'</td></tr>';
    }).join('');
    document.getElementById('queue').innerHTML='<b>작업 대기열</b> — 안 된 것에만 ✕ · 영향 학생수 내림차순 (상위 25 / 전체 '+rows.length+')<table class="tb" style="margin-top:5px">'+head+body+'</table><div class="mini">정보│영상 2칸 정밀 판정은 회선 확장 후(결선 명기)</div>';
  }catch(e){document.getElementById('queue').innerHTML='<span class="err">대기열 회선 오류: '+e.message+'</span>';}
}
async function renderRail(m){
  m.innerHTML='<div class="load">교사 레일 불러오는 중…</div>';
  try{
    if(!TT) TT=await rpc('gz_tt_data');
    try{ const a=await rpc('gz_att_day',{}); ATT={}; Object.entries(a||{}).forEach(([k,v])=>{ATT[k]=v;}); }catch(e){ATT={};}
    const today=localDate(); ATTW[today]=Object.assign({},ATT); /* [v0.75g] 레일에서 새로 받은 오늘 출결로 날짜별 표도 맞춘다 — 점 색과 누를 때 상태가 어긋나지 않게 */
    const dsel=RAIL_D||today;
    const dow=((new Date(dsel+'T12:00:00').getDay()+6)%7)+1; /* ISO 1=월…7=일 */
    const solos=(TT.solo||[]).filter(x=>x.d===dow&&ttOn(x,dsel)), grps=(TT.groups||[]).filter(x=>x.d===dow);
    const ts=[...new Set([...solos.map(s=>s.t),...grps.map(g=>g.t)])].filter(Boolean).sort();
    let exc=[]; try{exc=await rpc('gz2_week_exceptions',{p_from:dsel,p_to:dsel});}catch(e){}
    let html='<div style="max-width:1200px;margin:0 auto 8px;display:flex;gap:8px;align-items:center;"><button class="btn2" style="border:1px solid #99a;border-radius:6px;padding:2px 9px;font-size:11px;cursor:pointer;background:#fff;" onclick="railMove(-1)">◀</button><b style="font-size:12.5px;">'+dsel+' ('+['월','화','수','목','금','토','일'][dow-1]+')'+(dsel===today?' 오늘':'')+'</b><button class="btn2" style="border:1px solid #99a;border-radius:6px;padding:2px 9px;font-size:11px;cursor:pointer;background:#fff;" onclick="railMove(1)">▶</button><span style="margin-left:auto"><button class="btn2" style="border:1px solid #99a;border-radius:6px;padding:2px 9px;font-size:11px;cursor:pointer;background:#fff;" onclick="setView(\'week\')">주간 보기</button></span></div>';
    html+='<div style="display:grid;grid-template-columns:repeat('+Math.max(ts.length,1)+',minmax(170px,1fr));gap:8px;max-width:1200px;margin:0 auto;overflow-x:auto;">';
    ts.forEach(t=>{
      const my=[...grps.filter(g=>g.t===t).map(g=>({k:1,st:g.st,label:g.k,sub:(g.roster||[]).length+'명'})),
                ...solos.filter(s=>s.t===t).map(s=>({k:0,st:s.st,sid:s.sid,label:s.n,sub:(s.sch||'')+' '+(s.gr||'')}))].sort((a,b)=>(a.st||'').localeCompare(b.st||''));
      html+='<div><div class="dh">'+t+'<small>'+my.length+'건</small></div>';
      my.forEach(c=>{
        const att=(c.k===0&&dsel===today)?('<span class="attdot" id="att_'+c.sid+'_'+dsel+'" onclick="event.stopPropagation();attCycle('+c.sid+')" style="cursor:pointer;display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle;margin-right:3px;border:1.5px solid #99a;background:'+(ATT[c.sid]==='출'?'var(--new)':(ATT[c.sid]==='결'?'var(--warn)':'#fff'))+'"></span>'):'';
        html+='<div class="card'+(c.k?' grp':'')+'" style="margin-top:4px;"><span class="t">'+(c.st||'').slice(0,5)+'</span> '+att+(c.k?('<b>'+c.label+'</b>'):('<b onclick="openCoach('+c.sid+',\''+c.label+'\')">'+c.label+' ▶</b>'))+'<div class="roster">'+c.sub+'</div></div>';
      });
      html+='</div>';
    });
    html+='</div>';
    if(exc.length) html+='<div class="pick" style="max-width:1200px;margin:8px auto;">이 날 보충·휴강 '+exc.length+'건: '+exc.map(x=>x.name+'('+x.type+')').join(' · ')+'</div>';
    m.innerHTML=html;
  }catch(e){m.innerHTML='<div class="err">레일 회선 오류: '+e.message+'</div>';}
}
function railMove(dir){
  const cur=RAIL_D||localDate();
  RAIL_D=localDate(cur,dir); render();
}
function gsearch(q){
  const box=document.getElementById('gres');
  if((q||'').trim().length<2){box.style.display='none';return;}
  clearTimeout(window._gt);
  window._gt=setTimeout(async()=>{
    try{
      const rows=await rpc('gz_global_search',{p_q:q.trim()});
      box.innerHTML=(rows||[]).slice(0,10).map(r=>`<div onclick='pinIt(${JSON.stringify(JSON.stringify({id:r.id,kind:r.kind,title:r.title}))})'>[${r.sub||r.kind}] ${r.title}</div>`).join('')||'<div>결과 없음</div>';
      box.style.display='block';
    }catch(e){box.innerHTML='<div>검색 오류</div>';box.style.display='block';}
  },250);
}
function pinIt(s){PIN=JSON.parse(s);document.getElementById('gres').style.display='none';document.getElementById('gpin').textContent='꽂힌 자료: '+PIN.title.slice(0,50)+' — 코칭 카드 2교시 자료칸에 자동 입력';}
document.getElementById('role').value=localStorage.getItem('g2role')||'teacher';
/* 로그인 관문(2026-09-05 계획표 9): 관문에서 주입된 __GZ_ME로 역할·본인 고정 */
if(window.__GZ_ME&&window.__GZ_ME.teacher_id){const me=window.__GZ_ME;const rv=me.role==='원장'?'director':me.role==='데스크'?'director':'teacher';document.getElementById('role').value=rv;localStorage.setItem('g2role',rv);if(rv==='teacher'){localStorage.setItem('g2me',me.nick);TFILT=me.nick;localStorage.setItem('g2tfilt',me.nick);}else{localStorage.removeItem('g2me');}document.getElementById('role').disabled=true;document.getElementById('role').title='로그인 계정 '+me.name+' ('+me.role+') — 역할 고정';}
drawTabs();render();

/* 신입 판 → 코치 카드 자동 오픈 (sessionStorage gz_open_coach) */
setTimeout(()=>{try{const sid=+sessionStorage.getItem('gz_open_coach');if(sid){sessionStorage.removeItem('gz_open_coach');const st=((TT&&TT.solo)||[]).find(x=>x.sid===sid);openCoach(sid,st?st.n:('#'+sid),st?st.ty:'정규',st?st.rid:0);}}catch(_){}},3000);
</script>
