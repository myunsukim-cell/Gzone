<style>
:root{--deep:#1E3A2F;--deep2:#2D5444;--gold:#F2C14E;--ink:#1F2421;--paper:#F6F4EE;--line:#E3DFD3;--dim:#6B6F68;--teal:#1D5C57;--red:#9A3412;--done:#2E7D4F;--todo:#D9D4C6}
[hidden]{display:none!important}*{box-sizing:border-box}html,body{margin:0;background:#E4E0D5;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif}
.demo{position:relative;z-index:5;background:#1F2421;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}.demo b{color:var(--gold);margin:0 4px 0 8px}

.wrap{display:flex;justify-content:center;padding:14px 12px 40px}

.tab{width:1060px;max-width:100%;background:var(--paper);border-radius:18px;border:10px solid #1F2421;min-height:720px;display:grid;grid-template-columns:460px 1fr;overflow:hidden}
header{padding:16px 20px 0;display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--dim)}header b{color:var(--ink);font-size:16px}
.goal{margin:12px 20px 0;background:var(--deep);color:#fff;border-radius:16px;padding:12px 16px}
.goal .k{font-size:11px;color:var(--gold);letter-spacing:.04em}.goal .t{font-family:'Gowun Batang',serif;font-size:19px;margin-top:2px}.goal .m{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:#D6E2DA}
.goal .m i{display:inline-block;width:11px;height:11px;border-radius:50%;background:#2D5444;border:1px solid #6b8f7a}.goal .m i.on{background:var(--gold);border-color:var(--gold)}
.wheel{position:relative;margin:6px auto 0;width:340px;height:340px}
.wheel svg{width:100%;height:100%;display:block}
.st{position:absolute;width:62px;margin-left:-31px;text-align:center;font-size:11px;line-height:1.25;color:var(--dim);cursor:pointer;user-select:none}
.st b{display:block;width:30px;height:30px;line-height:30px;margin:0 auto 3px;border-radius:50%;background:#fff;border:2px solid var(--todo);color:var(--dim);font-size:12px;font-weight:700}
.st.done b{background:var(--done);border-color:var(--done);color:#fff}.st.now b{background:var(--gold);border-color:var(--gold);color:var(--deep);box-shadow:0 0 0 6px rgba(242,193,78,.28)}.st.now{color:var(--ink);font-weight:700}
.st.pick b{outline:3px solid var(--deep);outline-offset:2px}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;text-align:center}
.center .n{font-family:'Gowun Batang',serif;font-size:15px;color:var(--deep);line-height:1.35}.center .s{font-size:11px;color:var(--dim);margin-top:4px}
.help{position:absolute;right:0;top:0;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font:inherit;font-size:16px;cursor:pointer}
.card{margin:12px 20px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card .k{font-size:12px;color:var(--red);font-weight:700}.card h2{font-family:'Gowun Batang',serif;font-size:21px;margin:6px 0 4px;line-height:1.35}.card .sub{font-size:13px;color:var(--dim);line-height:1.6}
.go{display:block;width:100%;font:inherit;font-size:16px;min-height:50px;border:0;border-radius:12px;background:var(--deep);color:#fff;cursor:pointer;margin-top:12px}.go.soft{background:#fff;color:var(--deep);border:1px solid var(--deep)}
.three{margin:12px 20px 0;background:#FFF8E1;border:1px solid var(--gold);border-radius:16px;padding:14px 16px;font-size:13.5px;line-height:1.7}
.three b{font-family:'Gowun Batang',serif;font-size:16px;display:block;margin-bottom:4px}.three .r{display:flex;gap:8px}.three .r span:first-child{min-width:52px;color:var(--dim)}
.tabs{margin:16px 20px 30px;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.tabs div{text-align:center;padding:12px 0;font-size:13px;color:var(--dim);border-right:1px solid var(--line)}.tabs div:last-child{border:0}.tabs div.on{color:var(--deep);font-weight:700;background:#E4EFE8}
/* 태블릿 */
.side{background:var(--deep);color:#fff;padding:22px;display:flex;flex-direction:column;gap:12px}
.side .wheel{width:400px;height:400px}.side .st{color:#D6E2DA}.side .st b{background:#2D5444;border-color:#4a7560;color:#D6E2DA}.side .st.done b{background:#8CC9A6;border-color:#8CC9A6;color:var(--deep)}.side .st.now{color:#fff}
.side .center .n{color:#fff}.side .center .s{color:#D6E2DA}.side svg circle.ring{stroke:#4a7560}
.side .goal{margin:0;background:#2D5444}

.frame{position:relative}
.act{display:flex;align-items:baseline;gap:10px;margin:12px 0 4px 0;padding:8px 10px;border-radius:10px;background:var(--abg)}.act .an{white-space:nowrap}
.act .an{font-family:'Gowun Batang',serif;font-size:15px;font-weight:700;color:var(--ac)}.act .am{font-size:12px;color:#4A4F48;margin-top:2px;line-height:1.5}
.act.cold{padding:4px 10px;background:transparent}.act.cold .an{font-size:12px}.act.cold .am{display:none}
.pr .ex{display:block;font-size:12.5px;color:#4A4F48;line-height:1.45;margin-top:2px}.pr:not(.cold):not(.fold){grid-template-columns:34px 1fr}.pr:not(.cold):not(.fold) .ln{grid-column:2;text-align:left;max-width:none;margin-top:2px;font-size:12px}.pr.now .ln{color:var(--teal);font-weight:400}
.pr .tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;background:var(--abg);color:var(--ac)}
.pr.cold{min-height:26px}.pr.cold .ex,.pr.cold .ln,.pr.cold .tag,.pr.cold .nm{display:none}.pr.cold .vb{font-size:12px;color:var(--dim)}.pr.cold b{width:16px;height:16px;line-height:14px;font-size:0;margin-left:8px}
.pr.done .ex{display:none}
.side .act .an{color:#fff}.side .act .am{color:#D6E2DA}.side .act{background:rgba(255,255,255,.08)}.side .pr .ex{color:#D6E2DA}.side .pr .tag{background:rgba(255,255,255,.12);color:#fff}

.act{display:flex;align-items:center;gap:8px;margin:10px 0 2px 0;font-size:11px;letter-spacing:.06em}.act span{padding:2px 8px;border-radius:6px;font-weight:700}
.pr .vb{font-family:'Gowun Batang',serif;font-size:15px;color:var(--ink);display:block;line-height:1.2}.pr .nm{display:block}
.pr.now .vb{font-size:21px}.pr.done .vb{font-size:13px;color:var(--done)}.pr.fold .vb{font-size:11px}.pr.fold .nm{display:none}
.pr .ln{align-self:center}
.power{margin:6px 0 0 44px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}.power i{display:inline-block;width:18px;height:10px;border-radius:3px;background:var(--todo)}.power i.on{background:#F2C14E}
.side .pr .vb{color:#fff}.side .pr.done .vb{color:#8CC9A6}.side .power{color:#D6E2DA}
.tour .box .v{font-family:'Gowun Batang',serif;font-size:24px;color:var(--deep)}

.path{position:relative;margin:10px 20px 0;padding:4px 0 4px 0}
.path .help{top:-4px}
.pr{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;min-height:46px;cursor:pointer;position:relative}
.pr:before{content:"";position:absolute;left:16px;top:0;bottom:0;width:3px;background:var(--todo)}.pr:not(.done):not(.now):before{background:color-mix(in srgb,var(--c) 30%,#fff)}
.pr.done:before{background:var(--done)}.pr.now:before{background:linear-gradient(var(--done) 0 50%,var(--todo) 50% 100%)}
.pr:first-child:before{top:50%}.pr:last-child:before{bottom:50%}
.pr b{position:relative;z-index:1;width:30px;height:30px;line-height:28px;text-align:center;border-radius:50%;background:#fff;border:2px solid var(--todo);color:var(--dim);font-size:12px;margin-left:1px}
.pr.done b{background:var(--done);border-color:var(--done);color:#fff}.pr.now b{background:var(--gold);border-color:var(--gold);color:var(--deep);box-shadow:0 0 0 5px rgba(242,193,78,.3)}.pr:not(.done):not(.now) b{border-color:color-mix(in srgb,var(--c) 45%,#fff);color:var(--c)}
.pr .nm{font-size:13px;color:var(--dim)}.pr.now .nm{font-size:15px;color:var(--ink);font-weight:700}.pr .ln{font-size:11.5px;color:var(--dim);text-align:right;max-width:150px}.pr.now .ln{color:var(--teal)}
.pr.pick .nm{text-decoration:underline;text-decoration-color:var(--deep);text-underline-offset:4px;color:var(--ink)}
.pr.fold{min-height:22px}.pr.fold .nm{font-size:11px}.pr.fold .ln{display:none}.pr.fold b{width:14px;height:14px;line-height:12px;font-size:0;margin-left:9px}
.side .pr:before{background:#4a7560}.side .pr.done:before{background:#8CC9A6}.side .pr.now:before{background:linear-gradient(#8CC9A6 0 50%,#4a7560 50% 100%)}
.side .pr b{background:#2D5444;border-color:#4a7560;color:#D6E2DA}.side .pr.done b{background:#8CC9A6;border-color:#8CC9A6;color:var(--deep)}
.side .pr .nm{color:#D6E2DA}.side .pr.now .nm{color:#fff}.side .pr .ln{color:#D6E2DA}.side .pr.now .ln{color:var(--gold)}

function wheel(size){const s=SITS[st.sit];let h='';let lastAct=-1;const curAct=ST[s.now].act;const pickAct=st.pick!=null?ST[st.pick].act:null;
 ST.forEach((x,i)=>{const done=s.done.includes(i),now=s.now===i,pick=st.pick===i;const a=ACT[x.act];const hot=(x.act===curAct)||(x.act===pickAct);
  if(x.act!==lastAct){h+='<div class="act '+(hot?'':'cold')+'" style="--abg:'+a.bg+';--ac:'+a.c+'"><div class="an">'+a.n+'</div><div class="am">'+a.m+'</div></div>';lastAct=x.act;}
  const cold=!hot&&!pick;const fold=done&&!pick&&hot&&!now&&i<s.now-1;
  h+='<div class="pr '+(done?'done':'')+(now?' now':'')+(pick?' pick':'')+(cold?' cold':'')+(fold?' fold':'')+'" data-i="'+i+'" style="--c:'+a.c+';--abg:'+a.bg+';--ac:'+a.c+'"><b>'+(done?'✓':i===9?'10':i)+'</b><span><span class="vb">'+x.v+(now?' · 지금 여기':'')+'<span class="tag">'+x.val+'</span></span><span class="nm">'+x.n+'</span><span class="ex">'+x.exp+'</span></span><span class="ln">'+x.line+'</span></div>';
  if(i===9&&hot){const n=s.now===9?1:0;h+='<div class="power">내 힘 '+[0,1,2,3,4].map(k=>'<i class="'+(k<n?'on':'')+'"></i>').join('')+' '+(n?'1바퀴':'첫 바퀴를 돌면 여기가 커져요')+'</div>';}
 });return h;}
function goal(){return '<div class="goal"><div class="k">내 목표 · 내가 정함</div><div class="t">2학기 기말 국어 85점 · 11/23</div><div class="m">마일스톤 <i class="on"></i><i class="on"></i><i></i><i></i> 다음: 서술형 이유 쓰기 2문항 연속 · D-48</div></div>'}
function card(){const i=st.pick!=null?st.pick:SITS[st.sit].now;const x=ST[i];
 let h='<div class="card"><div class="k">'+(st.pick!=null&&st.pick!==SITS[st.sit].now?x.v+' · 이 걸음에서 하는 것':'지금 할 일')+'</div><h2>'+x.head+'</h2>'+(x.sub?'<div class="sub">'+x.sub+'</div>':'')+'<button class="go">'+x.btn+'</button>'+(x.soft?'<button class="go soft">'+x.soft+'</button>':'')+'</div>';
 h+='<div class="three"><b>'+x.v+' · '+x.n+' — 국존 공부법</b><div class="r"><span>왜</span><span>'+x.why+'</span></div><div class="r"><span>앱이</span><span>'+x.app+'</span></div><div class="r"><span>내가</span><span>'+x.me+'</span></div></div>';
 return h;}
function tabs(){return '<div class="tabs"><div>내 위치</div><div class="on">내 공부</div><div>수업</div><div>내 기록</div></div>'}
function tour(){if(st.tour<0)return '';if(st.tour>=10)return '<div class="tour"><div class="box"><div class="k">국존 열 걸음</div><div class="q">세우고, 해내고, 알아내고, 숨기지 않고, 정하고, 확인하고, 채우고, 다지고, 돌아보고, 더 강해진다.<br>이 길이 국존의 공부법이에요. 지금 여기는 ● 입니다.</div><div class="b"><button class="p" data-t="end">오늘 할 일 보기</button></div></div></div>';
 const x=ST[st.tour];return '<div class="tour"><div class="box"><div class="k">처음 로그인 안내 '+(st.tour+1)+'/10 · '+ACT[x.act].n+' · '+x.n+'</div><div class="v">'+x.v+'</div><div class="q">'+x.why+'</div><div class="b"><button class="p" data-t="next">다음</button><button data-t="end">건너뛰기</button></div></div></div>';}
function phone(){return '<div class="phone frame"><header><b>이가온</b><span>'+SITS[st.sit].n+' · 🔥 12일</span></header>'+goal()+'<div class="path">'+wheel(0)+'<button class="help" id="help" aria-label="안내">?</button></div>'+card()+tabs()+tour()+'</div>';}
function tablet(){const s=SITS[st.sit];return '<div class="tab frame"><aside class="side"><div><div style="font-size:20px;font-weight:700">이가온</div><div style="font-size:12px;color:#D6E2DA">송도고 고1 · 월 18:00 · 정아 선생님 · '+s.n+'</div></div>'+goal()+'<div class="path">'+wheel(0)+'</div></aside><section class="pane">'+card()+tabs()+'</section>'+tour()+'</div>';}
function draw(){$('sits').innerHTML=SITS.map((s,i)=>'<button data-s="'+i+'" class="'+(i===st.sit?'on':'')+'">'+s.n+'</button>').join('');
 $('wrap').innerHTML=st.d==='p'?phone():tablet();document.querySelectorAll('.demo [data-d]').forEach(b=>b.classList.toggle('on',b.dataset.d===st.d));
 if(st.tour>=0&&st.tour<10){const el=document.querySelector('.pr[data-i="'+st.tour+'"]');if(el)el.classList.add('pick');}}
document.querySelector('.demo').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.d){st.d=b.dataset.d;}if(b.dataset.s!=null){st.sit=+b.dataset.s;st.pick=null;}if(b.id==='tourBtn'){st.tour=0;st.pick=null;}draw();};
$('wrap').addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){if(t.dataset.t==='next')st.tour++;else st.tour=-1;draw();return;}if(e.target.id==='help'){st.tour=0;draw();return;}const s=e.target.closest('.pr');if(s){const i=+s.dataset.i;st.pick=(st.pick===i)?null:i;draw();}});
draw();
</script></body></html>
