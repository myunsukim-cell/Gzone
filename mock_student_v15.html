<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#1E3A2F;--gold:#F2C14E;--ink:#1F2421;--paper:#F6F4EE;--line:#E3DFD3;--dim:#6B6F68;--teal:#1D5C57;--red:#9A3412;--done:#2E7D4F;--todo:#D9D4C6}
[hidden]{display:none!important}*{box-sizing:border-box}html,body{margin:0;background:#E4E0D5;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif}
.ctl{max-width:1120px;margin:10px auto 0;padding:8px 12px;border:1px dashed #9A3412;border-radius:10px;background:#FFF4F0;font-size:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.ctl b{color:#9A3412}
.ctl button{font:inherit;font-size:12px;min-height:32px;padding:0 10px;border-radius:16px;border:1px solid #D9B8AE;background:#fff;cursor:pointer}.ctl button.on{background:#9A3412;color:#fff;border-color:#9A3412}
.wrap{display:flex;justify-content:center;padding:14px 12px 40px}
.phone{width:400px;max-width:100%;background:var(--paper);border-radius:28px;border:8px solid #1F2421;height:880px;display:flex;flex-direction:column;overflow:hidden}
.tab{width:1080px;max-width:100%;background:var(--paper);border-radius:18px;border:10px solid #1F2421;height:760px;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--dim)}header b{color:var(--ink);font-size:16px}
.top{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}
.top button{font:inherit;border:0;background:transparent;cursor:pointer;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;border-bottom:3px solid transparent;color:var(--dim)}
.top button .v{font-family:'Gowun Batang',serif;font-size:15px;color:var(--ink)}.top button .n{font-size:11px}
.top button.on{border-bottom-color:var(--ac);background:var(--abg)}.top button.on .v{color:var(--ac);font-weight:700}
.body{flex:1;display:grid;grid-template-columns:96px 1fr;min-height:0}
.tab .body{grid-template-columns:250px 1fr}
.rail{background:#fff;border-right:1px solid var(--line);padding:10px 6px;overflow:auto;position:relative}
.rail:before{content:"";position:absolute;left:16px;top:16px;bottom:16px;width:2px;background:var(--todo)}
.step{display:flex;gap:6px;align-items:flex-start;padding:8px 2px;cursor:pointer;position:relative;border-radius:8px}
.step b{width:14px;height:14px;margin:6px 8px 0 8px;border-radius:50%;font-size:0;border:2px solid var(--todo);background:#fff;flex:none;z-index:1}
.step.done b{background:var(--done);border-color:var(--done);color:#fff}.step.now b{background:var(--gold);border-color:var(--gold);color:var(--deep);box-shadow:0 0 0 4px rgba(242,193,78,.3)}
.step .t{font-size:11px;line-height:1.3;color:var(--dim);padding-top:1px}.step .t i{font-style:normal;display:block;font-size:12.5px;color:var(--ink);font-weight:500}.step .t small{display:none}.step .t em{font-style:normal;font-family:'Gowun Batang',serif;color:var(--ac2)}
.step.now .t i{font-weight:700;color:var(--ink)}.step.now b{width:16px;height:16px;margin-top:5px}.step.sel{background:var(--abg)}.step.off{opacity:.4}
.tab .step .t{font-size:12px}.tab .step .t i{font-size:15px}.tab .step .t small{display:block;font-size:11px;color:var(--dim)}
.main{overflow:auto;padding:12px 14px 30px}
.act{font-size:12px;color:var(--ac);background:var(--abg);border-radius:8px;padding:6px 10px;margin-bottom:10px;line-height:1.5}.act b{font-family:'Gowun Batang',serif;font-size:14px;margin-right:6px}
.h{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}.h h2{font-family:'Gowun Batang',serif;font-size:19px;margin:0;flex:1}.h .tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--abg);color:var(--ac)}.h button{font:inherit;font-size:12px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer}
.bx{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:13.5px;line-height:1.6}.bx .t{font-weight:700;font-size:14px;margin-bottom:4px}.bx .d{color:var(--dim);font-size:12px}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #EFECE3}.row .x{flex:1}.row small{display:block;color:var(--dim);font-size:11.5px}
.pill{font-size:11px;padding:2px 7px;border-radius:6px;background:#EFECE3;color:#4A4F48}.pill.g{background:#E4EFE8;color:var(--teal)}.pill.r{background:#FBE3D6;color:var(--red)}.pill.y{background:#FFF1C2;color:#7A5300}
.btn{font:inherit;font-size:13px;min-height:38px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer}.btn.p{background:var(--deep);color:#fff;border-color:var(--deep)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font:inherit;font-size:13px;min-height:36px;padding:0 10px;border-radius:18px;border:1px solid #D9D4C6;background:#fff;cursor:pointer}.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.sc{display:flex;gap:4px}.sc span{flex:1;text-align:center;font-size:11px;padding:5px 0;border-radius:6px;background:#EFECE3;color:var(--dim);cursor:pointer}.sc span.on{background:var(--gold);color:var(--deep);font-weight:700}
.three{background:#FFF8E1;border:1px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.7;margin-bottom:8px}.three .r{display:flex;gap:8px}.three .r span:first-child{min-width:44px;color:var(--dim)}
.goal{background:var(--deep);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:8px}.goal .k{font-size:11px;color:var(--gold)}.goal .t{font-family:'Gowun Batang',serif;font-size:19px;margin-top:2px}.goal .m{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:#D6E2DA}.goal .m i{display:inline-block;width:11px;height:11px;border-radius:50%;background:#2D5444;border:1px solid #6b8f7a}.goal .m i.on{background:var(--gold);border-color:var(--gold)}

.phone .body{grid-template-columns:1fr}.phone .rail{display:none}
.steps{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}.steps::-webkit-scrollbar{display:none}
.sch{flex:none;display:flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;min-height:36px;padding:0 10px 0 8px;border-radius:18px;border:1px solid var(--line);background:#fff;color:var(--dim);cursor:pointer;white-space:nowrap}
.sch i{width:9px;height:9px;border-radius:50%;background:var(--todo);display:inline-block}.sch.done i{background:var(--done)}.sch.now i{background:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.3)}
.sch.sel{border-color:var(--ac2);background:var(--abg);color:var(--ink);font-weight:700}.sch.off{opacity:.45}
.tab .steps{display:none}
.phone .main{padding:12px 16px 30px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tiles div{background:#F6F4EE;border-radius:8px;padding:8px 4px;text-align:center;font-size:11px;color:var(--dim)}.tiles b{display:block;font-size:17px;color:var(--ink)}
.bar{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}.bar i{height:10px;border-radius:5px;background:#C9DCCF;display:inline-block}.bar i.k{background:var(--done)}
.power{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);margin-top:6px}.power i{width:18px;height:10px;border-radius:3px;background:var(--todo);display:inline-block}.power i.on{background:var(--gold)}
</style></head><body>

function rail(){const s=cur();const tab=st.tab;const steps=ST.filter(x=>x.a===tab);
 const ordered=tab==='build'?steps.slice().sort((a,b)=>{const ka=(a.day===s.day)?0:1,kb=(b.day===s.day)?0:1;return ka-kb||a.i-b.i}):steps;
 return ordered.map(x=>{const done=s.done.includes(x.i),now=s.now===x.i,sel=st.sel===x.i;const off=x.day&&x.day!==s.day;
  return '<div class="step '+(done?'done':'')+(now?' now':'')+(sel?' sel':'')+(off?' off':'')+'" data-i="'+x.i+'" style="--abg:'+ACT.find(a=>a.id===tab).bg+';--ac2:'+ACT.find(a=>a.id===tab).c+'"><b>'+(done?'✓':x.i===9?'10':x.i)+'</b><span class="t"><i>'+x.n+'</i><em>'+x.v+'</em><small>'+x.line+'</small></span></div>';}).join('');}
function stepsBar(){const s=cur();const tab=st.tab;const a=ACT.find(x=>x.id===tab);const steps=ST.filter(x=>x.a===tab);const ordered=tab==='build'?steps.slice().sort((p,q)=>{const kp=(p.day===s.day)?0:1,kq=(q.day===s.day)?0:1;return kp-kq||p.i-q.i}):steps;
 return '<div class="steps" style="--abg:'+a.bg+';--ac2:'+a.c+'">'+ordered.map(x=>{const done=s.done.includes(x.i),now=s.now===x.i,sel=st.sel===x.i,off=x.day&&x.day!==s.day;return '<button class="sch '+(done?'done':'')+(now?' now':'')+(sel?' sel':'')+(off?' off':'')+'" data-i="'+x.i+'"><i></i>'+x.n+'</button>';}).join('')+'</div>';}

 return '<header><b>이가온</b><span>'+s.n+' · 🔥 12일 · 기말 D-48</span></header>'+top+stepsBar()+'<div class="body"><div class="rail">'+rail()+'</div><div class="main">'+content(st.sel)+'</div></div>';}
