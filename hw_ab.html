 "이 반 손글씨의 자모 오독 경향: ㅈ을 ㄱ으로, ㅁ을 ㅇ으로, ㅕ를 ㅓ로, ㅣ를 ㅏ로 잘못 읽기 쉽고, 받침 없는 글자에 ㅇ·ㄱ 받침을 붙여 읽기 쉽다.\n"+
 "원칙: 글자 모양이 1순위다. 문맥·어휘·오독 경향은 모양이 애매한 글자의 후보를 고를 때만 쓴다. 문맥에 맞추려고 모양과 다른 글자를 만들지 않는다.\n"+RULE;}
function row(it){const r=RES[it.id]||{};return `<tr id="t${it.id}"><td>${it.id}</td><td><img src="data:image/jpeg;base64,${it.img}" alt=""></td><td class="r" id="a${it.id}">${r.A!=null?esc(r.A):'<span class="w">대기</span>'}</td><td class="r">${r.B!=null?esc(r.B):'<span class="w">대기</span>'}</td></tr>`;}
function paint(){$("tb").innerHTML=D.items.map(row).join("");prog();}
function prog(){const n=D.items.filter(i=>RES[i.id]&&RES[i.id].A!=null&&RES[i.id].B!=null).length;$("pgi").style.width=(n/D.items.length*100)+"%";$("msg").textContent=`${n} / ${D.items.length} 완료`;return n;}
async function call(it,c){const cell=document.querySelector("#t"+it.id+" td:nth-child("+(c==="A"?3:4)+")");if(cell)cell.innerHTML='<span class="w">판독 중…</span>';const r=await rpc("gz_hw_ab_call",{p_item:it.id,p_cond:c,p_prompt:c==="A"?pA():pB(it),p_img_b64:it.img});
 if(!r||!r.ok)throw new Error(r&&r.msg||r&&r.err||"실패");(RES[it.id]=RES[it.id]||{})[c]=r.answer;const t=$("t"+it.id);if(t)t.outerHTML=row(it);prog();}
function c2i(c){return c==="A"?3:4;}
async function run(){STOP=false;ERR=null;$("go").disabled=true;$("stop").disabled=false;$("msg").textContent="판독 요청 중… 첫 결과까지 10~40초 걸립니다";
 const q=[];D.items.forEach(it=>["A","B"].forEach(c=>{if(!(RES[it.id]&&RES[it.id][c]!=null))q.push([it,c]);}));let k=0;
 const w=async()=>{while(!STOP&&k<q.length){const [it,c]=q[k++];try{await call(it,c);}catch(e){ERR=e.message;$("msg").innerHTML=`<span class="err">중단: ${esc(e.message)}</span>`;STOP=true;const c=document.querySelector("#t"+it.id+" td:nth-child("+(c2i(c))+")");if(c)c.innerHTML=`<span class="err">오류</span>`;}}};
 await Promise.all([w(),w()]);$("go").disabled=false;$("stop").disabled=true;const n=D.items.filter(i=>RES[i.id]&&RES[i.id].A!=null&&RES[i.id].B!=null).length;$("pgi").style.width=(n/D.items.length*100)+"%";if(n===D.items.length)$("msg").textContent="전체 완료 — 연구방에 「채점」이라고 말씀하세요";else if(!ERR)$("msg").textContent=`${n} / ${D.items.length} 완료 (멈춤)`;}
$("stop").onclick=()=>{STOP=true;};$("go").onclick=run;
async function init(){paint();
 try{const s=await rpc("gz_hw_ab_done",{});(s.done||[]).forEach(x=>{(RES[x.id]=RES[x.id]||{})[x.c]=x.a;});paint();
  if(!JWT){$("msg").innerHTML='<span class="err">G-MAP에 로그인한 상태에서 「첨삭 → A/B 실측」 탭으로 여세요.</span>';return;}
  try{const me=await rpc("gz_me",{});if(!me||me.role!=="원장"){$("msg").innerHTML='<span class="err">원장 계정 로그인이 확인되지 않습니다.</span>';return;}}
  catch(e){$("msg").innerHTML='<span class="err">로그인이 만료되었습니다. G-MAP 상단 「첨삭」 버튼을 다시 눌러 주세요(필요하면 로그아웃 후 재로그인).</span>';return;}
  if(!s.has_key){$("msg").innerHTML='<span class="err">Anthropic API 키가 아직 등록되지 않았습니다(연구방에 요청).</span>';return;}
  $("go").disabled=false;}catch(e){$("msg").innerHTML=`<span class="err">${esc(e.message)}</span>`;}}
window.addEventListener("error",e=>{const m=document.getElementById("msg");if(m)m.innerHTML='<span class="err">화면 오류: '+esc(e.message)+'</span>';});
window.addEventListener("unhandledrejection",e=>{const m=document.getElementById("msg");if(m)m.innerHTML='<span class="err">요청 오류: '+esc(String(e.reason&&e.reason.message||e.reason))+'</span>';});
window.addEventListener("message",e=>{if(e.data&&e.data.gz_jwt){JWT=e.data.gz_jwt;$("who").textContent=e.data.gz_name||"";init();}});
setTimeout(()=>{if(!JWT)init();},2500);
</script></body></html>
