<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시원 학생 화면</title>
<!-- [2026-11-21 MAP(DB방) · 채팅 193 · 국존 승인 09:38] 시원 학생 화면 1판. 국존 학생 화면의 틀(오늘·세 장·공부 지도·위 메뉴 4개)을 시원 수업에 맞춘 것. 목업 노트 30743. 읽기만 한다(쓰는 단추 없음). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9e6dc;color:#1c1c1a;font-family:'Noto Sans KR',sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#f7f5ef}
button{font-family:inherit;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid #dcd9cf}
.top .who{display:flex;align-items:center;gap:8px}
.badge{background:#1f4d3a;color:#fff;font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px}
.name{font-size:17px;font-weight:700}
.next{text-align:right;font-size:12px;color:#5c5a52;line-height:1.5}
.nav{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid #dcd9cf;position:sticky;top:0;z-index:5}
.nav button{flex:1;height:44px;white-space:nowrap;letter-spacing:-.5px;border-radius:8px;border:1px solid #1f4d3a;background:#fff;color:#1f4d3a;font-size:13px;font-weight:700;padding:0 2px}
.nav button.on{background:#1f4d3a;color:#fff}
.page{padding:16px;display:none;flex-direction:column;gap:14px}
.page.on{display:flex}
.band{background:#ecebf7;border:1px solid #c9c6e6;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.band .tag{align-self:flex-start;background:#3c3489;color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.h{font-size:17px;font-weight:700}
.sub{font-size:12.5px;color:#44423c;line-height:1.5}
.dim{font-size:12px;color:#5c5a52;line-height:1.5}
.card{background:#fff;border:1.5px solid #b98a2e;border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center}
.card .no{width:30px;height:30px;border-radius:15px;background:#8a5a00;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.card .tx{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.card .t{font-size:16px;font-weight:700}
.chip{align-self:flex-start;font-size:12px;font-weight:700;background:#f1efe8;color:#44423c;padding:2px 8px;border-radius:6px}
.go{height:44px;min-width:60px;border-radius:8px;border:1.5px solid #8a5a00;background:#fff;color:#8a5a00;font-size:14px;font-weight:700}
.go.main{background:#8a5a00;color:#fff}
.fold{height:44px;border-radius:10px;border:1.5px solid #1f4d3a;background:#fff;color:#1f4d3a;font-size:15px;font-weight:700}
.motto{font-size:19px;font-weight:700;line-height:1.4}
.map{display:grid;grid-template-columns:78px 1fr 1fr 1fr;gap:5px}
.map .col{background:#22252b;color:#fff;border-radius:8px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}
.map .col.home{background:#b98a2e}
.map .col b{font-size:13px}.map .col span{font-size:10.5px;color:#d0d3d8}.map .col.home span{color:#fff6e0}
.map .row{background:#1f4d3a;color:#fff;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px}
.map .row b{font-size:13px}.map .row span{font-size:11px;color:#d7e6de;line-height:1.35}
.map .cell{text-align:left;background:#fff;border:1px solid #dcd9cf;border-radius:8px;padding:8px;min-height:76px;color:#1c1c1a;display:flex;flex-direction:column;gap:4px}
.map .cell.do{border:1.5px solid #b98a2e}
.map .cell b{font-size:12.5px;line-height:1.35}.map .cell span{font-size:11.5px;color:#5c5a52;line-height:1.35}
.map .cell i{display:inline-flex;width:18px;height:18px;border-radius:9px;background:#8a5a00;color:#fff;font-size:11px;font-weight:700;font-style:normal;align-items:center;justify-content:center;margin-right:4px}
.box{background:#fff;border:1px solid #dcd9cf;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #ece9df}
.line:first-of-type{border-top:0}
.score{font-size:22px;font-weight:700;color:#1f4d3a;white-space:nowrap}
.score small{font-size:12px;color:#5c5a52;font-weight:500}
.bar{height:10px;border-radius:5px;background:#1f4d3a;min-width:4px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.three div{background:#fff;border:1px solid #dcd9cf;border-radius:10px;padding:12px 6px;text-align:center}
.three b{display:block;font-size:22px;color:#1f4d3a}
.three span{font-size:12px;color:#5c5a52}
.now{border:1.5px solid #b98a2e}
.msg{padding:40px 20px;text-align:center;color:#5c5a52;font-size:14px;line-height:1.7}
ol.goals{margin:0;padding-left:20px;font-size:13.5px;line-height:1.7}
@media(max-width:400px){.nav{gap:4px;padding:10px 10px}.nav button{font-size:12px}}
</style>
</head>
<body>
<div id="app"><div class="msg" id="boot">불러오는 중이에요…</div></div>
<script>
(function(){
var B='https://hbsbrhgmofxvzgrvkkpg.supabase.co/rest/v1/rpc/',PK='sb_publishable_t34zB9x3B7wkm4SqVGpJng_VJfZ3BdH',H={apikey:PK,Authorization:'Bearer '+PK,'Content-Type':'application/json'};
var QS=location.search||'',SID=+((QS.match(/[?&]sid=(\d+)/)||[])[1]||0),K=(QS.match(/[?&]k=([a-f0-9]{32})/)||[])[1]||'';
var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function stop(t){app.innerHTML='<div class="msg"><b style="font-size:17px;color:#1c1c1a">시원 학생 화면</b><br>'+t+'</div>';}
function rpc(fn,body){return fetch(B+fn,{method:'POST',headers:H,body:JSON.stringify(body)}).then(function(r){return r.json();});}
function read(sql){return rpc('gz2_student_read',{p_sid:SID,p_k:K,p_sql:sql}).then(function(r){return Array.isArray(r)?r:null;}).catch(function(){return null;});}
if(!SID||!K){stop('링크가 맞지 않아요. 담당 선생님께 문의해 주세요.');return;}
var today=new Date(Date.now()+9*36e5).toISOString().slice(0,10);
var DAY=['일','월','화','수','목','금','토'];
/* 쉬운 말로 바꾸기: 학습계획서의 「~할 수 있습니다」를 학생 말로 */
function easy(s){return String(s||'').replace(/^\d+\.\s*/,'').replace(/할 수 있습니다\.?/g,'해요.').replace(/수 있습니다\.?/g,'수 있어요.').replace(/,\s*$/,'').trim();}
function split(title){var m=String(title||'').match(/^(.*?)\s*\(([^)]*)\)\s*$/);return m?{name:m[1],range:m[2]}:{name:String(title||''),range:''};}
function md(d){return (+d.slice(5,7))+'월 '+(+d.slice(8,10))+'일';}

rpc('gz2_entry_check',{p_sid:SID,p_k:K}).then(function(ok){
 if(ok!==true){stop('링크가 맞지 않아요. 담당 선생님께 문의해 주세요.');return;}
 return Promise.all([
  read("SELECT name AS nm, coalesce(school,'') AS sch, coalesce(grade,'') AS gr, coalesce(teacher_name,'') AS tch, to_char(enrolled_at,'YYYY-MM-DD') AS en FROM students WHERE id="+SID),
  read("SELECT cg.group_key AS kc, coalesce(cm.is_primary,true) AS pri, to_char(cm.joined_on,'MM/DD') AS d FROM class_members cm JOIN class_groups cg ON cg.id=cm.group_id WHERE cm.is_active AND cm.student_id="+SID+" ORDER BY cm.is_primary DESC, cm.id"),
  read("SELECT day_of_week AS dw, to_char(start_time,'HH24:MI') AS tm, slot_type AS st FROM schedule WHERE student_id="+SID+" AND is_active ORDER BY day_of_week, start_time"),
  read("select b.id, b.year yr, b.month mo, b.week wk, to_char(b.date_from,'YYYY-MM-DD') df, to_char(b.date_to,'YYYY-MM-DD') dt, b.title, b.plan->'goals' goals, coalesce(b.plan->>'intent','') intent, b.plan->'links' links, w.pages wp from cna_weekly_books b left join cna_workbooks w on w.weekly_book_id=b.id where b.track='기본' and b.grade=(select grade from students where id="+SID+") and b.date_to>=current_date-70 and b.date_from<=current_date+28 order by b.date_from"),
  read("select id, to_char(essay_date,'YYYY-MM-DD') d, coalesce(task_type,'') tp, task_no no, score::int sc, length(essay_body) len, (klea_n_feedback_id is not null) fb from student_essays where student_id="+SID+" order by essay_date desc, id desc")
 ]).then(function(a){draw(a[0],a[1],a[2],a[3],a[4]);});
}).catch(function(){stop('지금은 열 수 없어요. 잠시 뒤에 다시 열어 주세요.');});

function draw(st,cg,sc,bk,es){
 var s=(st&&st[0])||{},books=bk||[],essays=es||[];
 var cur=books.filter(function(b){return b.df<=today&&today<=b.dt;})[0]||null;
 var mo=cur?cur.mo:+today.slice(5,7),yr=cur?cur.yr:+today.slice(0,4);
 var month=books.filter(function(b){return b.mo===mo&&b.yr===yr;});
 var prev=books.filter(function(b){return (b.yr*12+b.mo)===(yr*12+mo-1);});
 var cb=cur?split(cur.title):null;
 /* 머리 */
 var key=(cg&&cg[0]&&cg[0].kc)||'',kp=key.split('-'),cls=kp.length>=3?kp[0]:'',tch=kp.length>=3?kp[kp.length-1]:(s.tch||'');
 var nx=(sc&&sc[0])?('다음 수업 '+DAY[sc[0].dw]+' '+sc[0].tm):'';
 var who=[tch?tch+' 선생님':'',cls?cls+' 반':''].filter(Boolean).join(' · ');
 var head='<div class="top"><div class="who"><span class="badge">시원</span><span class="name">'+esc(s.nm||'')+'</span></div><div class="next">'+esc(nx)+(nx&&who?'<br>':'')+esc(who)+'</div></div>'
  +'<div class="nav">'+['오늘','내 글','이번 달 리포트','읽은 책'].map(function(t,i){return '<button type="button" data-p="'+i+'">'+t+'</button>';}).join('')+'</div>';
 /* 1. 오늘 */
 var fbN=essays.filter(function(e){return e.fb;}).length;
 var p0='';
 if(cur){
  p0+='<div class="band"><span class="tag">이번 주 책</span><span class="h">'+esc(cb.name)+'</span><span class="sub">'+esc([cb.range,cur.yr+'년 '+cur.mo+'월 '+cur.wk+'주',first(easy(cur.intent))].filter(Boolean).join(' · '))+'</span></div>';
 }else{
  p0+='<div class="band"><span class="tag">이번 주 책</span><span class="sub">이번 주 책이 아직 올라오지 않았어요. 선생님께 물어보세요.</span></div>';
 }
 p0+='<div class="h">이번 주 이것만 하면 돼요</div>';
 p0+=card(1,'집에서','책 읽기'+(cb&&cb.range?' · '+cb.range:''),'수업 전까지 읽어 와요','',3,true);
 p0+=card(2,'집에서','워크북'+(cur?' · '+cur.mo+'월 '+cur.wk+'주':''),(cur&&cur.wp)?'모두 '+cur.wp+'쪽':'수업 전까지 풀어 와요','',3,false);
 p0+=card(3,'수업에서','이번 주 글쓰기',fbN?'지난 글 첨삭지를 먼저 봐요':'수업에서 함께 써요',essays.length?'지난 글 '+essays.length+'편':'',1,false);
 p0+='<button type="button" class="fold" id="fold">공부 지도 접기</button><div id="mapWrap" style="display:flex;flex-direction:column;gap:14px"><span class="motto">읽고, 생각하고, 써요. 시원은 그 힘을 길러요.</span>'+map(cur,cb)+'</div>';
 /* 2. 내 글 */
 var p1='';
 if(!essays.length){p1='<div class="box"><span class="h">내가 쓴 글</span><span class="dim">아직 올라온 글이 없어요. 수업에서 쓴 글을 선생님이 올리면 여기에 보여요.</span></div>';}
 else{
  p1='<div class="box"><div><span class="h">내가 쓴 글</span> <span class="dim">모두 '+essays.length+'편 · 새 글이 위</span></div>'+essays.map(function(e){
   return '<div class="line"><div><div class="dim">'+esc(e.d)+'</div><div style="font-size:15px;font-weight:700">'+(e.no?'논술 '+e.no+'회':'글쓰기')+'</div><div class="dim">'+(e.len||0)+'자'+(e.fb?' · 첨삭 끝':' · 첨삭 기다리는 중')+'</div></div>'+(e.sc!=null?'<div class="score">'+e.sc+'<small> 점</small></div>':'')+'</div>';}).join('')+'</div>';
  var asc=essays.slice().reverse(),mx=Math.max.apply(null,asc.map(function(e){return e.len||0;}))||1;
  p1+='<div class="box"><span class="h">글 길이가 이렇게 바뀌었어요</span>'+asc.map(function(e){return '<div style="display:grid;grid-template-columns:76px 1fr 54px;gap:8px;align-items:center"><span class="dim">'+md(e.d)+'</span><div class="bar" style="width:'+Math.round((e.len||0)/mx*100)+'%"></div><span class="dim" style="text-align:right">'+(e.len||0)+'자</span></div>';}).join('')+'<span class="dim">길이만 보여 줘요. 잘 쓴 글인지는 첨삭지에서 봐요.</span></div>';
  p1+='<div class="box"><span class="h">첨삭지는 수업에서 받아요</span><span class="dim">선생님이 나눠 준 첨삭지를 보고 고칠 곳을 함께 짚어요.</span></div>';
 }
 /* 3. 이번 달 리포트 */
 var ym=today.slice(0,7),esM=essays.filter(function(e){return e.d.slice(0,7)===ym;}).length;
 var done=month.filter(function(b){return b.dt<today;}).length;
 var p2='<div class="h">'+(+today.slice(5,7))+'월에 이만큼 했어요</div><div class="three"><div><b>'+month.length+'</b><span>이번 달 책(주)</span></div><div><b>'+done+'</b><span>지난 주</span></div><div><b>'+esM+'</b><span>쓴 글</span></div></div>'
  +'<div class="box"><span class="h">세 가지 힘</span>'
  +'<div class="line"><div><b>읽는 힘</b><div class="dim">이번 달에 읽는 책</div></div><div class="score">'+uniq(month)+'<small> 권</small></div></div>'
  +'<div class="line"><div><b>생각하는 힘</b><div class="dim">이번 주에 배우는 것</div></div><div class="score">'+(cur&&cur.goals?goalList(cur).length:0)+'<small> 가지</small></div></div>'
  +'<div class="line"><div><b>쓰는 힘</b><div class="dim">지금까지 쓴 글</div></div><div class="score">'+essays.length+'<small> 편</small></div></div></div>'
  +'<div class="box"><span class="h">선생님 한마디</span><span class="dim">아직 남긴 말이 없어요.</span></div>';
 /* 4. 읽은 책 */
 var p3='<div class="box"><div><span class="h">'+mo+'월에 읽는 책</span> <span class="dim">'+mo+'월 학습계획서</span></div>'+(month.length?month.map(row).join(''):'<span class="dim">이번 달 책이 아직 올라오지 않았어요.</span>')+'</div>';
 var gl=cur?goalList(cur):[];if(gl.length){p3+='<div class="box"><span class="h">이번 주 책으로 배우는 것</span><ol class="goals">'+gl.map(function(g){return '<li>'+esc(g)+'</li>';}).join('')+'</ol>'+((cur.links&&cur.links.length)?'<span class="dim">'+esc(String(cur.links[0]).replace(/\s*전체\((.*?)\)/,'의 $1 단원'))+'과 이어져요.</span>':'')+'</div>';}
 if(prev.length){p3+='<div class="box"><span class="h">지난 달 읽은 책</span>'+prev.map(row).join('')+'</div>';}
 function row(b){var t=split(b.title),now=cur&&b.id===cur.id;return '<div class="line"><div><div class="dim">'+b.mo+'월 '+b.wk+'주'+(now?' · 이번 주':'')+'</div><div style="font-size:15px;font-weight:700">'+esc(t.name)+'</div><div class="dim">'+esc([t.range,b.wp?'워크북 '+b.wp+'쪽':''].filter(Boolean).join(' · '))+'</div></div></div>';}
 app.innerHTML=head+'<div class="page">'+p0+'</div><div class="page">'+p1+'</div><div class="page">'+p2+'</div><div class="page">'+p3+'</div>';
 var nav=app.querySelectorAll('.nav button'),pages=app.querySelectorAll('.page');
 function show(i){for(var j=0;j<4;j++){nav[j].className=j===i?'on':'';pages[j].className='page'+(j===i?' on':'');}window.scrollTo(0,0);}
 app.addEventListener('click',function(e){var t=e.target.closest('[data-p]');if(t){show(+t.getAttribute('data-p'));return;}
  if(e.target.id==='fold'){var w=document.getElementById('mapWrap'),h=w.style.display==='none';w.style.display=h?'flex':'none';e.target.textContent=h?'공부 지도 접기':'공부 지도 펴기';}});
 show(0);
}
function uniq(rows){var o={};rows.forEach(function(b){o[split(b.title).name]=1;});return Object.keys(o).length;}
function goalList(b){var g=(b.goals||[]),n=g.filter(function(x){return /^\d+\./.test(x);});return (n.length?n:g).map(easy).filter(Boolean).slice(0,5);}
function first(t){var m=String(t||'').match(/^.*?[.!?](\s|$)/);t=(m?m[0]:String(t||'')).trim();return t.length>70?t.slice(0,68)+'…':t;}
function card(no,where,title,sub,chip,to,main){return '<div class="card"><div class="no">'+no+'</div><div class="tx"><span class="dim">'+where+'</span><span class="t">'+esc(title)+'</span><span class="dim">'+esc(sub)+'</span>'+(chip?'<span class="chip">'+esc(chip)+'</span>':'')+'</div><button type="button" class="go'+(main?' main':'')+'" data-p="'+to+'">보기</button></div>';}
function map(cur,cb){
 function c(t,s,to,no){return '<button type="button" class="cell'+(no?' do':'')+'" data-p="'+to+'"><b>'+(no?'<i>'+no+'</i>':'')+esc(t)+'</b><span>'+esc(s)+'</span></button>';}
 function r(t,s){return '<div class="row"><b>'+t+'</b><span>'+s+'</span></div>';}
 var wk=cur?cur.mo+'월 '+cur.wk+'주':'',gs=cur?goalList(cur).length:0;
 return '<div class="map"><div></div><div class="col"><b>이번 달 시작</b><span>한 달에 한 번</span></div><div class="col home"><b>집에서</b><span>수업 전까지</span></div><div class="col"><b>수업에서</b><span>매주 한 번</span></div>'
 +r('책 읽기','이번 주 책은?')+c('이번 달 책 · 학습계획서','이번 달 읽을 책을 봐요',3)+c('이번 주 읽을 쪽',(cb&&cb.range)||'',3,1)+c('책 이야기 나누기','수업에서 함께 읽어요',3)
 +r('글쓰기','무엇을 쓸까?')+c('이번 달 쓸 글','수업에서 알려 줘요',1)+c('워크북',[wk,(cur&&cur.wp)?cur.wp+'쪽':''].filter(Boolean).join(' · '),3,2)+c('오늘 쓴 글 올리기','선생님이 올려요',1,3)
 +r('첨삭','어디를 고칠까?')+c('받은 첨삭지','수업에서 받아요',1)+c('고쳐 쓰기','첨삭지를 보고 다시 써요',1)+c('선생님과 짚기','고칠 곳을 함께 봐요',1)
