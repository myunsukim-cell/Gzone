=\"bd\" style=\"top:6px;right:8px\">7<\/div>\n\n    <div class=\"top\">\n      <div class=\"crumb\">김○○ 학생을 위한 상담 자료 · <b>확신<\/b><\/div>\n      <div class=\"back\">‹ 자료집<\/div>\n    <\/div>\n\n    <div class=\"hero\">\n      <h2>약속 대신,<br><b>기록<\/b>을 보여드립니다<\/h2>\n      <div>\n        <div class=\"tgl\"><button class=\"on\">A · 일괄 상영<\/button><button>B · 해법과 교차<\/button><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"tglnote\">B 모드: 해법 6단을 넘길 때마다 해당 증거가 한 장씩 끼어든다 (1단 교안→과정 증거, 6단 궤적→결과 증거…) — 상담자 스타일에 따라 선택<\/div>\n\n    <div class=\"cols\">\n      <div class=\"col\">\n        <div class=\"ct\">증거 1 · 정확도<\/div>\n        <h3>이 학교 시험을<br>이만큼 안다<\/h3>\n        <div class=\"big\">400<small> 개 시험 전수 분석<\/small><\/div>\n        <p>연수·송도 12개교 지형(G-NAT)과 학교별 킬러·함정까지 — <b>학교명이 박힌 결과<\/b>가 첫 번째 증거다.<\/p>\n        <div class=\"real\">실물: 송도고 언매 기말 분석지(화면 3 상영분) 재호출 버튼<\/div>\n      <\/div>\n      <div class=\"col\">\n        <div class=\"ct\">증거 2 · 과정<\/div>\n        <h3>루프가 실제로<br>돌고 있다<\/h3>\n        <div class=\"big\">839<small> 건 주간 코칭 기록<\/small><\/div>\n        <p>교안 8,637건 생산·과제 사진 인증·주간 처방 — 막3에서 본 여섯 단이 <b>지금 가동 중<\/b>이라는 기록.<\/p>\n        <div class=\"real\">실물: 8월 14일 코칭 로그(취약 TOP3→처방) 재호출 버튼<\/div>\n      <\/div>\n      <div class=\"col\">\n        <div class=\"ct\">증거 3 · 결과<\/div>\n        <h3>숫자가<br>남아 있다<\/h3>\n        <div class=\"big\">72→81<small> · 두 달 · 4→3등급<\/small><\/div>\n        <p>재원생 궤적 원본(막4 상영분) + 모의고사 7회 연속 기록 학생의 시계열 — <b>개별 사례·비보장 고지 상시.<\/b><\/p>\n        <div class=\"real\">실물: 성적 추이 카드(자동 선별·동학년 우선) 재호출 버튼<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"cond\">💬 <b>후기 슬롯 (조건부):<\/b> 후기 실물이 자산으로 등재되면 이 자리에 4번째 열로 표시 — 현재 DB에 후기 그릇·자산 0건(실측)이라 표시하지 않는다. 지어내지 않음.<\/div>\n\n    <div class=\"next\"><button class=\"nb\">그래서, 앞으로 이렇게 됩니다 → 미래 코너<\/button><\/div>\n  <\/div><\/div>\n\n  <\/body><\/html>", "ex": false}, {"c": "국존 공부방법", "l": "등록 후 받게 되시는 것", "d": "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\
