<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>국존 — 학부모 페이지</title>
<style>:root{--deep:#1E4D3B;--gold:#B8892E;--line:#e3dfd3;--dim:#8a8577;--band:#f4f8f5}*{box-sizing:solid;box-sizing:border-box;margin:0;padding:0}body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f7f6f2;color:#1f2a24;font-size:14px;max-width:560px;margin:auto;padding:14px}
.top{background:var(--deep);color:#fff;border-radius:10px;padding:14px 16px}.top h1{font-size:18px;margin-bottom:2px}.top .m{font-size:12px;opacity:.85}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}.card h2{font-size:14px;color:var(--deep);margin-bottom:8px}.kpis{display:flex;gap:8px}.kpi{flex:1;background:var(--band);border-radius:8px;padding:8px;text-align:center}.kpi b{display:block;font-size:18px;color:var(--deep)}.kpi span{font-size:11px;color:var(--dim)}
.row{padding:8px 0;border-bottom:1px solid #f0ede4;font-size:13px}.row:last-child{border:0}.row .d{color:var(--dim);font-size:11.5px}.btn{display:inline-block;background:var(--deep);color:#fff;border-radius:6px;padding:6px 12px;text-decoration:none;font-weight:700;font-size:13px}.hl{background:#fff8ea;border-left:3px solid var(--gold);padding:8px 10px;border-radius:6px;font-size:13px;line-height:1.55}
.tag{font-size:11px;border-radius:4px;padding:1px 6px;background:var(--band);color:var(--deep)}.foot{text-align:center;color:var(--dim);font-size:11px;margin:16px 0}.dd{font-weight:800;color:#A4472F}
</style></head><body>
<div id="app"><p style="color:#8a8577;padding:30px;text-align:center">불러오는 중…</p></div>
<div class="foot">국존 국어전문학원 · 이 페이지는 학원에서 보내드린 링크로만 열립니다. 문의는 담당 선생님께.</div>
<script>
const U='https://qcnsadcpsonuxnjyrlez.supabase.co/rest/v1/rpc/',K='sb_publishable_stx8spRryf_4OWMFsW29Rw_XiDNfyb0',H={apikey:K,get Authorization(){return 'Bearer '+(gzJwt()||K);},'Content-Type':'application/json'};function gzJwt(){var w=window;for(var i=0;i<6;i++){try{if(w.__GZ_JWT)return w.__GZ_JWT;var s=JSON.parse(w.sessionStorage.getItem('gz_session')||'null');if(s&&s.jwt)return s.jwt;}catch(_){}if(!w.parent||w.parent===w)break;w=w.parent;}return null;} /* [2026-10-02] 관문 로그인 토큰 전달 — 9/30 anon 회수 후 401 해소(journey_live와 같은 방식) */const G='https://myunsukim-cell.github.io/Gzone/';const DAYS=['일','월','화','수','목','금','토'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
(async()=>{const qs=new URLSearchParams(window.__EMBED_QS||location.search);const sid=+qs.get('sid'),k=qs.get('k')||'';const app=document.getElementById('app');
 if(!sid||!k){app.innerHTML='<div class="card"><h2>국존 학부모 페이지</h2><p style="font-size:13px;color:#555">학원에서 보내드린 링크로 열어 주세요. 링크가 없으시면 담당 선생님께 요청해 주세요.</p></div>';return;}
 let d;try{d=await (await fetch(U+'gz2_parent_home',{method:'POST',headers:H,body:JSON.stringify({p_sid:sid,p_k:k})})).json();}catch(e){app.innerHTML='<div class="card">불러오기 실패</div>';return;}
 if(!d||!d.ok){app.innerHTML='<div class="card"><h2>국존 학부모 페이지</h2><p style="font-size:13px;color:#555">링크가 유효하지 않습니다. 담당 선생님께 문의해 주세요.</p></div>';return;}
 const s=d.student||{},h=d.home||{},a=d.attendance||{};const wk=h.week_label?h.week_label:'';
 let html='<div class="top"><h1>'+esc(s.name)+' 학생 학부모님, 안녕하세요</h1><div class="m">'+esc(s.school||'')+' '+esc(s.grade||'')+' · 담당 '+esc(s.teacher||'')+' 선생님 · '+esc(s.division||'')+'</div></div>';
 html+='<div class="card"><h2>이번 주 한 줄 <span class="tag">'+esc(wk||'')+(h.headline_src?' · '+esc(h.headline_src):'')+'</span></h2>'+(h.headline?'<div class="hl">'+esc(h.headline)+'</div>'+(h['이번주과제']?'<div class="row"><b>이번 주 과제</b> '+esc(h['이번주과제'])+'</div>':''):'<div class="row" style="color:#8a8577">이번 주 기록이 아직 정리되지 않았습니다 — 수업 후 담당 선생님 기록이 올라오면 여기에 표시됩니다</div>')+'</div>';
 if((d.news||[]).length)html+='<div class="card"><h2>국존 입시 소식 <span class="tag">매주 국존이 정리하는 입시 브리핑</span></h2>'+(d.news||[]).map(n=>'<div class="row"><span class="d">'+String(n.at||'').slice(5,10).replace('-','/')+'</span> '+esc(n.title)+' <a class="btn" style="float:right;padding:3px 10px;font-size:12px" href="'+esc(n.url)+'" target="_blank" rel="noopener">읽기</a></div>').join('')+'</div>';
 html+='<div class="card"><h2>아이가 세운 목표 <span class="tag">학생 페이지에서 직접 쓴 목표</span></h2>'+((d.goals||[]).length?(d.goals||[]).map(g=>'<div class="row"><span class="d">'+String(g.due||'').slice(5).replace('-','/')+'</span> '+(g.status==='완료'?'✓ ':'')+esc(g.title)+' <span class="tag">'+esc(g.kind)+(g.status==='완료'?' · 완료':'')+'</span></div>').join(''):'<div class="row" style="color:#8a8577">아직 아이가 적은 목표가 없습니다 — 수업 전·후에 아이가 학생 페이지에 목표를 적으면 여기에 보입니다</div>')+'</div>';
 html+='<div class="card"><h2>최근 4주</h2><div class="kpis"><div class="kpi"><b>'+(a.present||0)+'</b><span>출석</span></div><div class="kpi"><b>'+(a.absent||0)+'</b><span>결석</span></div><div class="kpi"><b>'+(d.recent||[]).length+'</b><span>수업 기록</span></div></div>'+((d.recent||[]).length?(d.recent||[]).slice(0,5).map(r=>'<div class="row"><span class="d">'+String(r.date).slice(5)+'</span> '+esc(r.note||'(기록 없음)')+(r.hw?' <span class="tag">과제 '+esc(r.hw)+'</span>':'')+'</div>').join(''):'<div class="row" style="color:#8a8577">아직 이번 달 수업 기록이 없습니다</div>')+'</div>';
 html+='<div class="card"><h2>리포트</h2>'+((d.reports||[]).length?(d.reports||[]).map(r=>'<div class="row"><span class="d">'+String(r.issued||'').slice(0,10)+'</span> '+esc(r.type)+' <a class="btn" style="float:right;padding:3px 10px;font-size:12px" href="'+G+'rpt.html?id='+r.id+'&t='+r.t+'" target="_blank">열기</a></div>').join(''):'<div class="row" style="color:#8a8577">발송된 리포트가 아직 없습니다</div>')+'</div>';
 html+='<div class="card"><h2>다가올 시험</h2>'+((d.exams||[]).length?(d.exams||[]).slice(0,3).map(e=>'<div class="row"><span class="dd">D-'+e.dd+'</span> '+String(e.date).slice(5)+' '+esc(e.name||'')+'</div>').join(''):'<div class="row" style="color:#8a8577">등록된 시험 일정이 없습니다</div>')+'</div>';
 html+='<div class="card"><h2>수업 시간</h2>'+((d.schedule||[]).length?(d.schedule||[]).map(x=>'<div class="row">'+DAYS[x.dow%7]+' '+String(x.start||'').slice(0,5)+'~'+String(x.end||'').slice(0,5)+' <span class="d">'+esc(x.k||'')+'</span></div>').join(''):'<div class="row" style="color:#8a8577">—</div>')+'</div>';
 if((d.weak||[]).length)html+='<div class="card"><h2>지금 넘고 있는 과제</h2>'+(d.weak||[]).slice(0,3).map(w=>'<div class="row">'+w.rank+'. '+esc(w.label)+' <span class="d">오답 '+w.n+'</span></div>').join('')+'</div>';
 html+='<div class="card" id="inq"><h2>선생님께 문의</h2><div class="row" style="color:#8a8577">시간 변경·결석·상담 요청 등 — 보내면 담당 선생님 알림함에 바로 들어가고, 답변이 오면 여기에 표시됩니다</div><textarea id="inqT" rows="3" style="width:100%;padding:8px;border:1px solid #d8d4c8;border-radius:8px;font-family:inherit;font-size:14px;margin-top:6px" placeholder="예: 다음 주 화요일 수업을 목요일로 바꿀 수 있을까요?"></textarea><div style="margin-top:6px;display:flex;gap:8px;align-items:center"><button class="btn" id="inqB" style="padding:6px 14px">보내기</button><span id="inqR" class="m"></span></div>'+((d.inquiries||[]).length?'<div style="margin-top:8px">'+(d.inquiries||[]).map(q=>'<div class="row"><span class="d">'+String(q.at||'').slice(5,10)+'</span> '+esc(q.body)+(q.reply?'<div style="margin:3px 0 0 10px;color:#1E4D3B"><b>답변</b> '+esc(q.reply)+' <span class="d">'+String(q.replied_at||'').slice(5,10)+'</span></div>':'<span class="tag">'+esc(q.status==='대기'?'확인 대기':q.status)+'</span>')+'</div>').join('')+'</div>':'')+'</div>';
app.innerHTML=html;
/* [seq 330 · 2026-10-08] 이번 주 아이 기록 요약 + 응원 한 줄(한 주 한 줄, 고쳐 쓰면 바뀜) */
(async function(){try{var p=await (await fetch(U+'gz2_planner_get',{method:'POST',headers:H,body:JSON.stringify({p_sid:sid,p_k:k})})).json();if(!p||!p.ok)return;
 var W=p.week||[],Hb=p.habits||[],td=p.day,pass=0,tot=0;Hb.forEach(function(hb){W.forEach(function(w){if(w.day<=td){tot++;if(hb.checks&&hb.checks[w.day])pass++;}});});
 var u=p.up||{},nd=W.filter(function(w){return w.see;}).length;
 var c=document.createElement('div');c.className='card';c.innerHTML='<h2>이번 주 아이 기록 <span class="tag">아이가 손으로 쓴 기록</span></h2>'
  +'<div class="row">목표 '+esc(u.goal||'선생님과 정하는 중')+(u.milestone?' → 중간 목표 '+esc(u.milestone):'')+'</div>'
  +(function(){/* [seq 365 ③] 종이 플래너 사진 집계 */var P=p.paper||{},w=P.week,m=P.month,DWN=['','월','화','수','목','금','토','일'];
     var r='<div class="row">이번 주 기록 '+(w&&w.photos?(w.summary?'<b>'+esc(w.summary)+'</b>':'사진 '+w.photos+'장 · 집계 못 함(다시 찍기)')+' <span class="d">'+String(w.uploaded_at||'').slice(5,10).replace('-','/')+' 올림</span>':'<span class="d">아직 사진이 없어요 — 일요일 밤에 한 장 찍어 올려요</span>')+'</div>';
     if(w&&w.days)r+='<div class="row">'+w.days.map(function(x){return '<span style="display:inline-block;min-width:44px;text-align:center"><span class="d">'+DWN[x.dw]+'</span><br>'+(x.written?x.todo+'/'+x.written:'—')+'</span>';}).join('')+'</div>';
     if(m&&m.photos)r+='<div class="row">이번 달 기록 '+(m.summary?esc(m.summary):'집계 못 함')+'</div>';
     return r;})()
  +'<div class="row" style="margin-top:6px"><b>응원 한 줄</b> <span class="tag">아이 화면 「이번 주」에 떠요</span></div>'
  +'<div style="display:flex;gap:6px"><input id="chT" maxlength="120" style="flex:1;padding:7px;border:1px solid #ccc;border-radius:6px" placeholder="예: 이번 주도 매일 한 줄 쓴 것 멋져!" value="'+esc((p.cheer||{}).text||'')+'"><button id="chB" style="padding:7px 12px;border:0;border-radius:6px;background:#1E4D3B;color:#fff">보내기</button></div><div id="chR" style="font-size:12px;color:#1E4D3B;margin-top:4px">'+(p.cheer?'보냄 ✓':'')+'</div>';
 var first=app.querySelector('.card:nth-of-type(2)');app.insertBefore(c,first||null);
 document.getElementById('chB').onclick=async function(){var t=document.getElementById('chT').value.trim(),r=document.getElementById('chR');if(!t){r.textContent='한 줄을 적어 주세요';return;}this.disabled=true;
  try{var x=await (await fetch(U+'gz2_parent_cheer',{method:'POST',headers:H,body:JSON.stringify({p_sid:sid,p_k:k,p_text:t})})).json();r.textContent=x&&x.ok?'보냄 ✓ 아이 화면에 떠요':'보내지 못했어요';}catch(e){r.textContent='보내지 못했어요';}this.disabled=false;};
}catch(e){}})();
var ib=document.getElementById('inqB');if(ib)ib.onclick=async function(){var t=document.getElementById('inqT').value.trim();var r=document.getElementById('inqR');if(t.length<2){r.textContent='내용을 적어 주세요';return;}ib.disabled=true;try{var x=await fetch(U+'gz2_parent_inquiry',{method:'POST',headers:H,body:JSON.stringify({p_sid:sid,p_k:k,p_text:t})});var j=await x.json();if(j&&j.ok){r.textContent='보냈습니다 ✓ 담당 선생님이 확인 후 답변드립니다';document.getElementById('inqT').value='';}else{r.textContent='전송 실패: '+((j&&j.reason)||'');ib.disabled=false;}}catch(e){r.textContent='오류';ib.disabled=false;}};})();
</script></body></html>
