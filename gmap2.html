<div class="note" id="desc">국존 MAP 2.0 관문 v1.1 (2026-09-03) — 탭 14(4″ 첨삭 추가) = G-MAP 1.0 메가탭과 동일 배열. 각 탭은 Storage apps/의 2.0 파일을 fetch→srcdoc 적재(Storage는 HTML을 text/plain 강제). 호스팅 = GitHub Pages(myunsukim-cell.github.io/Gzone/gmap2.html). 로그인 관문 미완성 → 개방.</div>
<script>
const B='https://qcnsadcpsonuxnjyrlez.supabase.co/storage/v1/object/public/apps/';const fr=document.getElementById('fr');
async function open(f,btn){document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b===btn));document.getElementById('stamp').textContent='적재 중…';document.getElementById('desc').textContent=((btn&&btn.title)||'')+' · '+f;
 try{const t=await (await fetch(B+f+'?v='+Date.now(),{cache:'no-store'})).text();const dir=f.includes('/')?f.slice(0,f.lastIndexOf('/')+1):'';fr.srcdoc=t.replace(/<head[^>]*>/i,m=>m+'<base href="'+B+dir+'">');document.getElementById('stamp').textContent=new Date().toLocaleTimeString('ko-KR');}catch(e){fr.srcdoc='<p style="padding:20px">적재 실패: '+e+'</p>';}}
document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>open(b.dataset.f,b));
document.getElementById('role').onchange=e=>{const m={teacher:'orp2.html',director:'orp2_director.html',ceo:'orp2_director.html',student:'student_page.html'};const f=m[e.target.value];open(f,[...document.querySelectorAll('.tb')].find(b=>b.dataset.f===f)||null);};
open('orp2_director.html',[...document.querySelectorAll('.tb')].find(b=>b.dataset.f==='orp2_director.html'));
</script></body></html>
