<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>국존 학습 안내</title>
<style>
  :root{--ink:#1E4D3B;--gold:#B8892E;--line:#e2e8f1;--dim:#8a95a5}
  body{margin:0;background:#f6f7f9;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#16202c}
  .wrap{max-width:640px;margin:0 auto;padding:16px 12px 46px}
  .hd{display:flex;align-items:center;gap:10px;margin:4px 2px 12px}
  .hd .logo{background:var(--ink);color:#fff;font-weight:900;font-size:15px;border-radius:9px;padding:6px 12px;letter-spacing:1px}
  .hd .t{font-size:14px;font-weight:800;color:var(--ink)}
  .hd .t small{display:block;font-size:11.5px;color:var(--dim);font-weight:600;margin-top:1px}
  .weeks{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 10px}
  .wk{border:1px solid #dfe3e8;background:#fff;border-radius:18px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:600}
  .wk.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:800}
  .wk .tp{font-size:10.5px;opacity:.75;margin-right:4px}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:6px;overflow:hidden}
  .msg{padding:60px 10px;text-align:center;color:#666;font-size:15px;line-height:1.7}
  .stu{margin-top:14px;background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:15px 17px;display:flex;align-items:center;gap:12px}
  .stu .ic{font-size:22px}
  .stu .tx{flex:1;font-size:13.5px;line-height:1.55;color:#3c4a58}
  .stu .tx b{color:var(--ink)}
  .stu a{background:var(--ink);color:#fff;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:800;text-decoration:none;white-space:nowrap}
  .foot{text-align:center;color:var(--dim);font-size:11.5px;margin-top:16px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="logo">국존</div>
    <div class="t">학습 안내<small id="who">국존 국어전문학원</small></div>
  </div>
  <div class="weeks" id="weeks"></div>
  <div class="card" id="box"><div class="msg">안내문을 불러오는 중입니다…</div></div>
  <div class="stu" id="stu" style="display:none">
    <div class="ic">📖</div>
    <div class="tx"><b>학생 페이지</b>에서 같은 진도표를 아이도 봅니다.<br>수업마다 채워지는 칸을 함께 확인해 보세요.</div>
    <a id="stuLink" href="#" target="_blank" rel="noopener">학생 페이지 열람하기</a>
  </div>
  <div class="foot">국존 국어전문학원 · 이 안내는 담당 선생님 확인 후 발송되었습니다.<br>문의는 학원으로 연락해 주세요.</div>
</div>
<script>
(function(){
  var PK='sb_publishable_stx8spRryf_4OWMFsW29Rw_XiDNfyb0';
  var U='https://qcnsadcpsonuxnjyrlez.supabase.co/rest/v1/rpc/gz_view_report2';
  var STU='https://myunsukim-cell.github.io/Gzone/student.html';
  var TYPE_LB={'주간':'주간','월례평가안내':'월례'};
  var qs=new URLSearchParams(location.search);
  var P=window.__GZ_PARAMS||{};
  var id=parseInt(P.id||qs.get('id'),10), t=P.t||qs.get('t')||'';
  var box=document.getElementById('box'), wk=document.getElementById('weeks');
  var stu=document.getElementById('stu'), who=document.getElementById('who');
  function fail(m){box.innerHTML='<div class="msg">'+m+'</div>';}
  function load(pid,pt){
    fetch(U,{method:'POST',headers:{'apikey':PK,'Authorization':'Bearer '+PK,'Content-Type':'application/json'},
      body:JSON.stringify({p_id:pid,p_t:pt})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d){fail('안내문을 찾을 수 없습니다.<br>링크가 만료되었거나 잘못되었습니다.');return;}
      box.innerHTML=d.html;
      if(d.student_name)who.textContent=d.student_name+' 학생 · 국존 국어전문학원';
      stu.style.display='flex';
      document.getElementById('stuLink').href=STU;
      var hist=d.history||[];
      if(hist.length>1){
        wk.innerHTML='';
        hist.forEach(function(h){
          var b=document.createElement('button');
          b.className='wk'+(h.id===pid?' on':'');
          var tp=h.type?('<span class="tp">'+(TYPE_LB[h.type]||h.type)+'</span>'):'';
          b.innerHTML=tp+(h.label||'안내');
          b.onclick=function(){load(h.id,h.tk);};
          wk.appendChild(b);
        });
      }
      window.scrollTo(0,0);
    })
    .catch(function(){fail('일시적인 오류입니다.<br>잠시 후 다시 열어 주세요.');});
  }
  if(!id||!t){fail('올바르지 않은 링크입니다.<br>학원으로 문의해 주세요.');return;}
  load(id,t);
})();
</script>
</body>
</html>
