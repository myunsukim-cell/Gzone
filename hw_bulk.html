<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>국존 일괄 검수</title>
<style>
:root{--ink:#1a1a1a;--line:#d6dee6;--head:#1a3a5c;--ok:#1e7a4a;--warn:#c8801a;--bg:#f6f8fa}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--head);color:#fff;padding:9px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:30}
header b{font-size:15px}.sp{flex:1}
header input,header select{font-size:13px;padding:4px 7px;border:1px solid #446;border-radius:5px}
.stat{background:#ffffff22;border-radius:10px;padding:3px 9px;font-size:12px}
.bulkbar{position:sticky;top:44px;z-index:25;background:#fff;border-bottom:1px solid var(--line);padding:7px 14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
button{font-family:inherit;font-size:13px;padding:6px 13px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
button.p{background:var(--head);color:#fff;border-color:var(--head);font-weight:700}
button.g{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
button.s{padding:3px 9px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
.msg{font-size:12px;color:#556}
.grp{margin:12px 14px;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.gh{background:#eef2f6;padding:7px 11px;display:flex;gap:9px;align-items:center;font-size:13px;border-bottom:1px solid var(--line)}
.gh b{font-size:14px}
.tag{border:1px solid var(--line);border-radius:9px;padding:0 7px;font-size:11px;color:#667}
.tag.w{border-color:var(--warn);color:var(--warn)}
.row{display:block;padding:12px 14px 14px;border-bottom:1px solid #e8edf2}
.row .crop{max-width:1100px}
.row:last-child{border-bottom:0}
.row.done{background:#f3faf6}
.row.done .crop{opacity:.55}
.row.idt{background:#fff6e5}
.row.cur{box-shadow:inset 4px 0 0 var(--head)}
.crop{position:relative;width:100%;overflow:hidden;border:0;outline:1px solid var(--line);border-radius:6px;background:#eef1f4;cursor:zoom-in;min-height:60px}
.crop img{position:absolute;max-width:none;user-select:none;pointer-events:none}
.crop .ln{position:absolute;left:0;right:0;border-top:2px solid #c8801acc;border-bottom:2px solid #c8801acc;background:#ffd76a26;pointer-events:none}
.crop .gb{position:absolute;border:2px solid #d8342c;border-radius:3px;pointer-events:none}
.crop .adj{position:absolute;left:6px;bottom:6px;font-size:11.5px;background:#1a3a5cdd;color:#fff;border-radius:4px;padding:2px 7px}
.crop .adj.b{background:#c8801a}
.crop .seen{position:absolute;right:6px;top:6px;font-size:11px;background:#1e7a4a;color:#fff;border-radius:4px;padding:1px 6px;display:none}
.row.seen .crop .seen{display:block}
.crop.none{display:flex;align-items:center;justify-content:center;font-size:12px;color:#a55;cursor:pointer;background:#fff4f4;border-color:#e0b0b0;text-align:center;height:80px}
.side{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:8px 18px;margin-top:10px;align-items:start;max-width:1100px}
.side .ctx{grid-column:1;grid-row:1 / span 2}
.side .ai,.side>div[id^=a]{grid-column:2}
.ctx .u{color:#a0a8b2}
.ctx mark{background:#ffe08a;font-weight:800;font-size:21px;padding:1px 5px;border-radius:3px;outline:2px solid #d8342c}
.ctx{line-height:1.85;font-size:18px}
.ctx b{background:#ffe08a;padding:1px 4px;border-radius:3px;font-weight:700}
.ai{font-size:13px;color:#667}
.ai b{font-size:22px;color:var(--ink);margin-left:4px}
.act{display:flex;gap:6px}
.act input{flex:1;min-width:0;font-size:22px;font-weight:600;padding:8px 10px;border:1px solid var(--line);border-radius:6px}
.act input.ch{border-color:var(--warn);background:#fffdf5}
.act button{white-space:nowrap;font-weight:700;font-size:15px;padding:0 16px}
.act button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.act button.fx{background:var(--warn);color:#fff;border-color:var(--warn)}
.keys{font-size:11px;color:#8a94a0}
@media (max-width:760px){.side{grid-template-columns:1fr}.side .ctx,.side .ai,.side>div[id^=a]{grid-column:1;grid-row:auto}}
.done-b{color:var(--ok);font-size:12px;font-weight:700}
.big{position:fixed;inset:0;background:#000d;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px}
.big .hint{color:#fff;font-size:13px;margin-bottom:8px}
.big .wrap{position:relative;max-width:96vw;max-height:84vh;overflow:auto;background:#fff;cursor:crosshair}
.big img{display:block;max-width:none;user-select:none}
.big .box{position:absolute;border:2px solid #e33;background:#e3333322;pointer-events:none}
.big .ctl{margin-top:8px;display:flex;gap:8px}
</style>
</head>
<body>
<header>
  <b>국존 일괄 검수</b>
  <select id="filt"><option value="pending">대기만</option><option value="all">전체</option><option value="done">완료</option></select>
  <span class="sp"></span>
  <span class="stat" id="stat">불러오는 중…</span>
  <input id="who" placeholder="검수자 이름" style="width:110px">
</header>
<div class="bulkbar">
  <button class="g" id="allok" disabled>본 항목 「맞음」 저장</button>
  <button class="p" id="saveEdited">고친 것만 저장</button>
  <button id="pickstart" style="border-color:var(--warn);color:var(--warn);font-weight:700">위치 찍기 연속 시작</button>
  <span class="msg" id="note">원본을 보고 맞으면 Enter, 틀리면 고쳐 쓰고 Enter. 화면에 1초 이상 보인 항목만 일괄 저장됩니다.</span>
</div>
<div id="body"></div>

<div class="big" id="big">
  <div class="hint" id="bighint"></div>
  <div class="wrap" id="bigwrap"><img id="bigimg"><div class="box" id="bigbox"></div></div>
  <div class="ctl"><button class="g" id="bignext" style="display:none">저장 후 다음 →</button><button id="bigsave" style="display:none">저장만</button><button onclick="closeBig()">닫기</button><span class="msg" id="bigcnt" style="color:#ddd;align-self:center"></span></div>
</div>

<script>
const URL_="https://qcnsadcpsonuxnjyrlez.supabase.co";
const KEY="sb_publishable_stx8spRryf_4OWMFsW29Rw_XiDNfyb0";
const H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
let ITEMS=[],IMG={},DIM={},RAW={},PICK=null,DRAG=null;
async function rest(p){const r=await fetch(URL_+"/rest/v1/"+p,{headers:H});if(!r.ok)throw new Error(await r.text());return r.json();}
async function rpc(f,b){const r=await fetch(URL_+"/rest/v1/rpc/"+f,{method:"POST",headers:H,body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());return r.json();}
const esc=s=>(s||"").replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function note(t){document.getElementById("note").textContent=t;}
function who(){const w=document.getElementById("who").value.trim();if(!w){alert("검수자 이름을 입력하세요.");return null;}return w;}

async function load(){
  ITEMS=await rest("v_hw_unc_all?select=*&order=student_name,seq");
  try{(await rest("v_hw_review_queue?select=id,htr_raw")).forEach(r=>RAW[r.id]=r.htr_raw||"");}catch(e){}
  paint();
  for(const p of [...new Set(ITEMS.map(i=>i.img_path).filter(Boolean))]){
    try{const s=await rpc("gz_hw_sign_read",{p_bucket:"klean-students",p_path:p,p_expires:7200});
      IMG[p]=s.url;const im=new Image();im.onload=()=>{DIM[p]={w:im.naturalWidth,h:im.naturalHeight};repaintCrops(p);};im.src=s.url;
    }catch(e){}
  }
}
const SEEN=new Set();let OBS=null;
const isBand=it=>it.bbox&&(it.bbox.src==='band'||it.bbox.src==='header');
function cropBox(it){ // 원고지 반면 폭 × 위아래 2행 — 사람도 문맥으로 읽는다
  const b=it.bbox;
  if(b.src==='header'||(it.item_type&&it.item_type!=='glyph')){const w=Math.max(b.w*3,0.3),h=Math.max(b.h*2.6,0.08);
    return {x:Math.min(Math.max(0,b.x+b.w/2-w/2),1-w),y:Math.min(Math.max(0,b.y+b.h/2-h/2),1-h),w,h};}
  const L=(b.x+b.w/2)<0.5,x=L?0.035:0.505,w=0.48;
  const rh=Math.min(Math.max(b.h,0.026),0.034),y=Math.max(0,b.y-rh*2.2),h=Math.min(1-y,b.h+rh*4.4);
  return {x,y,w,h};
}
function ctxHTML(it){ // 답안 전문에서 앞뒤 문장까지
  const raw=RAW[it.feedback_id]||"",g=it.guess||"",key="["+g+"?]";
  let k=-1,p=raw.indexOf(key);const cb=(it.ctx_before||"").replace(/\s+$/,"").slice(-6);
  while(p>=0){if(k<0)k=p;if(cb&&raw.slice(Math.max(0,p-40),p).replace(/\[([^\]]*)\?\]/g,"$1").includes(cb)){k=p;break;}p=raw.indexOf(key,p+1);}
  if(k<0) return `${esc((it.ctx_before||"").slice(-22))}<mark>${esc(g||"□")}</mark>${esc((it.ctx_after||"").slice(0,22))}`;
  const clean=t=>esc(t.replace(/\[([^\]]*)\?\]/g,"$1").replace(/\n/g," "));
  let a=Math.max(0,k-110),b=Math.min(raw.length,k+key.length+110);
  const s0=raw.lastIndexOf(". ",k-60);if(s0>a)a=s0+2;const s1=raw.indexOf(".",k+key.length+40);if(s1>0&&s1<b)b=s1+1;
  return `${a>0?'<span class="u">…</span>':''}${clean(raw.slice(a,k))}<mark>${esc(g||"□")}</mark>${clean(raw.slice(k+key.length,b))}${b<raw.length?'<span class="u">…</span>':''}`;
}
function cropHTML(it){
  const u=IMG[it.img_path],d=DIM[it.img_path];
  if(!it.bbox) return null;
  if(!u||!d) return `<span class="adj">원본 불러오는 중…</span>`;
  const v=cropBox(it),b=it.bbox,pct=n=>(n*100).toFixed(3)+'%';
  let h=`<img src="${u}" alt="" style="width:${pct(1/v.w)};left:0;top:0;transform:translate(${pct(-v.x)},${pct(-v.y)})">`;
  if(isBand(it)&&b.src==='band'){ // ±3행 밴드: 가운데 1행이 추정 위치
    h+=`<div class="ln" style="top:${pct(3/7)};height:${pct(1/7)}"></div><span class="adj b">위치가 대략입니다 · 눌러서 정확히</span>`;
  }else if(isBand(it)){h+=`<span class="adj b">위치가 대략입니다 · 눌러서 정확히</span>`;}
  else{h+=`<div class="gb" style="left:${pct((b.x-v.x)/v.w)};top:${pct((b.y-v.y)/v.h)};width:${pct(b.w/v.w)};height:${pct(b.h/v.h)}"></div><span class="adj">위치 조정</span>`;}
  return h+`<span class="seen">봤음</span>`;
}
function cropAttr(it){
  const d=DIM[it.img_path];if(!it.bbox)return '';
  const v=cropBox(it);
  return d?`style="aspect-ratio:${(v.w*d.w).toFixed(1)}/${(v.h*d.h).toFixed(1)};max-height:420px"`:'style="height:160px"';
}
function repaintCrops(p){ITEMS.forEach(i=>{if(p&&i.img_path!==p)return;const el=document.getElementById("c"+i.id);if(!el||!i.bbox)return;
  const at=cropAttr(i).match(/style="([^"]*)"/);el.setAttribute("style",at?at[1]:"");el.className="crop";el.innerHTML=cropHTML(i);});
  observe();}
function observe(){
  if(OBS)OBS.disconnect();
  const T={};
  OBS=new IntersectionObserver(es=>es.forEach(e=>{const id=+e.target.dataset.id,it=ITEMS.find(x=>x.id===id);
    if(e.isIntersecting&&it&&DIM[it.img_path]){T[id]=setTimeout(()=>{markSeen(id);},1000);}else{clearTimeout(T[id]);}}),{threshold:0.6});
  document.querySelectorAll(".crop[data-id]").forEach(el=>{if(!SEEN.has(+el.dataset.id))OBS.observe(el);});
}
function markSeen(id){if(SEEN.has(id))return;SEEN.add(id);const r=document.getElementById("r"+id);if(r)r.classList.add("seen");stat();}
function visRows(){const f=document.getElementById("filt").value;return ITEMS.filter(i=>f==="all"?1:f==="done"?i.status!=="pending":i.status==="pending");}
function actHTML(i){
  if(i.status!=='pending') return `<div class="done-b">완료 · ${esc(i.fix||"")} · ${esc(i.reviewed_by||"")}</div>`;
  return `<div class="act"><input id="f${i.id}" value="${esc(i.fix||i.guess||"")}" data-o="${esc(i.guess||"")}" oninput="chg(${i.id})" onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();one(${i.id},true);}" onfocus="cur(${i.id})"><button class="ok" id="b${i.id}" onclick="one(${i.id},true)">맞음</button></div>`;
}
function chg(id){const el=document.getElementById("f"+id),b=document.getElementById("b"+id);const c=el.value.trim()!==el.dataset.o;
  el.classList.toggle("ch",c);b.textContent=c?"고쳐 저장":"맞음";b.className=c?"fx":"ok";}
function cur(id){document.querySelectorAll(".row.cur").forEach(r=>r.classList.remove("cur"));const r=document.getElementById("r"+id);if(r){r.classList.add("cur");markSeen(id);}}
function paint(){
  const rows=visRows();
  const by=new Map();rows.forEach(i=>{if(!by.has(i.feedback_id))by.set(i.feedback_id,[]);by.get(i.feedback_id).push(i);});
  document.getElementById("body").innerHTML=[...by.values()].map(g=>{
    const h=g[0],tr=(h.traits||[]).map(t=>`<span class="tag w">${esc(t)}</span>`).join("");
    return `<div class="grp"><div class="gh"><b>${esc(h.student_name)}</b><span class="tag">${g.length}건</span>${tr}<span class="sp"></span>
      <button class="s" onclick="grpOk(${h.feedback_id})">이 학생 본 항목 「맞음」</button></div>`+
      g.map(i=>{const c=cropHTML(i);
        return `<div class="row ${i.status!=='pending'?'done':''} ${i.item_type!=='glyph'?'idt':''} ${SEEN.has(i.id)?'seen':''}" id="r${i.id}">
        <div id="c${i.id}" data-id="${i.id}" class="crop ${i.bbox?'':'none'}" ${cropAttr(i)} onclick="openBig(${i.id})">${c!==null?c:'위치 없음<br>눌러서 원본에서 찍기'}</div>
        <div class="side">
          <div class="ctx">${ctxHTML(i)}${i.item_type!=='glyph'?' <span class="tag w">본인 확인</span>':''}</div>
          <div class="ai">AI 판독 <b>${esc(i.guess||"□")}</b></div>
          <div id="a${i.id}">${actHTML(i)}</div>
        </div>
      </div>`;}).join("")+`</div>`;
  }).join("")||'<div class="grp"><div class="row">해당 항목 없음</div></div>';
  observe();stat();
}
function stat(){
  const p=ITEMS.filter(i=>i.status==="pending"),sp=p.filter(i=>SEEN.has(i.id)).length;
  const ap=ITEMS.filter(i=>i.status==="pending"&&needPick(i)).length;
  document.getElementById("stat").textContent=`대기 ${p.length} / 전체 ${ITEMS.length} · 봤음 ${sp} · 위치 대략 ${ap}`;
  const b=document.getElementById("allok");b.disabled=!sp;b.textContent=`본 항목 ${sp}건 「맞음」 저장`;
}
function openBig(id){
  const it=ITEMS.find(x=>x.id===id);if(!it||!IMG[it.img_path])return;
  PICK=it;markSeen(it.id);const img=document.getElementById("bigimg");img.src=IMG[it.img_path];
  const d=DIM[it.img_path];let sc=Math.min(1,(window.innerWidth*0.94)/(d?d.w:2000));
  if(it.bbox&&d&&(it.bbox.src==='band'||it.bbox.src==='header')) sc=Math.min(2.2,(window.innerWidth*0.92)/(it.bbox.w*d.w));
  img.style.width=(d?d.w*sc:2000)+"px";
  img.onload=()=>{if(it.bbox&&d){wrap.scrollTop=Math.max(0,it.bbox.y*d.h*sc-40);wrap.scrollLeft=Math.max(0,it.bbox.x*d.w*sc-20);}};
  const bx=document.getElementById("bigbox");
  if(it.bbox&&d){bx.style.display="block";bx.style.left=(it.bbox.x*d.w*sc)+"px";bx.style.top=(it.bbox.y*d.h*sc)+"px";bx.style.width=(it.bbox.w*d.w*sc)+"px";bx.style.height=(it.bbox.h*d.h*sc)+"px";}
  else bx.style.display="none";
  document.getElementById("bighint").textContent=`${it.student_name} · 「${it.guess||"□"}」 — 원본에서 이 글자를 드래그해 네모로 감싸세요 (문맥: …${(it.ctx_before||"").slice(-10)}[${it.guess}]${(it.ctx_after||"").slice(0,10)}…)`;
  document.getElementById("bigsave").style.display="none";document.getElementById("bignext").style.display="none";
  const left=ITEMS.filter(i=>i.status==="pending"&&needPick(i)).length;
  document.getElementById("bigcnt").textContent=`위치 미확정 ${left}건 남음`;
  document.getElementById("big").style.display="flex";
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeBig();});
function closeBig(){document.getElementById("big").style.display="none";PICK=null;DRAG=null;}
const wrap=document.getElementById("bigwrap");
function pos(e){const r=document.getElementById("bigimg").getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
wrap.addEventListener("mousedown",e=>{if(!PICK)return;DRAG=pos(e);e.preventDefault();});
wrap.addEventListener("mousemove",e=>{if(!DRAG)return;const p=pos(e),bx=document.getElementById("bigbox");
  bx.style.display="block";bx.style.left=Math.min(DRAG.x,p.x)+"px";bx.style.top=Math.min(DRAG.y,p.y)+"px";bx.style.width=Math.abs(p.x-DRAG.x)+"px";bx.style.height=Math.abs(p.y-DRAG.y)+"px";});
wrap.addEventListener("mouseup",e=>{if(!DRAG)return;const img=document.getElementById("bigimg"),bx=document.getElementById("bigbox");
  const W=img.clientWidth,Hh=img.clientHeight;
  const nb={x:+(parseFloat(bx.style.left)/W).toFixed(4),y:+(parseFloat(bx.style.top)/Hh).toFixed(4),w:+(parseFloat(bx.style.width)/W).toFixed(4),h:+(parseFloat(bx.style.height)/Hh).toFixed(4)};
  DRAG=null;if(nb.w<0.003||nb.h<0.003)return;
  PICK._nb=nb;document.getElementById("bigsave").style.display="inline-block";document.getElementById("bignext").style.display="inline-block";});
function needPick(i){return !i.bbox||i.bbox.src==='band'||i.bbox.src==='header';}
async function saveBox(){
  const w=who();if(!w||!PICK||!PICK._nb)return false;
  try{const r=await rpc("gz_hw_set_bbox",{p_id:PICK.id,p_bbox:PICK._nb,p_by:w});
    if(r.ok){PICK.bbox={...PICK._nb,by:w,src:'grid'};note(`위치 저장 — ${PICK.student_name} 「${PICK.guess}」`);return true;}
    note("실패: "+r.reason);}catch(e){note("오류: "+e.message.slice(0,80));}
  return false;
}
document.getElementById("bigsave").onclick=async()=>{if(await saveBox()){closeBig();paint();repaintCrops();}};
document.getElementById("bignext").onclick=async()=>{
  if(!(await saveBox()))return;
  const f=document.getElementById("filt").value;
  const vis=ITEMS.filter(i=>(f==="all"?1:f==="done"?i.status!=="pending":i.status==="pending")&&needPick(i)&&i.id!==PICK.id);
  paint();repaintCrops();
  if(vis.length){openBig(vis[0].id);}else{closeBig();note("위치 찍을 항목이 더 없습니다.");}
};

function mark(it,by){it.status="confirmed";it.reviewed_by=by;}
function doneRow(it){const r=document.getElementById("r"+it.id);if(!r)return;r.classList.add("done");r.classList.remove("cur");
  const a=document.getElementById("a"+it.id);if(a)a.innerHTML=actHTML(it);}
function nextPending(id){const v=visRows().filter(i=>i.status==="pending");const k=v.findIndex(i=>i.id===id);
  return v.slice(k+1).concat(v.slice(0,Math.max(k,0))).find(i=>i.id!==id);}
async function one(id,adv){const w=who();if(!w)return;const it=ITEMS.find(x=>x.id===id);const fix=document.getElementById("f"+id).value.trim();
  if(!fix){alert("글자를 입력하세요.");return;}
  markSeen(id);
  try{const r=await rpc("gz_hw_confirm",{p_id:id,p_fix:fix,p_by:w});
    if(r.ok){mark(it,w);it.fix=fix;doneRow(it);stat();note(`저장 — ${it.guess||"□"} → ${fix}`);
      if(adv){const n=nextPending(id);if(n){const el=document.getElementById("f"+n.id);if(el){document.getElementById("r"+n.id).scrollIntoView({block:"center",behavior:"smooth"});el.focus({preventScroll:true});el.select();}}}
    }else note("실패: "+(r.err||r.reason||""));
  }catch(e){note("오류: "+e.message.slice(0,80));}}
async function bulk(list){const w=who();if(!w)return;if(!list.length){note("저장할 항목이 없습니다.");return;}note(`저장 중… ${list.length}건`);
  try{const r=await rpc("gz_hw_confirm_bulk",{p_items:list.map(x=>({id:x.id,fix:x.fix})),p_by:w});
    list.forEach(x=>{const it=ITEMS.find(y=>y.id===x.id);if(it){mark(it,w);it.fix=x.fix;doneRow(it);}});
    stat();note(`저장 완료 — ${r.done}건${r.fail?` · 실패 ${r.fail}`:""}`);
  }catch(e){note("오류: "+e.message.slice(0,90));}}
function collect(fid){ // 화면에서 실제로 본 대기 항목만
  return ITEMS.filter(i=>i.status==="pending"&&SEEN.has(i.id)&&(!fid||i.feedback_id===fid))
  .map(i=>({id:i.id,fix:(document.getElementById("f"+i.id)||{}).value?.trim()||i.guess||""})).filter(x=>x.fix);}
function grpOk(fid){const all=ITEMS.filter(i=>i.status==="pending"&&i.feedback_id===fid).length,l=collect(fid);
  if(l.length<all)note(`안 본 ${all-l.length}건은 제외했습니다. 원본을 보고 다시 누르세요.`);bulk(l);}
document.getElementById("allok").onclick=()=>{const n=ITEMS.filter(i=>i.status==="pending").length,l=collect(null);
  if(!confirm(`본 항목 ${l.length}건을 칸에 있는 값으로 저장합니다.${n-l.length?`\n안 본 ${n-l.length}건은 저장하지 않습니다.`:""}`))return;bulk(l);};
document.getElementById("saveEdited").onclick=()=>{bulk(ITEMS.filter(i=>i.status==="pending").map(i=>{const el=document.getElementById("f"+i.id);if(!el)return null;const v=el.value.trim();return(v&&v!==(i.guess||""))?{id:i.id,fix:v}:null;}).filter(Boolean));};
document.getElementById("pickstart").onclick=()=>{const t=ITEMS.find(i=>i.status==="pending"&&needPick(i));if(t)openBig(t.id);else note("위치 찍을 항목이 없습니다.");};
document.getElementById("filt").addEventListener("change",()=>{paint();repaintCrops();});
load().catch(e=>document.getElementById("stat").textContent="불러오기 실패: "+e.message.slice(0,60));
</script>
