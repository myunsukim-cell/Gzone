<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학생·학부모 링크 발급표</title>
<style>:root{--deep:#1E4D3B;--gold:#B8892E;--line:#d8d4c8;--dim:#8a8577;--band:#f4f8f5}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f7f6f2;color:#1f2a24;font-size:12.5px;padding:12px 14px}
h1{font-size:16px;color:var(--deep)}.sub{font-size:11.5px;color:var(--dim);margin:2px 0 10px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.bar select,.bar input{padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-family:inherit}
table{width:100%;border-collapse:collapse;background:#fff}th,td{border-bottom:1px solid #eee;padding:6px 8px;text-align:left;vertical-align:middle}th{background:#efede6;font-size:11px}
.btn{background:var(--deep);color:#fff;border:0;border-radius:5px;padding:4px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}.btn.o{background:#fff;color:var(--deep);border:1.5px solid var(--deep)}.btn.g{background:#eee;color:#999;border:0;cursor:default}
.lk{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--dim)}.kpis{display:flex;gap:8px;margin-bottom:8px}.kpi{background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 10px;min-width:100px}.kpi b{display:block;font-size:16px;color:var(--deep)}.kpi span{font-size:10.5px;color:var(--dim)}
</style></head><body>
<h1>학생·학부모 링크 발급표</h1><div class="sub">학생 링크 = gmap2_student.html?sid&k (서버 검증 토큰, 학생 본인 페이지) · 학부모 링크 = parent_home.html?sid&k (학부모 정문: 자녀 현황·리포트 목록·시험·시간 — 리포트는 정문 안에서 열림) · 「복사」 후 카톡·문자로 발송 · 원천 gz2_link_table</div>
<div class="bar">담당 교사 <select id="fT"><option value="">전체</option></select> 지점 <select id="fD"><option value="">전체</option></select> 학생 <input id="fN" placeholder="이름"> <span id="cnt" class="sub"></span><button class="btn o" style="margin-left:auto" onclick="copyAll()">보이는 행 전체 복사(이름·학생 링크·학부모 링크)</button> <button class="btn o" onclick="copyMsgAll()">보이는 행 학부모 문안 전체 복사</button></div>
<div class="kpis" id="kpis"></div>
<table><thead><tr><th>학생</th><th>담당</th><th>학생 링크</th><th>학부모 링크(정문)</th><th>안내 문안</th></tr></thead><tbody id="tb"><tr><td colspan="5" style="color:var(--dim)">적재 중…</td></tr></tbody></table>
<script>
const U='https://qcnsadcpsonuxnjyrlez.supabase.co/rest/v1/rpc/',K='sb_publishable_stx8spRryf_4OWMFsW29Rw_XiDNfyb0',H={apikey:K,get Authorization(){return 'Bearer '+(gzJwt()||K);},'Content-Type':'application/json'};function gzJwt(){var w=window;for(var i=0;i<6;i++){try{if(w.__GZ_JWT)return w.__GZ_JWT;var s=JSON.parse(w.sessionStorage.getItem('gz_session')||'null');if(s&&s.jwt)return s.jwt;}catch(_){}if(!w.parent||w.parent===w)break;w=w.parent;}return null;} /* [2026-10-02] 관문 로그인 토큰 전달 — 9/30 anon 회수 후 401 해소(journey_live와 같은 방식) */const G='https://myunsukim-cell.github.io/Gzone/';let ALL=[];const $=id=>document.getElementById(id);function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const stuLink=x=>G+'gmap2_student.html?sid='+x.sid+'&k='+x.stu_k;const parLink=x=>G+'parent_home.html?sid='+x.sid+'&k='+x.stu_k;const rptLink=x=>x.rpt_id?G+'rpt.html?id='+x.rpt_id+'&t='+x.rpt_t:null;
async function load(){const r=await fetch(U+'gz2_link_table',{method:'POST',headers:H,body:'{}'});ALL=await r.json();const ts=[...new Set(ALL.map(x=>x.teacher).filter(Boolean))].sort(),ds=[...new Set(ALL.map(x=>x.division).filter(Boolean))];$('fT').innerHTML='<option value="">전체</option>'+ts.map(t=>'<option>'+esc(t)+'</option>').join('');$('fD').innerHTML='<option value="">전체</option>'+ds.map(t=>'<option>'+esc(t)+'</option>').join('');render();}
function rows(){const t=$('fT').value,d=$('fD').value,n=$('fN').value.trim();return ALL.filter(x=>(!t||x.teacher===t)&&(!d||x.division===d)&&(!n||(x.name||'').includes(n)));}
function render(){const rs=rows();$('cnt').textContent='표시 '+rs.length+' / 재원 '+ALL.length;$('kpis').innerHTML=[[ALL.length,'재원 학생(학생 링크 전원)'],[ALL.length,'학부모 링크(정문, 전원)'],[ALL.filter(x=>x.rpt_id).length,'발송 가능 리포트 있음']].map(x=>'<div class="kpi"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('');
 $('tb').innerHTML=rs.map(x=>'<tr><td><b>'+esc(x.name)+'</b> <span class="lk">'+esc(x.grade||'')+' '+esc(x.school||'')+' · '+esc(x.division||'')+'</span></td><td>'+esc(x.teacher||'—')+'</td><td><button class="btn" onclick="cp(this,\''+stuLink(x)+'\')">복사</button> <a class="lk" href="'+stuLink(x)+'" target="_blank">열기 ↗</a></td><td><button class="btn" onclick="cp(this,\''+parLink(x)+'\')">복사</button> <a class="lk" href="'+parLink(x)+'" target="_blank">열기 ↗</a> <span class="lk">'+(x.rpt_id?esc(x.rpt_status)+' '+String(x.rpt_issued||'').slice(5):'리포트 없음')+'</span></td><td><button class="btn" onclick="cpMsg(this,'+x.sid+',\'s\')">학생 문안</button> <button class="btn" onclick="cpMsg(this,'+x.sid+',\'p\')">학부모 문안</button></td></tr>').join('');}
function cp(b,t){navigator.clipboard.writeText(t).then(()=>{b.textContent='복사됨';setTimeout(()=>b.textContent='복사',1500);});}
function copyAll(){const rs=rows();const t=rs.map(x=>x.name+'\t'+stuLink(x)+'\t'+(parLink(x)||'')).join('\n');navigator.clipboard.writeText(t).then(()=>alert(rs.length+'행 복사'));}
['fT','fD'].forEach(i=>$(i).onchange=render);$('fN').oninput=render;load();

/* [2026-10-04] 안내 문안 — 학생·학부모용, 링크 채워 복사 (국존 지시: 학부모가 자녀 입장 링크도 알게) */
function msgStu(x){return '안녕하세요, '+x.name+'! 국존에 온 걸 환영해요.\n아래 링크가 '+x.name+'의 국존 학습 페이지예요. 누르면 로그인 없이 바로 열려요.\n'+stuLink(x)+'\n\n1. 링크를 열고 휴대폰 「홈 화면에 추가」를 해 두세요. 앱처럼 쓸 수 있어요.\n2. 수업 전에 「오늘 꼭 해결할 목표」 하나를 적어요. 선생님 화면에 바로 보여요.\n3. 수업 후에는 「다음 주 목표」를 적고, 할 일을 마치면 「다 했어요」를 눌러요.\n\n이 링크는 '+x.name+' 전용이에요. 친구에게 보내지 마세요.';}
function msgPar(x){return '안녕하세요, 국존입니다. '+x.name+' 학부모님께 G-MAP 2.0 안내드립니다.\n\n■ 학부모님 페이지 — 자녀의 수업·시험 범위·리포트·학습 시간을 보실 수 있습니다.\n'+parLink(x)+'\n\n■ 자녀 학습 페이지 — '+x.name+' 학생이 직접 쓰는 페이지입니다. 학부모님도 알고 계시면 아이가 링크를 잃어버렸을 때 다시 보내 주실 수 있고, 아이가 세운 목표와 「다 했어요」 기록을 함께 보실 수 있습니다.\n'+stuLink(x)+'\n\n두 링크 모두 휴대폰 「홈 화면에 추가」를 권해 드립니다. 링크는 '+x.name+' 학생 가족 전용이니 다른 분께 전달하지 말아 주세요. 잃어버리시면 학원에 말씀해 주시면 다시 보내 드립니다.';}
function cpMsg(b,sid,kind){const x=ALL.find(r=>r.sid===sid);if(!x)return;const old=b.textContent;navigator.clipboard.writeText(kind==='s'?msgStu(x):msgPar(x)).then(()=>{b.textContent='복사됨';setTimeout(()=>b.textContent=old,1500);});}
function copyMsgAll(){const rs=rows();const t=rs.map(x=>'【'+x.name+'】\n'+msgPar(x)).join('\n\n────────\n\n');navigator.clipboard.writeText(t).then(()=>alert(rs.length+'명 학부모 문안 복사'));}
</script></body></html>
