<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>국존 — 상담 안내</title>
<!-- consult_entry v0.3 (P0+P1+P2) 2026-09-06 — 토큰 1개로 A 자료집(P2)·B 원서+설문(P1) 전환. 정본 문장 #5990. -->
<style>:root{--deep:#1E4D3B;--gold:#e8b93c;--line:#d8d4c8;--dim:#8a8577}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f7f6f2;color:#1f2a24;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px}.hd{font-weight:900;font-size:20px;color:var(--deep)}.hd span{color:var(--gold)}.m{color:var(--dim);font-size:12.5px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}.card h2{font-size:15px;margin-bottom:6px}
.btn{display:block;width:100%;padding:12px;background:var(--deep);color:#fff;border:0;border-radius:10px;font-weight:800;font-size:15px;text-align:center;text-decoration:none;cursor:pointer}
.st{display:inline-block;border:1px solid var(--deep);color:var(--deep);border-radius:12px;padding:1px 10px;font-size:12px;font-weight:700}.card input,.card select,.card textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:15px}</style></head><body><div class="wrap">
<div class="hd">국존 국어전문학원 <span>상담 안내</span></div><div id="app" class="m" style="margin-top:8px">확인 중…</div>
<script>
const U='https://qcnsadcpsonuxnjyrlez.supabase.co/rest/v1/rpc/',K='sb_publishable_stx8spRryf_4OWMFsW29Rw_XiDNfyb0',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
const t=new URLSearchParams(location.search).get('t')||'';const F=(l,c)=>'<div style="margin-top:8px"><div class="m" style="margin-bottom:3px">'+l+'</div>'+c+'</div>';const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function ev(e){try{const r=await fetch(U+'gz_consult_entry',{method:'POST',headers:H,body:JSON.stringify({p_token:t,p_event:e})});return r.json();}catch(_){return null;}}
(async()=>{const app=document.getElementById('app');if(!t){app.textContent='링크가 올바르지 않습니다. 학원으로 문의해 주세요.';return;}const d=await ev('view');if(!d||!d.ok){app.textContent='만료되었거나 올바르지 않은 링크입니다. 학원(전화)으로 문의해 주세요.';return;}
 let h='<div class="card"><h2>'+esc(d.student_name||'')+' 학생 · '+esc(d.school||'')+' '+esc(d.grade||'')+' <span class="st">'+esc(d.status)+'</span></h2>';
 if(d.status==='발송'){h+='<div class="m">전화로 말씀드린 자료를 이 한 장에 모았습니다. 순서대로 보시고, 마지막에 예약을 눌러 주세요.</div></div><div id="kit"><div class="card m">자료 불러오는 중…</div></div>'
  +'<div class="card"><h2>⑤ 예약</h2><div class="m" style="margin-bottom:8px">시험지를 가지고 오시면 그 자리에서 아이 개인 진단서를 만들어 드려요.</div><a class="btn" href="https://map.naver.com/p/search/%EA%B5%AD%EC%A1%B4%20%EA%B5%AD%EC%96%B4%EC%A0%84%EB%AC%B8%ED%95%99%EC%9B%90" target="_blank" onclick="ev(\'naver_click\')">네이버로 상담 예약하기</a></div>';
  setTimeout(async()=>{try{const r=await fetch(U+'gz_consult_kit',{method:'POST',headers:H,body:JSON.stringify({p_token:t})});const k=await r.json();if(!k||!k.ok){document.getElementById('kit').innerHTML='';return;}
   const nl=x=>esc(x||'').replace(/【/g,'<b>').replace(/】/g,'</b>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');let kh='';
   kh+='<div class="card"><h2>① 우리 학교 국어 시험 분석 <span class="m">'+esc(d.school||'')+' '+esc(d.grade||'')+'</span></h2>'+(k.card_url?'<details onclick="ev(\'school_open\')"><summary style="cursor:pointer;color:#1E4D3B;font-weight:700">학교 분석지 펼치기 ▾</summary><img src="'+esc(k.card_url)+'" style="width:100%;border-radius:8px;margin-top:8px" alt="학교 분석지"></details>':'<div class="m">'+esc(d.school||'')+' 분석지는 상담 자리에서 직접 보여드립니다. 저희는 이 학교 시험지를 문제 하나하나 뜯어서 보관하고 있습니다.</div>')+'</div>';
   kh+='<div class="card"><h2>② 수업 안내</h2>'+(k.lesson?'<div class="m" style="font-weight:700;color:#1f2a24">'+esc(k.lesson.title)+'</div><details onclick="ev(\'method_open\')"><summary style="cursor:pointer;color:#1E4D3B;font-weight:700;margin-top:6px">안내 전문 펼치기 ▾</summary><div style="font-size:14px;line-height:1.7;margin-top:8px">'+nl(k.lesson.body)+'</div></details>':'<div class="m">수업 안내는 상담 자리에서 드립니다.</div>')+'</div>';
   kh+='<div class="card"><h2>③ 국어 공부 방법 <span class="m">국존 방법론에서 2편</span></h2>'+(k.methods||[]).map(m=>'<details onclick="ev(\'method_open\')" style="margin-top:6px"><summary style="cursor:pointer;color:#1E4D3B;font-weight:700">'+esc(m.area)+' — '+esc(m.title)+' ▾</summary><div style="font-size:14px;line-height:1.7;margin-top:6px">'+(m.thesis?'<b>'+esc(m.thesis)+'</b><br>':'')+esc(m.principle||'')+(m.action?'<br><b>이렇게:</b> '+esc(m.action):'')+(m.forbid?'<br><b>이건 금지:</b> '+esc(m.forbid):'')+'</div></details>').join('')+'</div>';
   if(k.proof){kh+='<div class="card" onclick="ev(\'proof_open\')"><h2>④ 국존과 '+esc(d.school||'')+'</h2><div style="font-size:14px;line-height:1.7">지금 '+esc(d.school||'')+' 학생 <b>'+k.proof.school_n+'명</b>이 국존에서 국어를 배우고 있습니다'+(k.proof.grade_n?' (같은 '+esc(d.grade||'')+' '+k.proof.grade_n+'명)':'')+(k.proof.long_n?'. 그중 '+k.proof.long_n+'명은 6개월 넘게 함께하고 있습니다.':'.')+'</div><div class="m">실제 재원 인원만 적었습니다.</div></div>';}
   document.getElementById('kit').innerHTML=kh;}catch(e){document.getElementById('kit').innerHTML='';}},30);}
else if(d.status==='예약'){h+='<div class="m">예약이 확정되었습니다. 상담 전에 아래 원서와 짧은 설문(4문항)을 미리 작성해 주시면 상담이 훨씬 빨라집니다. 시험지의 틀린 번호만 적어 주시면 상담 전에 아이 개인 진단서를 미리 만들어 둡니다.</div></div>'
  +'<div class="card"><h2>원서 <span class="m">(5분)</span></h2>'+F('학생 이름','<input id="f_name" value="'+esc(d.student_name||'')+'">')+F('학교','<input id="f_school" value="'+esc(d.school||'')+'">')+F('학년','<select id="f_grade">'+['초3','초4','초5','초6','예비중1','중1','중2','중3','예비고1','고1','고2','고3'].map(g=>'<option'+(g===d.grade?' selected':'')+'>'+g+'</option>').join('')+'</select>')+F('보호자 성함 · 관계','<div style="display:flex;gap:6px"><input id="f_parent" placeholder="성함" style="flex:1"><select id="f_rel"><option>모</option><option>부</option><option>기타</option></select></div>')+F('방문 목적 (해당하는 것 모두)','<div id="f_purpose">'+['내신','수능','기초 국어','독서·논술','상담만'].map(p=>'<label style="margin-right:10px;font-size:14px"><input type="checkbox" value="'+p+'"> '+p+'</label>').join('')+'</div>')+'</div>'
  +'<div class="card"><h2>설문 4 <span class="m">(2분)</span></h2>'+F('1. 최근 국어 성적대','<select id="s_band"><option value="">—</option>'+['90 이상','80~90','70~80','60~70','60 미만','모름'].map(x=>'<option>'+x+'</option>').join('')+'</select>')+F('2. 가장 어려운 영역','<select id="s_area"><option value="">—</option>'+['문학','독서(비문학)','문법','화법·작문','다 어려움'].map(x=>'<option>'+x+'</option>').join('')+'</select>')+F('3. 최근 시험에서 틀린 문항 번호 <span class="m">(시험 선택 → 번호. 이것만으로 진단서가 나옵니다)</span>','<select id="s_exam" style="margin-bottom:6px"><option value="">시험 선택 (불러오는 중…)</option></select><input id="s_wrong" placeholder="예: 3, 7, 12">')+F('4. 시험지 지참','<select id="s_paper"><option>지참</option><option>불가</option><option>사진 첨부(상담 때)</option></select>')+F('전하고 싶은 말 (선택)','<textarea id="s_note" rows="2"></textarea>')
  +'<button class="btn" id="fGo">보내기</button><div id="fMsg" class="m" style="margin-top:8px"></div></div>';
  setTimeout(async()=>{try{const r=await fetch(U+'gz_gpatb_exams',{method:'POST',headers:H,body:JSON.stringify({p_school:d.school||null,p_grade:d.grade||null})});const ex=await r.json();const sel=document.getElementById('s_exam');sel.innerHTML='<option value="">시험 선택'+((ex||[]).length?'':' — 목록 없음(상담 때 약식 기출로 진단)')+'</option>'+(ex||[]).map(e=>'<option value="'+esc(e.exam_name)+'">'+esc(e.exam_name)+'</option>').join('');}catch(_){}
   document.getElementById('fGo').onclick=async()=>{const g=i=>document.getElementById(i).value.trim();const m=document.getElementById('fMsg');const p={student_name:g('f_name'),school:g('f_school'),grade:g('f_grade'),parent_name:g('f_parent'),relation:g('f_rel'),purpose:[...document.querySelectorAll('#f_purpose input:checked')].map(x=>x.value),score_band:g('s_band'),hard_area:g('s_area'),exam_name:g('s_exam'),wrong:g('s_wrong').split(/[,\s]+/).filter(x=>/^\d+$/.test(x)),paper:g('s_paper'),note:g('s_note')};if(!p.student_name||!p.school||!p.grade||!p.parent_name){m.textContent='학생 이름·학교·학년·보호자 성함은 꼭 적어 주세요';return;}m.textContent='보내는 중…';try{const r=await fetch(U+'gz_consult_survey_save',{method:'POST',headers:H,body:JSON.stringify({p_token:t,p:p})});const j=await r.json();if(j&&j.ok){m.style.color='#1E4D3B';m.textContent='접수되었습니다 ✓'+(j.diag?' — 개인 진단서가 준비되었습니다('+j.summary.exam+', 오답 '+j.summary.wrong_n+'문항). 상담 때 설명드립니다.':' — 상담 때 뵙겠습니다.');setTimeout(()=>location.reload(),2500);}else m.textContent='실패: '+((j&&j.reason)||'');}catch(e){m.textContent='오류 '+e.message;}};},50);}
 else if(d.status==='셀프완료'||d.status==='검토중'){h+='<div class="m">작성해 주신 내용을 잘 받았습니다. 상담 때 뵙겠습니다.</div></div>';}
 else{h+='<div class="m">등록이 완료되었습니다. 첫 시간 안내는 담당 선생님이 드립니다.</div></div>';}
 app.innerHTML=h;})();
</script></div></body></html>
